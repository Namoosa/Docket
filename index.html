<style>
  :root{
    --ink:#20242C; --paper:#ECE7DA; --panel:#FBF9F3; --navy:#22344A; --navy-dark:#182234;
    --brass:#8F6526; --brick:#9A3B33; --sage:#556B4F; --slate:#3D5871; --line:#D8D0BB; --muted:#7B7566; --surface:#F6F1E4;
    --purple:#6B5B8C; --clay:#8A6E4B; --info:#3E6B8A;
    --overdue:#B23A32; --critical:#6B2439; --heads-up:#3E6B8A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:90px;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--navy) !important;}
  .serif{font-family:'Source Serif 4',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:var(--slate);}
  .hidden{display:none !important;}
  .input{width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-size:15px; color:var(--ink);}
  .btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:8px;border:none;background:var(--navy);color:var(--panel);font-weight:600;font-size:14px;}
  .btn-google{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:#3c4043;font-weight:600;font-size:14px;}
  .btn-ghost{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--navy);font-weight:600;font-size:13px;}
  .icon-btn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;color:var(--navy);}
  .field-label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  #auth-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .auth-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px 24px; width:100%; max-width:380px;}
  .auth-tabs{display:flex; gap:6px; margin-bottom:18px;}
  .auth-tab{flex:1; text-align:center; padding:9px 0; border-radius:7px; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--surface); color:var(--muted);}
  .auth-tab.active{background:var(--navy); color:var(--panel); border-color:var(--navy);}
  #auth-error{color:#B23A32; font-size:12.5px; margin-top:8px; min-height:16px;}
  .or-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px;}
  .or-divider::before,.or-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  header{background:var(--navy-dark); color:var(--panel); padding:16px 16px 12px;}
  .header-inner{max-width:800px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:8px;font-size:19px;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1.3px solid; font-weight:600; white-space:nowrap;}
  main{max-width:800px;margin:0 auto;padding:16px 16px 0;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tab-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:13px;}
  .tab-btn.active{background:var(--navy);color:var(--panel);border-color:var(--navy);}
  .cal-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;margin-bottom:14px;}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-wd{text-align:center;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;}
  .cal-day{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;position:relative;}
  .cal-day.today{border:1.5px solid var(--brass);}
  .cal-day.selected{border:2px solid var(--navy); background:#DFE3E8;}
  .cal-day.has-critical{box-shadow:inset 0 0 0 2px var(--critical);}
  .dot{width:5px;height:5px;border-radius:3px;}
  .overdue-mark{position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:3px;background:#B23A32;}
  .cal-icon svg{width:12.5px !important;height:12.5px !important;vertical-align:middle !important;}
  .section-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;}
  .task-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;}
  .task-row.overdue{border-color:#D9A9A3;}
  .task-check{background:none;border:1.5px solid var(--line);border-radius:5px;width:23px;height:23px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .task-title{font-size:13.5px;font-weight:600;}
  .task-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .case-card{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px;}
  .search-wrap{position:relative;margin-bottom:10px;}
  .search-wrap input{padding-left:32px;}
  .fab{position:fixed;right:20px;bottom:24px;width:56px;height:56px;border-radius:28px;background:var(--brass);color:var(--navy-dark);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);font-size:26px;z-index:40;}
  .modal-bg{position:fixed;inset:0;background:rgba(24,20,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
  .modal{background:var(--paper);width:100%;max-width:460px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 20px 28px;}
  @media(min-width:640px){ .modal{border-radius:16px; margin-bottom:5vh;} }
  .modal.wide{max-width:640px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .doc-link-row{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:5px;}
  .install-banner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;font-size:13px;line-height:1.5;}
  .party-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .party-row select{flex:0 0 34%;}
  .link-check-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .link-check-row:last-child{border-bottom:none;}
  .radio-row{display:flex;gap:8px;flex-wrap:wrap;}
  .radio-pill{flex:1;min-width:110px;text-align:center;padding:8px 6px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted);}
  .radio-pill.active{background:var(--navy);color:var(--panel);border-color:var(--navy);}
  .group-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--purple);border:1px solid var(--purple);border-radius:3px;padding:2px 6px;font-weight:600;}
  .checklist-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;}
  /* Icon sizing — inline SVGs, self-contained, no external font dependency */
  .icon-btn svg{width:18px;height:18px;}
  .tab-btn svg{margin-right:3px;}
  .fab svg{width:22px;height:22px;}
  .brand svg{width:20px;height:20px;}
  .badge svg{width:12px;height:12px;vertical-align:-2px !important;}
  #print-area{display:none;}
  .app-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy-dark);color:var(--panel);padding:11px 18px;border-radius:8px;font-size:13px;max-width:88vw;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;transition:opacity .25s, transform .25s;z-index:200;}
  .app-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block !important;position:absolute;top:0;left:0;width:100%;padding:20px;color:#000;}
    #print-area h1{font-family:'Source Serif 4',serif;font-size:22px;margin-bottom:4px;}
    #print-area .p-sub{color:#555;font-size:13px;margin-bottom:18px;}
    #print-area .p-section{margin-bottom:20px;}
    #print-area .p-section-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#555;border-bottom:1px solid #ccc;padding-bottom:4px;margin-bottom:8px;}
    #print-area .p-item{padding:6px 0;border-bottom:1px solid #eee;font-size:13.5px;}
    #print-area .p-item .p-meta{color:#666;font-size:12px;margin-top:2px;}
  }
</style>
</head>
<body>

<script>
/* ================= FIREBASE INIT ================= */
firebase.initializeApp(window.FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

/* ================= CONSTANTS ================= */
const PROCEDURE_TYPES = ["Hearing","Procedure"];
const FOLLOWUP_CHIPS = ["Prepare memorandum","Notify party","Gather documents","Review with client"];

function hashColor(str){ let h=0; for(let i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); } return HASH_PALETTE[Math.abs(h)%HASH_PALETTE.length]; }
function colorForProcedure(t){ return PROCEDURE_COLOR[t] || hashColor(t||"?"); }
function colorForCaseType(t){ return CASE_TYPE_COLOR[t] || hashColor(t||"?"); }
function iconForProcedure(t){ return PROCEDURE_ICON[t] || ICONS.tag; }

function todayKey(){ return dateKey(new Date()); }
function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return dateKey(d); }
function googleCalendarAddLink(task, caseItem){
  const title = (caseItem ? computeCaseTitle(caseItem) + " — " : "") + task.title;
  const start = task.date.replace(/-/g,"");
  const end = addDays(task.date,1).replace(/-/g,"");
  const params = new URLSearchParams({
    action: "TEMPLATE",
    text: title,
    dates: `${start}/${end}`,
    details: task.notes || ""
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}
function daysBetween(a,b){ return Math.round((parseKey(b)-parseKey(a))/86400000); }
function fmtLong(k){ const d=parseKey(k); return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function uniqueCourts(){
  const set = new Set();
  state.cases.forEach(c=>{ if(c.court && c.court.trim()) set.add(c.court.trim()); });
  return Array.from(set).sort();
}
function computeCaseTitle(c){
  if(c.titleSource==="subject" && c.subject) return c.subject;
  const wantRole = c.titleSource==="client" ? "Client" : "Opponent";
  const party = (c.parties||[]).find(p=>p.role===wantRole);
  if(party) return wantRole==="Opponent" ? `v. ${party.name}` : party.name;
  if(c.subject) return c.subject;
  if(c.parties && c.parties[0]) return c.parties[0].name;
  return "Untitled case";
}

async function googleSignIn(){
  const errEl = document.getElementById("auth-error");
  if(errEl) errEl.textContent = "";
  const provider = new firebase.auth.GoogleAuthProvider();
  // Login only — no calendar scope bundled in here. Calendar connection is
  // a fully separate step (see connectGoogleCalendar below) using Google's
  // own token-only library, independent of this login flow.
  function reportError(msg){
    if(errEl) errEl.textContent = msg;
    showToast(msg);
  }
  try{
    // Popup, not redirect: popup has reliably completed login throughout
    // testing; redirect has repeatedly failed to return a result. Since
    // login no longer needs the calendar scope, it doesn't depend on
    // capturing an access token the way the old bundled flow did — so the
    // Chrome COOP issue that broke calendar-token capture doesn't affect
    // plain login the same way.
    await auth.signInWithPopup(provider);
  }catch(e){
    const popupFailed = e && ["auth/popup-blocked","auth/cancelled-popup-request","auth/popup-closed-by-user","auth/operation-not-supported-in-this-environment"].includes(e.code);
    if(popupFailed){
      try{ await auth.signInWithRedirect(provider); }
      catch(e2){ reportError(e2.message); }
    } else {
      reportError(e.message);
    }
  }
}

});

    // Firestore's own listeners re-attach), and blindly recomputing here
    // using a possibly-stale read of googleAccessToken can silently
    // overwrite a real, just-completed connection back to "disconnected."
    if(!state.googleConnected){
      const sessionToken = loadTokenFromSession();

function stripId(t){ const {id, ...rest}=t; return rest; }

function saveCase(data){
  if(data.id){ const {id, ...rest} = data; return coll("cases").doc(id).set(rest); }
  const {id, ...rest} = data; return coll("cases").add({...rest, createdAt: Date.now()});
}
function deleteCaseDoc(id){

  state.checklist.filter(c=>c.caseId===id).forEach(c=> coll("checklist").doc(c.id).delete());

  state.cases.forEach(c=>{ if(c.linkedCaseIds && c.linkedCaseIds.includes(id)){ coll("cases").doc(c.id).set({...stripId(c), linkedCaseIds: c.linkedCaseIds.filter(x=>x!==id)}); } });
}
async function saveTask(data){
  let docId = data.id;
  const payload = stripId(data);
  if(docId){ await coll("tasks").doc(docId).set(payload); }
  else { const ref = await coll("tasks").add(payload); docId = ref.id; }
  // push to google calendar if connected
  if(state.googleConnected && state.googleAccessToken){
    const caseItem = state.cases.find(c=>c.id===payload.caseId);
    const result = await pushToGoogleCalendar({...payload, id:docId}, caseItem);
    if(result && result.needsReconnect){ state.googleConnected=false; clearTokenFromSession(); render(); }
    else if(result && result.error){ showToast(result.message); }
    else if(result && result.id){
      coll("tasks").doc(docId).set({...payload, googleEventId: result.id, googleEventLink: result.link || null});
    }
  }
  return docId;
}

/* ================= GOOGLE CALENDAR ================= */
async function pushToGoogleCalendar(task, caseItem){
  if(!state.googleAccessToken) return null;
  const summary = (caseItem ? computeCaseTitle(caseItem) + " — " : "") + task.title;
  // Reminders come from Google Calendar's own app — which already has real
  // background/lock-screen push permission on your phone — rather than
  // anything Docket could build itself without a server. Critical dates get
  // an extra, earlier reminder on top of the normal pair.
  const overrides = task.flag==="critical"
    ? [{method:"popup", minutes: 3*24*60}, {method:"popup", minutes: 24*60}, {method:"popup", minutes: 60}]
    : [{method:"popup", minutes: 24*60}, {method:"popup", minutes: 60}];
  const body = { summary, description: task.notes||"", start:{date: task.date}, end:{date: addDays(task.date,1)}, reminders: { useDefault:false, overrides } };
  try{
    let url = "https://www.googleapis.com/calendar/v3/calendars/primary/events";
    let method = "POST";
    if(task.googleEventId){ url += "/" + task.googleEventId; method = "PUT"; }
    const res = await fetch(url, { method, headers:{ "Authorization":"Bearer "+state.googleAccessToken, "Content-Type":"application/json" }, body: JSON.stringify(body) });
    if(res.status===401 || res.status===403){ return {needsReconnect:true}; }
    if(!res.ok){
      let detail = "";
      try{ const errBody = await res.json(); detail = errBody?.error?.message || ""; }catch(e){}
      return { error:true, message: `Google Calendar declined the sync (${res.status})${detail?": "+detail:""}.` };
    }
    const data = await res.json();
    return { id: data.id, link: data.htmlLink || null };
  }catch(e){
    console.error("calendar push failed", e);
    return { error:true, message: "Couldn't reach Google Calendar — check your connection and try again." };
  }
}
async function deleteFromGoogleCalendar(eventId){
  if(!state.googleAccessToken || !eventId) return;
  try{ await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, { method:"DELETE", headers:{ "Authorization":"Bearer "+state.googleAccessToken } }); }catch(e){}
}
// Token persists across a page refresh via sessionStorage — but unlike
// localStorage, it's automatically wiped the moment this tab or browser
// closes, so it doesn't linger indefinitely. Still requires reconnecting
// once the token actually expires (~1hr) or in a brand new tab/session.
function saveTokenToSession(accessToken, expiresInSeconds){
  try{
    const expiresAt = Date.now() + (Number(expiresInSeconds || 3300) * 1000);
    sessionStorage.setItem("docket_g_token", accessToken);
    sessionStorage.setItem("docket_g_token_expiry", String(expiresAt));
  }catch(e){ /* sessionStorage unavailable — connection just won't survive a refresh */ }
}
function loadTokenFromSession(){
  try{
    const token = sessionStorage.getItem("docket_g_token");
    const expiry = Number(sessionStorage.getItem("docket_g_token_expiry") || 0);
    if(token && expiry && Date.now() < expiry) return token;
    if(token){ sessionStorage.removeItem("docket_g_token"); sessionStorage.removeItem("docket_g_token_expiry"); }
  }catch(e){}
  return null;
}
function clearTokenFromSession(){
  try{ sessionStorage.removeItem("docket_g_token"); sessionStorage.removeItem("docket_g_token_expiry"); }catch(e){}
}

let gisTokenClient = null;
function getGisTokenClient(){
  if(gisTokenClient) return gisTokenClient;
  if(!window.google || !window.google.accounts || !window.google.accounts.oauth2){
    showToast("Google's sign-in library hasn't finished loading yet — try again in a moment.");
    return null;
  }
  gisTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: window.GOOGLE_OAUTH_CLIENT_ID,
    scope: "https://www.googleapis.com/auth/calendar.events",
    callback: (tokenResponse)=>{
      if(tokenResponse && tokenResponse.access_token){
        state.googleAccessToken = tokenResponse.access_token;
        state.googleConnected = true;
        state.calendarEverConnected = true;
        saveTokenToSession(tokenResponse.access_token, tokenResponse.expires_in);
        saveSettings();
        showToast("Google Calendar connected.");
        render();
      } else {
        showToast("Google didn't grant calendar access this time — please try again.");
      }
    },
    error_callback: (err)=>{
      if(err && err.type==="popup_closed") return; // user just changed their mind, no need to alarm them
      showToast("Couldn't connect Google Calendar: " + (err && err.type ? err.type : "unknown error"));
    }
  });
  return gisTokenClient;
}
// Connecting Google Calendar is now fully independent of how you signed
// into Docket (email/password or Google) — this uses Google's own
// token-only library (Google Identity Services), not Firebase's
// popup/redirect sign-in, which sidesteps both problems we hit with those:
// Chrome's popup-isolation policy, and getRedirectResult() unreliability.
window.connectGoogleCalendar = ()=>{
  const client = getGisTokenClient();
  if(client) client.requestAccessToken();
};
window.syncAllUnsynced = async ()=>{
  if(!state.googleConnected || !state.googleAccessToken){ showToast("Connect Google Calendar first."); return; }
  const unsynced = state.tasks.filter(t=>!t.completed && !t.googleEventId);
  if(unsynced.length===0){ showToast("Nothing to sync — you're all caught up."); return; }
  showToast(`Syncing ${unsynced.length} date${unsynced.length===1?'':'s'}…`);
  let successCount = 0;
  for(const t of unsynced){
    const caseItem = state.cases.find(c=>c.id===t.caseId);
    const result = await pushToGoogleCalendar(t, caseItem);
    if(result && result.needsReconnect){ state.googleConnected=false; clearTokenFromSession(); showToast("Reconnect needed partway through — synced what it could, reconnect and try again for the rest."); render(); return; }
    if(result && result.id){
      await coll("tasks").doc(t.id).set({...stripId(t), googleEventId: result.id, googleEventLink: result.link || null});
      successCount++;
    }
  }
  showToast(`Synced ${successCount} of ${unsynced.length} date${unsynced.length===1?'':'s'}.`);
  closeModal();
};
window.reconnectGoogle = window.connectGoogleCalendar;
function showToast(message){
  const el = document.createElement("div");
  el.className = "app-toast";
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add("show"); }, 10);

}

/* ================= RENDER ================= */
function render(){
  ["calendar","cases","checklist"].forEach(v=>{
    document.getElementById("tab-"+v).classList.toggle("active", state.view===v);
    document.getElementById("view-"+v).classList.toggle("hidden", state.view!==v);
  });

  const tk = todayKey();
  const upcoming = state.tasks.filter(t=>!t.completed).map(t=>({...t, delta: daysBetween(tk,t.date)})).sort((a,b)=>a.date.localeCompare(b.date));
  const headsUpItems = upcoming.filter(t=> t.delta>=0 && (t.delta<=state.alertDays || (t.flag==="fyi" && t.delta<=7)) && t.flag!=="critical");
  const overdueItems = upcoming.filter(t=>t.delta<0);
  state._headsUpItems = headsUpItems;
  state._overdueItems = overdueItems;
  const staleCases = state.cases.filter(c=> c.status==="Active" && !state.tasks.some(t=>t.caseId===c.id && !t.completed));
  state._staleCases = staleCases;

  const badges = document.getElementById("header-badges");
  badges.innerHTML = (overdueItems.length>0?`<button class="badge" onclick="toggleBadgeMenu('overdue')" style="border-color:#E5A39B;color:#E5A39B;background:none;cursor:pointer;">${overdueItems.length} overdue</button>`:"") +
                      (headsUpItems.length>0?`<button class="badge" onclick="toggleBadgeMenu('headsup')" style="border-color:var(--brass);color:var(--brass);background:none;cursor:pointer;">${headsUpItems.length} due soon</button>`:"") +
                      (staleCases.length>0?`<button class="badge" onclick="toggleBadgeMenu('stale')" style="border-color:var(--slate);color:var(--slate);background:none;cursor:pointer;">${staleCases.length} no upcoming dates</button>`:"");
  renderBadgeMenu();

  renderInstallBanner();
  renderReconnectBanner();
  if(state.view==="calendar") renderCalendar(upcoming);
  else if(state.view==="cases") renderCases();
  else renderChecklist();
}

/* ---- CALENDAR VIEW ---- */
function renderCalendar(upcoming){
  const y = state.cursorY, m = state.cursorM;
  const tk = todayKey();
  const tasksByDate = {};
  state.tasks.forEach(t=>{ (tasksByDate[t.date] = tasksByDate[t.date]||[]).push(t); });
  const casesById = {}; state.cases.forEach(c=>casesById[c.id]=c);

  const firstWd = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  let cells = "";
  for(let i=0;i<firstWd;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(y,m,d); const key = dateKey(dt);
    const items = tasksByDate[key] || [];
    const isToday = key===tk, isSel = key===state.selectedDay;
    const hasOverdue = items.some(t=>!t.completed && daysBetween(tk,key)<0);
    const activeItems = items.filter(t=>!t.completed);
    const hasCritical = activeItems.some(t=>t.flag==="critical");
    const seenTypes = new Set();
    const uniqueDisplay = [];
    activeItems.forEach(t=>{
      if(!seenTypes.has(t.type) && uniqueDisplay.length<2){ seenTypes.add(t.type); uniqueDisplay.push(t); }
    });
    const iconsHtml = uniqueDisplay.map(t=>{
      return `<span class="cal-icon" style="color:${colorForProcedure(t.type)};">${iconForProcedure(t.type)}</span>`;
    }).join("");
    const extraCount = activeItems.length - uniqueDisplay.length;
    const moreLabel = extraCount>0 ? `<span style="font-size:8px;color:var(--muted);font-weight:700;">+${extraCount}</span>` : "";
    const allDoneMark = (items.length>0 && activeItems.length===0) ? `<span class="cal-icon" style="color:#B9B29A;">${ICONS.check}</span>` : "";
    cells += `<button class="cal-day ${isToday?'today':''} ${isSel?'selected':''} ${hasCritical?'has-critical':''}" onclick="selectDay('${key}')">
      <span style="font-size:12.5px;font-weight:${isToday?700:500};color:${isToday?'var(--brass)':'var(--ink)'};">${d}</span>
      <div style="display:flex;align-items:center;justify-content:center;gap:2px;min-height:12px;">${iconsHtml}${allDoneMark}${moreLabel}</div>
      ${hasOverdue?'<div class="overdue-mark"></div>':''}
    </button>`;
  }

  const dayItems = (tasksByDate[state.selectedDay]||[]).slice().sort((a,b)=>(a.completed?1:0)-(b.completed?1:0));
  const tk2 = todayKey();
  const criticalItems = state.tasks.filter(t=>t.flag==="critical" && !t.completed).map(t=>({...t, delta:daysBetween(tk2,t.date)})).sort((a,b)=>a.date.localeCompare(b.date));

  document.getElementById("view-calendar").innerHTML = `
    ${criticalItems.length>0 ? `<div style="margin-bottom:14px;background:#FBEAE8;border:2px solid var(--brick);border-radius:10px;padding:12px 14px;">
      <div class="section-label" style="color:var(--brick);margin-bottom:8px;">${ICONS.triangle_exclamation} Critical deadlines</div>
      ${criticalItems.map(t=>taskRowHtml(t, casesById[t.caseId], true)).join("")}
    </div>` : ""}
    <div class="cal-card">
      <div class="cal-header">
        <button onclick="openMonthPicker()" style="background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:4px;" title="Jump to a month">
          <span class="serif" style="font-size:17px;color:var(--navy-dark);">${MONTHS[m]} ${y}</span>
          <span style="color:var(--muted);">${ICONS.chevron_down}</span>
        </button>
        <div style="display:flex;gap:6px;">
          <button class="icon-btn" style="width:auto;padding:0 10px;font-size:12px;font-weight:600;" onclick="gotoToday()">Today</button>
          <button class="icon-btn" onclick="gotoMonth(-1)">${ICONS.chevron_left}</button>
          <button class="icon-btn" onclick="gotoMonth(1)">${ICONS.chevron_right}</button>
        </div>
      </div>
      <div id="cal-swipe-area">
      <div class="cal-grid" style="margin-bottom:4px;">${WD.map(w=>`<div class="cal-wd">${w}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
      </div>
    </div>
    <div style="margin-bottom:18px;">
      <div class="section-label">${fmtLong(state.selectedDay)}${state.selectedDay===tk?' · Today':''}</div>
      ${dayItems.length===0 ? `<div style="color:var(--muted);font-size:13.5px;padding:10px 2px;">Nothing scheduled this day.</div>` :
        dayItems.map(t=>taskRowHtml(t, casesById[t.caseId], false)).join("")}
    </div>
    <div>
      <div class="section-label">Upcoming</div>
      ${upcoming.filter(t=>t.delta>=0).slice(0,8).map(t=>taskRowHtml(t, casesById[t.caseId], true)).join("")}
      ${upcoming.filter(t=>t.delta<0).length>0 ? `<div style="font-size:11.5px;color:#B23A32;font-weight:700;margin:6px 0;letter-spacing:.04em;text-transform:uppercase;">Overdue</div>` +
        upcoming.filter(t=>t.delta<0).map(t=>taskRowHtml(t, casesById[t.caseId], true)).join("") : ""}
      ${upcoming.length===0 ? `<div style="color:var(--muted);font-size:13.5px;">No upcoming dates. Tap + to add one.</div>` : ""}
    </div>
  `;
  attachSwipeHandler();
}
function taskRowHtml(t, caseItem, showDate){
  const isDeadline = t.kind==="deadline";
  const isCritical = t.flag==="critical";
  const isFyi = t.flag==="fyi";
  const overdue = t.delta<0 && !t.completed;
  // Heads-up: automatic (within your alertDays window) OR manually forced via the FYI flag,
  // whichever gives more notice. Critical and Overdue are the only two colors that override
  // the icon itself — everything else keeps its normal category color, with urgency shown
  // only via the badge text, so "what it is" and "how urgent" never get confused for each other.
  const autoHeadsUp = !overdue && showDate && t.delta<=state.alertDays && t.delta>=0;
  const fyiHeadsUp = isFyi && !overdue && typeof t.delta==="number" && t.delta<=7 && t.delta>=0;
  const headsUp = !isCritical && (autoHeadsUp || fyiHeadsUp);
  const baseIcon = iconForProcedure(t.type);
  const baseColor = colorForProcedure(t.type);
  const icon = baseIcon;
  const color = overdue ? "var(--overdue)" : (isCritical ? "var(--critical)" : baseColor);
  const countdownLabel = t.delta===0 ? "Today" : `${t.delta}d`;
  let statusBadge = "";
  if(overdue){ statusBadge = `<span class="badge" style="border-color:var(--overdue);color:var(--overdue);">${isDeadline?'Missed deadline':'Overdue'}</span>`; }
  else if(!t.completed && typeof t.delta==="number"){
    if(isCritical) statusBadge = `<span class="badge" style="border-color:var(--critical);color:var(--critical);background:#F6E8EC;">CRITICAL · ${countdownLabel}</span>`;
    else if(headsUp) statusBadge = `<span class="badge" style="border-color:var(--heads-up);color:var(--heads-up);">${countdownLabel} · heads-up</span>`;
  }
  const isNextHearingForCase = caseItem && t.type==="Hearing" && !t.completed && nextHearingForCase(caseItem.id)?.id===t.id;
  const prepItems = state.checklist.filter(c=> c.taskId===t.id || (isNextHearingForCase && c.followNextHearing && c.caseId===caseItem.id));
  const prepDone = prepItems.filter(c=>c.done).length;
  const prepHtml = prepItems.length ? `
    <div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);">
      <div style="font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;">Prep for this date — ${prepDone}/${prepItems.length}</div>
      ${prepItems.map(it=>`
        <div style="display:flex;align-items:center;gap:7px;padding:2px 0;" onclick="event.stopPropagation()">
          <button class="task-check" style="width:16px;height:16px;${it.done?'border-color:var(--sage);':''}" onclick="toggleChecklistDone('${it.id}')">${it.done?ICONS.check:''}</button>
          <span style="font-size:12.5px;${it.done?'text-decoration:line-through;color:var(--muted);':''}">${esc(it.text)}</span>
        </div>`).join("")}
    </div>` : "";
  return `<div class="task-row ${overdue?'overdue':''}" style="border-left:4px solid ${color};${isCritical?'border-width:5px;':''}">
    <button class="task-check" onclick="toggleTaskDone('${t.id}')">${t.completed?ICONS.check:''}</button>
    <div style="flex:1;min-width:0;cursor:pointer;" onclick='openTaskModal(${JSON.stringify(t).replace(/'/g,"&apos;")})'>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <span class="task-title-icon" style="color:${color};">${icon}</span>
        <span class="task-title" style="${t.completed?'text-decoration:line-through;color:var(--muted);':''}">${esc(t.title)}${isDeadline?' <span style="font-size:11px;color:var(--muted);font-weight:500;">(deadline)</span>':''}</span>
        ${t.googleEventId?`<a href="${esc(t.googleEventLink||('https://calendar.google.com/calendar/r/search?q='+encodeURIComponent(t.title)))}" target="_blank" onclick="event.stopPropagation()" title="Open in Google Calendar" style="color:var(--slate);display:inline-flex;">${ICONS.calendar_check}</a>`:
          `<a href="${esc(googleCalendarAddLink(t, caseItem))}" target="_blank" onclick="event.stopPropagation()" title="Add to Google Calendar" style="color:var(--muted);display:inline-flex;">${ICONS.calendar_days}</a>`}
        ${statusBadge}
      </div>
      <div class="task-meta">${caseItem?computeCaseTitle(caseItem):"No case linked"}${caseItem&&caseItem.court?` · ${ICONS.location_dot} ${esc(caseItem.court)}`:""}${showDate?` · ${fmtLong(t.date)}`:""}</div>
      ${t.postponeReason?`<div class="task-meta" style="color:var(--brass);margin-top:2px;">↳ Postponed: ${esc(t.postponeReason)}</div>`:""}
      ${prepHtml}
    </div>
    <button onclick="deleteTaskDoc('${t.id}')" style="background:none;border:none;color:var(--muted);">${ICONS.trash}</button>
  </div>`;
}
window.selectDay = (k)=>{ state.selectedDay=k; render(); };
window.gotoMonth = (delta)=>{ let m=state.cursorM+delta, y=state.cursorY; if(m<0){m=11;y--;} if(m>11){m=0;y++;} state.cursorM=m; state.cursorY=y; render(); attachSwipeHandler(); };
function attachSwipeHandler(){
  const el = document.getElementById("cal-swipe-area");
  if(!el) return;
  let startX=0, startY=0, tracking=false;
  el.ontouchstart = (e)=>{ startX=e.touches[0].clientX; startY=e.touches[0].clientY; tracking=true; };
  el.ontouchend = (e)=>{
    if(!tracking) return; tracking=false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5){ gotoMonth(dx<0?1:-1); }
  };
}
window.openMonthPicker = ()=>{
  document.getElementById("modal-root").innerHTML = `
  <div class="modal-bg" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><h2 class="serif" style="font-size:20px;color:var(--navy-dark);margin:0;">Jump to a month</h2><button class="icon-btn" onclick="closeModal()">${ICONS.xmark}</button></div>
      <div class="field"><span class="field-label">Year</span>
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="icon-btn" onclick="shiftPickerYear(-1)">${ICONS.chevron_left}</button>
          <span id="picker-year" class="serif" style="font-size:18px;flex:1;text-align:center;">${state.cursorY}</span>
          <button class="icon-btn" onclick="shiftPickerYear(1)">${ICONS.chevron_right}</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
        ${MONTHS.map((mn,i)=>`<button class="btn-ghost" data-month="${i}" onclick="jumpToMonth(${i})" style="${i===state.cursorM?'background:var(--navy);color:var(--panel);border-color:var(--navy);':''}">${mn.slice(0,3)}</button>`).join("")}
      </div>
    </div>
  </div>`;
  window._pickerYear = state.cursorY;
};
window.shiftPickerYear = (d)=>{ window._pickerYear += d; document.getElementById("picker-year").textContent = window._pickerYear; };
window.jumpToMonth = (m)=>{ state.cursorM=m; state.cursorY=window._pickerYear; closeModal(); render(); attachSwipeHandler(); };
window.gotoToday = ()=>{ const d=new Date(); state.cursorY=d.getFullYear(); state.cursorM=d.getMonth(); state.selectedDay=todayKey(); render(); };
window.toggleTaskDone = toggleTaskDone;
window.deleteTaskDoc = deleteTaskDoc;

/* ---- CASES VIEW ---- */
function renderCases(){
  const allCaseTypes = [...CASE_TYPES, ...state.customCaseTypes];
  const courts = uniqueCourts();
  const q = state.search.trim().toLowerCase();
  const hideClosed = state.hideClosed!==false && !q;
  const filtered = state.cases.filter(c=>{
    if(hideClosed && c.status==="Closed" && state.filterStatus!=="Closed") return false;
    if(state.filterType!=="All" && c.caseType!==state.filterType) return false;
    if(state.filterStatus!=="All" && c.status!==state.filterStatus) return false;
    if(state.filterCourt && state.filterCourt!=="All" && c.court!==state.filterCourt) return false;
    if(!q) return true;
    const title = computeCaseTitle(c).toLowerCase();
    const partyMatch = (c.parties||[]).some(p=>p.name.toLowerCase().includes(q));
    return title.includes(q) || (c.courtNumber||"").toLowerCase().includes(q) || (c.court||"").toLowerCase().includes(q) || (c.subject||"").toLowerCase().includes(q) || (c.partialNumber||"").toLowerCase().includes(q) || (c.generalNumber||"").toLowerCase().includes(q) || partyMatch;
  }).sort((a,b)=> (b.priority?1:0)-(a.priority?1:0) || (b.createdAt||0)-(a.createdAt||0));

  const closedCount = state.cases.filter(c=>c.status==="Closed").length;

  let courtBlock = "";
  if(state.filterCourt && state.filterCourt!=="All"){
    const tk = todayKey();
    const caseIdsHere = new Set(state.cases.filter(c=>c.court===state.filterCourt).map(c=>c.id));
    const casesById = {}; state.cases.forEach(c=>casesById[c.id]=c);
    const tasksHere = state.tasks.filter(t=>caseIdsHere.has(t.caseId) && !t.completed)
      .map(t=>({...t, delta: daysBetween(tk,t.date)})).sort((a,b)=>a.date.localeCompare(b.date));
    courtBlock = `<div style="margin-bottom:18px;">
      <div class="section-label">${ICONS.location_dot} At ${esc(state.filterCourt)} — every open procedure & deadline</div>
      ${tasksHere.length===0 ? `<div style="color:var(--muted);font-size:13.5px;">Nothing open at this court right now.</div>` :
        tasksHere.map(t=>taskRowHtml(t, casesById[t.caseId], true)).join("")}
    </div>`;
  }

  document.getElementById("view-cases").innerHTML = `
    <div class="search-wrap">
      <span style="position:absolute;left:11px;top:11px;color:var(--muted);">${ICONS.magnifying_glass}</span>
      <input class="input" id="search-input" placeholder="Search by name, title, court, or file number…" value="${esc(state.search)}" />
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;">
      <select class="input" id="filter-court" style="width:auto;font-size:12.5px;padding:7px 9px;">
        <option value="All">All courts / prosecution offices</option>
        ${courts.map(c=>`<option value="${esc(c)}" ${state.filterCourt===c?'selected':''}>${esc(c)}</option>`).join("")}
      </select>
      <select class="input" id="filter-type" style="width:auto;font-size:12.5px;padding:7px 9px;">
        <option value="All">All case types</option>
        ${allCaseTypes.map(t=>`<option value="${esc(t)}" ${state.filterType===t?'selected':''}>${esc(t)}</option>`).join("")}
      </select>
      <select class="input" id="filter-status" style="width:auto;font-size:12.5px;padding:7px 9px;">
        <option value="All">All statuses</option>
        ${STATUS_OPTIONS.map(s=>`<option value="${s}" ${state.filterStatus===s?'selected':''}>${s}</option>`).join("")}
      </select>
    </div>
    ${closedCount>0 ? `<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:12px;">
      <input type="checkbox" id="toggle-closed" ${state.hideClosed===false?'':'checked'} /> Hide closed cases (${closedCount} hidden)
    </label>` : ""}
    ${courtBlock}
    ${filtered.length===0 ? `<div style="text-align:center;padding:40px 10px;color:var(--muted);">${ICONS.scale_balanced}<br/><div style="font-size:14px;margin-top:8px;">No matters yet. Tap + to add your first case.</div></div>` :
      `<div>${filtered.map(c=>caseCardHtml(c)).join("")}</div>`}
  `;
  document.getElementById("search-input").oninput = e=>{ const pos=e.target.selectionStart; state.search=e.target.value; renderCases(); const el=document.getElementById("search-input"); el.focus(); el.setSelectionRange(pos,pos); };
  document.getElementById("filter-court").onchange = e=>{ state.filterCourt=e.target.value; render(); };
  document.getElementById("filter-type").onchange = e=>{ state.filterType=e.target.value; render(); };
  document.getElementById("filter-status").onchange = e=>{ state.filterStatus=e.target.value; render(); };
  const tc = document.getElementById("toggle-closed");
  if(tc) tc.onchange = e=>{ state.hideClosed = e.target.checked; render(); };
}
function caseCardHtml(c){
  const color = colorForCaseType(c.caseType);
  const statusColor = c.status==="Closed" ? "var(--muted)" : c.status==="Active" ? "var(--sage)" : "var(--brass)";
  const groupSize = (c.linkedCaseIds||[]).filter(lid=>state.cases.some(x=>x.id===lid)).length;

  const locationPiece = c.court
    ? `${ICONS.location_dot} ${esc(c.court)}${c.authorityType==="court"&&c.chamber?` (${esc(c.chamber)})`:""}${c.authorityType==="prosecution"&&c.prosecutorInCharge?` (${esc(c.prosecutorInCharge)})`:""}`
    : (c.caseType==="Counsel"&&c.dateReceived) ? `${ICONS.calendar_days} Received ${fmtLong(c.dateReceived)}`
    : (c.caseType==="Criminal"&&(c.partialNumber||c.generalNumber)) ? `${c.partialNumber?esc(c.partialNumber):""}${c.partialNumber&&c.generalNumber?" · ":""}${c.generalNumber?"Gen. "+esc(c.generalNumber):""}`
    : c.courtNumber ? esc(c.courtNumber) : "";

  const metaPieces = [
    `<span class="case-type-icon" style="color:${color};">${iconForCaseType(c.caseType)}</span> ${esc(c.caseType)}`,
    locationPiece,
    (c.documents&&c.documents.length) ? `${ICONS.link} ${c.documents.length}` : "",
    groupSize>0 ? `${ICONS.link} linked (${groupSize})` : ""
  ].filter(Boolean);

  return `<button class="case-card" style="${c.priority?'border-color:var(--brass);border-width:1.5px;':''}" onclick="openCaseDetail('${c.id}')">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
      <div class="serif" style="font-size:16px;color:var(--navy-dark);min-width:0;">${c.priority?(ICONS.star+' '):''}${esc(computeCaseTitle(c))}</div>
      <span class="badge" style="border-color:${statusColor};color:${statusColor};flex-shrink:0;">${c.status}</span>
    </div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;align-items:center;flex-wrap:wrap;gap:3px;">
      ${metaPieces.map((p,i)=>i===0?p:` · ${p}`).join("")}
    </div>
  </button>`;
}
window.openCaseDetail = (id)=> openCaseDetailModal(state.cases.find(c=>c.id===id));

/* ---- CHECKLIST VIEW ---- */
function renderChecklist(){
  const casesById = {}; state.cases.forEach(c=>casesById[c.id]=c);
  const tasksById = {}; state.tasks.forEach(t=>tasksById[t.id]=t);
  const tk = todayKey();
  const items = state.checklist.slice().sort((a,b)=> (a.done - b.done) || (b.createdAt||0)-(a.createdAt||0));
  document.getElementById("view-checklist").innerHTML = `
    ${items.length===0 ? `<div style="text-align:center;padding:40px 10px;color:var(--muted);">${ICONS.list_check}<br/><div style="font-size:14px;margin-top:8px;">Nothing on your checklist. Tap + to add a task.</div></div>` :
      items.map(it=>{
        const c = casesById[it.caseId];
        const linkedTask = it.taskId ? tasksById[it.taskId] : null;
        const followedHearing = (it.followNextHearing && it.caseId) ? nextHearingForCase(it.caseId) : null;
        const effectiveTask = linkedTask || followedHearing;
        const effectiveDate = it.dueDate || (linkedTask ? linkedTask.date : null) || (followedHearing ? followedHearing.date : null);
        const hasOwnDeadline = !!it.dueDate;
        const deltaDays = effectiveDate ? daysBetween(tk, effectiveDate) : null;
        const isOverdue = effectiveDate && deltaDays<0 && !it.done;
        const rowColor = isOverdue ? "var(--overdue)" : effectiveTask ? (effectiveTask.flag==="critical" ? "var(--critical)" : colorForProcedure(effectiveTask.type)) : (hasOwnDeadline ? "var(--heads-up)" : (c ? colorForCaseType(c.caseType) : "var(--line)"));
        const rowIcon = hasOwnDeadline ? ICONS.hourglass_half : (effectiveTask ? iconForProcedure(effectiveTask.type) : (c ? iconForCaseType(c.caseType) : ""));
        const deadlineBadge = effectiveDate && !it.done
          ? (isOverdue ? `<span class="badge" style="border-color:var(--overdue);color:var(--overdue);">Overdue</span>` : `<span class="badge" style="border-color:var(--heads-up);color:var(--heads-up);">${deltaDays===0?'Today':deltaDays+'d'}</span>`)
          : "";
        const metaLine = hasOwnDeadline
          ? `Due ${fmtLong(it.dueDate)}${c?` · ${esc(computeCaseTitle(c))}`:""}`
          : linkedTask
          ? `Before: ${esc(linkedTask.title)} · ${fmtLong(linkedTask.date)}${c?` · ${esc(computeCaseTitle(c))}`:""}`
          : followedHearing
          ? `Before next hearing · ${fmtLong(followedHearing.date)}${c?` · ${esc(computeCaseTitle(c))}`:""}`
          : it.followNextHearing
          ? `Before next hearing (none scheduled yet)${c?` · ${esc(computeCaseTitle(c))}`:""}`
          : (c ? esc(computeCaseTitle(c)) : "");
        return `<div class="checklist-row" style="border-left:4px solid ${it.done?'var(--line)':rowColor};">
          <button class="task-check" onclick="toggleChecklistDone('${it.id}')" style="${it.done?'border-color:var(--sage);':''}">${it.done?ICONS.check:''}</button>
          <div style="flex:1;min-width:0;cursor:pointer;" onclick='openChecklistModal(${JSON.stringify(it).replace(/'/g,"&apos;")})'>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              ${rowIcon&&!it.done?`<span style="color:${rowColor};flex-shrink:0;">${rowIcon}</span>`:""}
              <span style="font-size:13.5px;font-weight:600;${it.done?'text-decoration:line-through;color:var(--muted);':''}">${esc(it.text)}</span>
              ${deadlineBadge}
            </div>
            ${metaLine?`<div class="task-meta">${(linkedTask||it.followNextHearing)?`${ICONS.calendar_days} `:""}${metaLine}</div>`:""}
          </div>
          <button onclick="deleteChecklistItem('${it.id}')" style="background:none;border:none;color:var(--muted);">${ICONS.trash}</button>
        </div>`;
      }).join("")}
  `;
}
window.toggleChecklistDone = toggleChecklistDone;
window.deleteChecklistItem = deleteChecklistItem;

function openChecklistModal(existing){
  const it = existing || {caseId:"", text:"", done:false, taskId:"", followNextHearing:false};
  window._tempLinkMode = it.followNextHearing ? "hearing" : (it.dueDate ? "deadline" : "date");
  const openTasksForCase = (caseId)=> state.tasks.filter(t=>t.caseId===caseId && !t.completed).sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById("modal-root").innerHTML = `
  <div class="modal-bg" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><h2 class="serif" style="font-size:20px;color:var(--navy-dark);margin:0;">${existing?'Edit':'New'} Checklist Item</h2><button class="icon-btn" onclick="closeModal()">${ICONS.xmark}</button></div>
      <div class="field"><span class="field-label">Task</span><input class="input" id="chk-text" value="${esc(it.text)}" placeholder="e.g. Prepare witness list" /></div>
      <div class="field"><span class="field-label">Link to a case (optional)</span>
        <select class="input" id="chk-case" onchange="refreshChecklistTaskOptions()">
          <option value="">General — no case</option>
          ${state.cases.map(c=>`<option value="${c.id}" ${it.caseId===c.id?'selected':''}>${esc(computeCaseTitle(c))}</option>`).join("")}
        </select>
      </div>
      <div class="field" id="chk-task-field" style="${it.caseId?'':'display:none;'}">
        <span class="field-label">Link to</span>
        <div class="radio-row" id="chk-linkmode-row" style="margin-bottom:8px;">
          <button type="button" class="radio-pill ${window._tempLinkMode==='date'?'active':''}" data-v="date" onclick="setChecklistLinkMode('date')">A specific date</button>
          <button type="button" class="radio-pill ${window._tempLinkMode==='hearing'?'active':''}" data-v="hearing" onclick="setChecklistLinkMode('hearing')">Next court hearing</button>
          <button type="button" class="radio-pill ${window._tempLinkMode==='deadline'?'active':''}" data-v="deadline" onclick="setChecklistLinkMode('deadline')">Set a deadline</button>
        </div>
        <div id="chk-date-picker" class="${window._tempLinkMode==='date'?'':'hidden'}">
          <select class="input" id="chk-task">
            <option value="">Not tied to a specific date</option>
            ${it.caseId ? openTasksForCase(it.caseId).map(t=>`<option value="${t.id}" ${it.taskId===t.id?'selected':''}>${esc(t.title)} — ${fmtLong(t.date)}</option>`).join("") : ""}
          </select>
          <div style="font-size:11.5px;color:var(--muted);margin-top:5px;">Means: finish this before that date. Flags it urgent as it approaches.</div>
        </div>
        <div id="chk-hearing-note" class="${window._tempLinkMode==='hearing'?'':'hidden'}" style="font-size:11.5px;color:var(--muted);">Means: finish this before whichever Hearing is next for this case. If it gets postponed, this moves with it — no need to re-link.</div>
        <div id="chk-deadline-picker" class="${window._tempLinkMode==='deadline'?'':'hidden'}">
          <input class="input" id="chk-due-date" type="date" value="${it.dueDate||''}" />
          <div style="font-size:11.5px;color:var(--muted);margin-top:5px;">Means: finish this before this date — for when there's no hearing or existing date to tie it to.</div>
        </div>
      </div>
      <button class="btn-primary" style="width:100%;" onclick="submitChecklist(${existing?`'${existing.id}'`:'null'})">${existing?'Save changes':'Add item'}</button>
    </div>
  </div>`;
}
window.setChecklistLinkMode = (v)=>{
  window._tempLinkMode = v;
  document.querySelectorAll("#chk-linkmode-row .radio-pill").forEach(b=>b.classList.toggle("active", b.dataset.v===v));
  document.getElementById("chk-date-picker").classList.toggle("hidden", v!=="date");
  document.getElementById("chk-hearing-note").classList.toggle("hidden", v!=="hearing");
  document.getElementById("chk-deadline-picker").classList.toggle("hidden", v!=="deadline");
};
window.refreshChecklistTaskOptions = ()=>{
  const caseId = document.getElementById("chk-case").value;
  const field = document.getElementById("chk-task-field");
  const select = document.getElementById("chk-task");
  if(!caseId){ field.style.display="none"; select.innerHTML = `<option value="">Not tied to a specific date</option>`; return; }
  field.style.display = "";
  const openTasks = state.tasks.filter(t=>t.caseId===caseId && !t.completed).sort((a,b)=>a.date.localeCompare(b.date));
  select.innerHTML = `<option value="">Not tied to a specific date</option>` +
    openTasks.map(t=>`<option value="${t.id}">${esc(t.title)} — ${fmtLong(t.date)}</option>`).join("");
};
window.openChecklistModal = openChecklistModal;
function nextHearingForCase(caseId){
  const tk = todayKey();
  return state.tasks.filter(t=>t.caseId===caseId && !t.completed && t.type==="Hearing")
    .sort((a,b)=>a.date.localeCompare(b.date))[0] || null;
}
window.submitChecklist = (id)=>{
  const text = document.getElementById("chk-text").value.trim();
  if(!text) return;
  const existing = id ? state.checklist.find(x=>x.id===id) : null;
  const caseId = document.getElementById("chk-case").value || null;
  const mode = window._tempLinkMode;
  const followNextHearing = !!(caseId && mode === "hearing");
  const isDeadlineMode = mode === "deadline";
  const taskSel = document.getElementById("chk-task");
  const dueDateInput = document.getElementById("chk-due-date");
  const data = {
    text, caseId,
    taskId: (mode==="date" && taskSel) ? (taskSel.value || null) : null,
    followNextHearing,
    dueDate: (isDeadlineMode && dueDateInput && dueDateInput.value) ? dueDateInput.value : null,
    done: existing ? existing.done : false
  };
  if(id) data.id = id;
  saveChecklistItem(data);
  closeModal();
};

/* ================= MODALS ================= */

window.closeModal = closeModal;

window.openTaskModal = openTaskModal;
window.setTaskKind = (v)=>{ window._tempKind=v; document.querySelectorAll("#kind-row .radio-pill").forEach(b=>b.classList.toggle("active", b.dataset.v===v)); updateKindLabels(); };
window.setProcType = (v)=>{ window._tempProcType=v; document.querySelectorAll("#proc-type-row .radio-pill").forEach(b=>b.classList.toggle("active", b.dataset.v===v)); };
window._tempFlag = window._tempFlag || "none";
window.setTaskFlag = (v)=>{
  window._tempFlag = v;
  document.querySelectorAll("#flag-row .radio-pill").forEach(b=>{
    const active = b.dataset.v===v;
    b.classList.toggle("active", active);
    if(v==="fyi"){ b.style.background = (b.dataset.v==="fyi") ? "var(--heads-up)" : ""; b.style.borderColor = (b.dataset.v==="fyi") ? "var(--heads-up)" : ""; }
    else if(v==="critical"){ b.style.background = (b.dataset.v==="critical") ? "var(--critical)" : ""; b.style.borderColor = (b.dataset.v==="critical") ? "var(--critical)" : ""; }
    else { b.style.background = ""; b.style.borderColor = ""; }
  });
  const hint = document.getElementById("flag-hint");
  hint.textContent = v==="critical" ? "A can't-miss date — pinned to the top of your Calendar no matter how far away it is."
    : v==="fyi" ? "Not urgent — shows a quiet heads-up once it's within 7 days out."
    : "No flag — this date only shows the normal due-soon heads-up close to its date, based on your Settings.";
};
window.toggleRepeatFields = (checked)=>{
  document.getElementById("repeat-fields").classList.toggle("hidden", !checked);
  document.getElementById("repeat-hint").classList.toggle("hidden", !checked);
};
function updateKindLabels(){
  const isDeadline = window._tempKind==="deadline";
  const titleLabel = document.getElementById("f-title-label");
  const dateLabel = document.getElementById("f-date-label");
  if(titleLabel) titleLabel.textContent = isDeadline ? "What's due" : "Title";
  if(dateLabel) dateLabel.textContent = isDeadline ? "Deadline date" : "Date";
}
window.submitTask = (id)=>{
  const title = document.getElementById("f-title").value.trim();
  const date = document.getElementById("f-date").value;
  if(!title || !date) return;
  const caseSel = document.getElementById("f-caseId");
  const type = window._tempProcType || PROCEDURE_TYPES[0];
  const existing = id ? state.tasks.find(x=>x.id===id) : null;
  const baseData = { caseId: caseSel? (caseSel.value||null) : null, type, kind: window._tempKind||"event", flag: window._tempFlag||"none", notes: document.getElementById("f-notes").value.trim(), completed: existing?existing.completed:false, googleEventId: existing?existing.googleEventId:null };
  // Procedure type is now fixed to Hearing/Procedure — no custom-type registration needed.

  const repeatOn = document.getElementById("f-repeat-on");
  if(!existing && repeatOn && repeatOn.checked){
    const interval = Number(document.getElementById("f-repeat-freq").value);
    const count = Math.max(2, Math.min(20, Number(document.getElementById("f-repeat-count").value)||2));
    for(let i=0;i<count;i++){
      const occDate = addDays(date, i*interval);
      saveTask({ ...baseData, title: `${title} — Session ${i+1} of ${count}`, date: occDate });
    }
  } else {
    const data = { ...baseData, title, date };
    if(id) data.id = id;
    saveTask(data);
  }
  closeModal();
};

function followUpChipsHtml(){
  return FOLLOWUP_CHIPS.map(f=>`<button type="button" class="btn-ghost" style="font-size:11.5px;padding:5px 9px;${window._tempFollowUps.includes(f)?'border-color:var(--navy);color:var(--navy);font-weight:700;':''}" onclick="toggleFollowUp('${f.replace(/'/g,"&apos;")}')">${esc(f)}</button>`).join("");
}
function followUpSelectedHtml(){
  if(!window._tempFollowUps.length) return `<div style="font-size:11px;color:var(--muted);margin-top:4px;">Not every postponement needs follow-up work — leave blank if there's nothing to prep.</div>`;
  return `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;">${window._tempFollowUps.map(f=>`<span class="badge" style="border-color:var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:5px;">${esc(f)} <button onclick="removeFollowUp('${f.replace(/'/g,"&apos;")}')" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0;">${ICONS.xmark}</button></span>`).join("")}</div>`;
}
window.toggleFollowUp = (f)=>{
  const idx = window._tempFollowUps.indexOf(f);
  if(idx>=0) window._tempFollowUps.splice(idx,1); else window._tempFollowUps.push(f);
  document.getElementById("followup-chips").innerHTML = followUpChipsHtml();
  document.getElementById("followup-selected").innerHTML = followUpSelectedHtml();
};
window.addCustomFollowUp = ()=>{
  const input = document.getElementById("cont-followup-custom");
  const v = input.value.trim();
  if(!v) return;
  if(!window._tempFollowUps.includes(v)) window._tempFollowUps.push(v);
  input.value = "";
  document.getElementById("followup-chips").innerHTML = followUpChipsHtml();
  document.getElementById("followup-selected").innerHTML = followUpSelectedHtml();
};
window.removeFollowUp = (f)=>{
  window._tempFollowUps = window._tempFollowUps.filter(x=>x!==f);
  document.getElementById("followup-chips").innerHTML = followUpChipsHtml();
  document.getElementById("followup-selected").innerHTML = followUpSelectedHtml();
};
function openContinueModal(t){

  document.getElementById("modal-root").innerHTML = `
  <div class="modal-bg" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><h2 class="serif" style="font-size:20px;color:var(--navy-dark);margin:0;">${ICONS.rotate} Continue Session</h2><button class="icon-btn" onclick="closeModal()">${ICONS.xmark}</button></div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:14px;">Schedules the next session for "${esc(t.title)}" on a new date.</div>
      <div class="field"><span class="field-label">Reason for postponement (optional)</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">
          ${["Judge unavailable","Opposing counsel requested","Missing documents","Party absent","Court backlog"].map(r=>`<button type="button" class="btn-ghost" style="font-size:11.5px;padding:5px 9px;" onclick="fillReason('${r}')">${r}</button>`).join("")}
        </div>
        <input class="input" id="cont-reason" placeholder="Tap a quick option above, or type your own" />
      </div>
      <div class="field"><span class="field-label">Next session date</span><input class="input" id="cont-date" type="date" value="${addDays(t.date,14)}" /></div>
      <div class="field"><label style="display:flex;align-items:center;gap:8px;font-size:13.5px;"><input type="checkbox" id="cont-markdone" checked /> Mark the original date as completed</label></div>
      <div class="field"><span class="field-label">Follow-up action (optional)</span>
        <div id="followup-chips" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">${followUpChipsHtml()}</div>
        <div style="display:flex;gap:6px;">
          <input class="input" id="cont-followup-custom" placeholder="Or type a custom follow-up and tap Add" />
          <button class="btn-ghost" onclick="addCustomFollowUp()">Add</button>
        </div>
        <div id="followup-selected">${followUpSelectedHtml()}</div>
      </div>
      <button class="btn-primary" style="width:100%;" onclick="submitContinue('${t.id}')">Schedule next session</button>
    </div>
  </div>`;
}
window.fillReason = (r)=>{ document.getElementById("cont-reason").value = r; };
window.openContinueModal = openContinueModal;
window.submitContinue = (origId)=>{
  const newDate = document.getElementById("cont-date").value;
  if(!newDate) return;
  const reason = document.getElementById("cont-reason").value.trim();
  const orig = state.tasks.find(x=>x.id===origId);
  if(!orig) return;
  const followUps = (window._tempFollowUps||[]).slice();
  saveTask({ caseId:orig.caseId, title:orig.title, date:newDate, type:orig.type, kind:orig.kind||"event", flag:orig.flag||"none", notes:orig.notes, completed:false, googleEventId:null }).then((newTaskId)=>{
    if(!followUps.length) return;
    const useFollowHearing = orig.type==="Hearing" && !!orig.caseId;
    followUps.forEach(text=>{
      saveChecklistItem({ caseId: orig.caseId||"", text, done:false, taskId: useFollowHearing?"":(newTaskId||""), followNextHearing: useFollowHearing, dueDate:null });
    });
  });
  if(document.getElementById("cont-markdone").checked){
    coll("tasks").doc(origId).set({...stripId(orig), completed:true, postponeReason: reason || orig.postponeReason || null});
  } else if(reason){
    coll("tasks").doc(origId).set({...stripId(orig), postponeReason: reason});
  }
  closeModal();
};

function openCaseModal(existingRaw){
  const existing = (existingRaw && existingRaw.id) ? existingRaw : null;
  const allCaseTypes = [...CASE_TYPES, ...state.customCaseTypes];
  const c = existingRaw || {titleSource:"opponent", subject:"", parties:[], courtNumber:"", caseType:allCaseTypes[0], status:"Active", notes:"", documents:[], linkedCaseIds:[], dateReceived: todayKey()};
  window._tempDocs = (c.documents||[]).slice();
  window._tempParties = (c.parties||[]).slice();

window.openCaseModal = openCaseModal;
window.onCaseTypeSelectChange = ()=>{
  const sel = document.getElementById("c-type-select");
  const custom = document.getElementById("c-type-custom");
  custom.classList.toggle("hidden", sel.value !== "__other__");
  onCaseTypeChange();
};
function getCaseTypeValue(){
  const sel = document.getElementById("c-type-select");
  if(sel.value === "__other__") return document.getElementById("c-type-custom").value.trim();
  return sel.value;
}
window.onCaseTypeChange = ()=>{
  const val = getCaseTypeValue();
  const isCounsel = val === "Counsel";
  const isCriminal = val === "Criminal";
  document.getElementById("counsel-fields").classList.toggle("hidden", !isCounsel);
  document.getElementById("standard-fields").classList.toggle("hidden", isCounsel);
  document.getElementById("generic-number-field").classList.toggle("hidden", isCriminal);
  document.getElementById("criminal-number-fields").classList.toggle("hidden", !isCriminal);
};
window.setTitleSource = (v)=>{ window._tempTitleSource=v; document.querySelectorAll("#title-source-row .radio-pill").forEach(b=> b.classList.toggle("active", b.dataset.v===v)); };
window.setAuthorityType = (v)=>{
  window._tempAuthorityType = v;
  document.querySelectorAll("#authority-row .radio-pill").forEach(b=> b.classList.toggle("active", b.dataset.v===v));
  document.getElementById("chamber-field").classList.toggle("hidden", v!=="court");
  document.getElementById("prosecutor-field").classList.toggle("hidden", v!=="prosecution");
  document.getElementById("c-courtname-label").textContent = v==="prosecution" ? "Public Prosecution Office" : "Court";
  const input = document.getElementById("c-courtname");
  input.placeholder = v==="prosecution" ? "e.g. Tripoli Public Prosecution" : "e.g. Tripoli Court of First Instance";
};
window.toggleCaseAdvanced = ()=>{
  const fields = document.getElementById("advanced-fields");
  const btn = document.getElementById("advanced-toggle-btn");
  const nowHidden = fields.classList.toggle("hidden");
  btn.innerHTML = nowHidden ? (ICONS.chevron_right+" Documents (optional)") : (ICONS.chevron_down+" Documents");
};

function renderPartyList(){
  document.getElementById("party-list").innerHTML = window._tempParties.map((p,i)=>`
    <div style="border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--surface);">
      <div class="party-row" style="margin-bottom:6px;">
        <select onchange="updatePartyField(${i},'role',this.value)">${PARTY_ROLES.map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${r}</option>`).join("")}</select>
        <input class="input" value="${esc(p.name)}" placeholder="Full name" oninput="updatePartyField(${i},'name',this.value)" />
        <button type="button" onclick="removePartyRow(${i})" style="background:none;border:none;color:var(--muted);flex-shrink:0;">${ICONS.xmark}</button>
      </div>
      <div style="display:flex;gap:6px;">
        <input class="input" style="font-size:12.5px;" value="${esc(p.phone||'')}" placeholder="Phone (optional)" oninput="updatePartyField(${i},'phone',this.value)" />
        <input class="input" style="font-size:12.5px;" value="${esc(p.email||'')}" placeholder="Email (optional)" oninput="updatePartyField(${i},'email',this.value)" />
      </div>
    </div>`).join("");
}
window.addPartyRow = ()=>{ window._tempParties.push({id:uid(), role:"Client", name:"", phone:"", email:""}); renderPartyList(); };
window.removePartyRow = (i)=>{ window._tempParties.splice(i,1); renderPartyList(); checkConflicts(); };
window.updatePartyField = (i,field,v)=>{ window._tempParties[i][field]=v; if(field==="name"||field==="role") checkConflicts(); };
function checkConflicts(){
  const el = document.getElementById("conflict-warning");
  if(!el) return;
  const selfId = window._editingCaseId;
  const warnings = [];
  window._tempParties.forEach(p=>{
    const name = (p.name||"").trim().toLowerCase();
    if(!name) return;
    state.cases.forEach(c=>{
      if(c.id===selfId) return;
      (c.parties||[]).forEach(op=>{
        const opName = (op.name||"").trim().toLowerCase();
        const crossesSides = (op.role==="Opponent" && p.role!=="Opponent") || (p.role==="Opponent" && op.role!=="Opponent");
        if(opName===name && crossesSides){
          warnings.push(`"${esc(p.name)}" appears as ${esc(op.role)} in ${esc(computeCaseTitle(c))} — potential conflict.`);
        }
      });
    });
  });
  el.innerHTML = warnings.length ? `<div style="margin-top:8px;background:#FBEAE8;border:1px solid #E5A39B;border-radius:6px;padding:8px 10px;font-size:12px;color:var(--brick);line-height:1.5;">${ICONS.triangle_exclamation} ${[...new Set(warnings)].join("<br/>")}</div>` : "";
}

function renderDocList(){
  document.getElementById("doc-list").innerHTML = window._tempDocs.map((d,i)=>`
    <div class="doc-link-row"><span>${ICONS.link}</span><a href="${esc(d.url)}" target="_blank" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(d.label)}</a>
    <button onclick="removeDocLink(${i})" style="background:none;border:none;color:var(--muted);">${ICONS.xmark}</button></div>
  `).join("");
}
window.addDocLink = ()=>{
  const url = document.getElementById("doc-url").value.trim();
  if(!url) return;
  const label = document.getElementById("doc-label").value.trim() || "Document";
  window._tempDocs.push({id: uid(), label, url});
  document.getElementById("doc-label").value=""; document.getElementById("doc-url").value="";
  renderDocList();
};
window.removeDocLink = (i)=>{ window._tempDocs.splice(i,1); renderDocList(); };

function renderLinkList(selfId){
  const el = document.getElementById("link-list");
  if(!el) return;
  const others = state.cases.filter(c=>c.id!==selfId);
  el.innerHTML = others.map(c=>`
    <label class="link-check-row">
      <input type="checkbox" ${window._tempLinked.includes(c.id)?'checked':''} onchange="toggleLinked('${c.id}', this.checked)" />
      <span>${esc(computeCaseTitle(c))}${c.courtNumber?` · ${esc(c.courtNumber)}`:""}</span>
    </label>`).join("");
}
window.toggleLinked = (id, checked)=>{
  if(checked){ if(!window._tempLinked.includes(id)) window._tempLinked.push(id); }
  else{ window._tempLinked = window._tempLinked.filter(x=>x!==id); }
};

window.submitCase = (id)=>{
  const caseType = getCaseTypeValue() || CASE_TYPES[0];
  ensureCustomCaseType(caseType);
  const isCounsel = caseType === "Counsel";
  const isCriminal = caseType === "Criminal";

  let data;
  if(!caseType){ alert("Choose or type a case type."); return; }
  if(isCounsel){
    const clientName = document.getElementById("c-counsel-client").value.trim();
    const subject = document.getElementById("c-counsel-subject").value.trim();
    if(!clientName){ alert("Add the client's name so this matter can be identified."); return; }
    data = {
      titleSource: "client",
      subject,
      parties: [{ id: uid(), role: "Client", name: clientName, phone:"", email:"" }],
      court: "", courtNumber: document.getElementById("c-court").value.trim(),
      authorityType: null, chamber: "", prosecutorInCharge: "",
      dateReceived: document.getElementById("c-date-received").value || todayKey(),
      caseType, status: document.getElementById("c-status").value, priority: !!document.getElementById("c-priority").checked,
      notes: document.getElementById("c-notes").value.trim(), documents: window._tempDocs,
      linkedCaseIds: window._tempLinked, noteLog: window._tempNoteLog || []
    };
  } else {
    const parties = window._tempParties.filter(p=>p.name.trim()).map(p=>({...p, name:p.name.trim()}));
    data = {
      titleSource: window._tempTitleSource, subject: document.getElementById("c-subject").value.trim(),
      parties, court: document.getElementById("c-courtname").value.trim(),
      courtNumber: isCriminal ? "" : document.getElementById("c-court").value.trim(),
      partialNumber: isCriminal ? document.getElementById("c-partial-number").value.trim() : "",
      generalNumber: isCriminal ? document.getElementById("c-general-number").value.trim() : "",
      authorityType: window._tempAuthorityType || "court",
      chamber: document.getElementById("c-chamber") ? document.getElementById("c-chamber").value.trim() : "",
      prosecutorInCharge: document.getElementById("c-prosecutor") ? document.getElementById("c-prosecutor").value.trim() : "",
      caseType, status: document.getElementById("c-status").value, priority: !!document.getElementById("c-priority").checked,
      notes: document.getElementById("c-notes").value.trim(), documents: window._tempDocs,
      linkedCaseIds: window._tempLinked, noteLog: window._tempNoteLog || []
    };
    if(data.parties.length===0 && !data.subject){ alert("Add at least one party name or a subject so this case can be identified."); return; }
  }
  const isNewCase = !id;
  if(id) data.id = id; else data.createdAt = Date.now();

  // sync reciprocal links: add this case to the linked cases' own linkedCaseIds too
  const finalId = id || uid();
  saveCase(data).then((ref)=>{
    const myId = id || finalId;
    window._tempLinked.forEach(otherId=>{
      const other = state.cases.find(x=>x.id===otherId);
      if(other && !(other.linkedCaseIds||[]).includes(myId)){
        coll("cases").doc(otherId).set({...stripId(other), linkedCaseIds:[...(other.linkedCaseIds||[]), myId]});
      }
    });
    if(isNewCase){
      const newCaseId = ref && ref.id ? ref.id : myId;
      const template = state.checklistTemplates[caseType] || [];
      template.forEach(text=>{
        saveChecklistItem({ caseId: newCaseId, text, done:false, taskId:"", followNextHearing:false, dueDate:null });
      });
    }
  });
  closeModal();
};
