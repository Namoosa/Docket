<style>
  :root{
    --ink:#20242C; --paper:#ECE7DA; --panel:#FBF9F3; --navy:#22344A; --navy-dark:#182234;
    --brass:#8F6526; --brick:#9A3B33; --sage:#556B4F; --slate:#3D5871; --line:#D8D0BB; --muted:#7B7566; --surface:#F6F1E4;
    --purple:#6B5B8C; --clay:#8A6E4B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:90px;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--navy) !important;}
  .serif{font-family:'Source Serif 4',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:var(--slate);}
  .hidden{display:none !important;}
  .input{width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-size:15px; color:var(--ink);}
  .btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:8px;border:none;background:var(--navy);color:var(--panel);font-weight:600;font-size:14px;}
  .btn-google{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:#3c4043;font-weight:600;font-size:14px;}
  .btn-ghost{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--navy);font-weight:600;font-size:13px;}
  .icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;color:var(--navy);}
  .field-label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  #auth-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .auth-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px 24px; width:100%; max-width:380px;}
  .auth-tabs{display:flex; gap:6px; margin-bottom:18px;}
  .auth-tab{flex:1; text-align:center; padding:9px 0; border-radius:7px; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--surface); color:var(--muted);}
  .auth-tab.active{background:var(--navy); color:var(--panel); border-color:var(--navy);}
  #auth-error{color:#B23A32; font-size:12.5px; margin-top:8px; min-height:16px;}
  .or-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px;}
  .or-divider::before,.or-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  header{background:var(--navy-dark); color:var(--panel); padding:16px 16px 12px;}
  .header-inner{max-width:800px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:8px;font-size:19px;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1.3px solid; font-weight:600; white-space:nowrap;}
  main{max-width:800px;margin:0 auto;padding:16px 16px 0;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tab-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:13px;}
  .tab-btn.active{background:var(--navy);color:var(--panel);border-color:var(--navy);}
  .cal-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;margin-bottom:14px;}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-wd{text-align:center;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;}
  .cal-day{aspect-ratio:1;border-radius:7px;border:1px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;position:relative;}
  .cal-day.today{border:1.5px solid var(--brass);}
  .cal-day.selected{border:2px solid var(--navy); background:#DFE3E8;}
  .dot{width:5px;height:5px;border-radius:3px;}
  .overdue-mark{position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:3px;background:#B23A32;}
  .section-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;}
  .task-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;}
  .task-row.overdue{border-color:#D9A9A3;}
  .task-check{background:none;border:1.5px solid var(--line);border-radius:5px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .task-title{font-size:13.5px;font-weight:600;}
  .task-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .case-card{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px;}
  .search-wrap{position:relative;margin-bottom:10px;}
  .search-wrap input{padding-left:32px;}
  .fab{position:fixed;right:20px;bottom:24px;width:56px;height:56px;border-radius:28px;background:var(--brass);color:var(--navy-dark);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);font-size:26px;z-index:40;}
  .modal-bg{position:fixed;inset:0;background:rgba(24,20,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
  .modal{background:var(--paper);width:100%;max-width:460px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 20px 28px;}
  @media(min-width:640px){ .modal{border-radius:16px; margin-bottom:5vh;} }
  .modal.wide{max-width:640px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .doc-link-row{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:5px;}
  .install-banner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;font-size:13px;line-height:1.5;}
  .party-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .party-row select{flex:0 0 34%;}
  .link-check-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .link-check-row:last-child{border-bottom:none;}
  .radio-row{display:flex;gap:8px;flex-wrap:wrap;}
  .radio-pill{flex:1;min-width:110px;text-align:center;padding:8px 6px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted);}
  .radio-pill.active{background:var(--navy);color:var(--panel);border-color:var(--navy);}
  .group-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--purple);border:1px solid var(--purple);border-radius:3px;padding:2px 6px;font-weight:600;}
  .checklist-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;}
  /* Icon sizing — inline SVGs, self-contained, no external font dependency */
  .icon-btn svg{width:18px;height:18px;}
  .tab-btn svg{margin-right:3px;}
  .fab svg{width:22px;height:22px;}
  .brand svg{width:20px;height:20px;}
  .badge svg{width:12px;height:12px;vertical-align:-2px !important;}
  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block !important;position:absolute;top:0;left:0;width:100%;padding:20px;color:#000;}
    #print-area h1{font-family:'Source Serif 4',serif;font-size:22px;margin-bottom:4px;}
    #print-area .p-sub{color:#555;font-size:13px;margin-bottom:18px;}
    #print-area .p-section{margin-bottom:20px;}
    #print-area .p-section-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#555;border-bottom:1px solid #ccc;padding-bottom:4px;margin-bottom:8px;}
    #print-area .p-item{padding:6px 0;border-bottom:1px solid #eee;font-size:13.5px;}
    #print-area .p-item .p-meta{color:#666;font-size:12px;margin-top:2px;}
  }
</style>
</head>
<body>

  <div class="auth-card">

      <span class="serif" style="font-size:22px;color:var(--navy-dark);"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='18' height='18' style='vertical-align:-4px;flex-shrink:0;' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><line x1='12' y1='3' x2='12' y2='21'/><line x1='8' y1='21' x2='16' y2='21'/><line x1='5' y1='7' x2='19' y2='7'/><path d='M5 7L2.5 13a2.7 2.7 0 0 0 5 0z'/><path d='M19 7l-2.5 6a2.7 2.7 0 0 0 5 0z'/></svg> Docket</span>

const auth = firebase.auth();
const db = firebase.firestore();

const CASE_TYPES = ["Criminal","Civil","Commercial","Labor","Personal Status","Real Estate","Administrative"];
const CASE_TYPE_COLOR = {"Criminal":"#9A3B33","Civil":"#3D5871","Commercial":"#A6762E","Labor":"#556B4F","Personal Status":"#6B5B8C","Real Estate":"#8A6E4B","Administrative":"#7B7566"};
const CASE_TYPE_ICON = {"Criminal":ICONS.handcuffs,"Civil":ICONS.scale_balanced,"Commercial":ICONS.building,"Labor":ICONS.helmet_safety,"Personal Status":ICONS.people_roof,"Real Estate":ICONS.house,"Administrative":ICONS.landmark};

const PARTY_ROLES = ["Client","Opponent","Co-Defendant","Co-Plaintiff","Third Party","Other"];
const STATUS_OPTIONS = ["Active","Pending","On Hold","Closed"];
const HASH_PALETTE = ["#9A3B33","#A6762E","#3D5871","#556B4F","#6B5B8C","#8A6E4B","#7B7566","#3D6B6B"];

function hashColor(str){ let h=0; for(let i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); } return HASH_PALETTE[Math.abs(h)%HASH_PALETTE.length]; }
function colorForProcedure(t){ return PROCEDURE_COLOR[t] || hashColor(t||"?"); }
function colorForCaseType(t){ return CASE_TYPE_COLOR[t] || hashColor(t||"?"); }
function iconForProcedure(t){ return PROCEDURE_ICON[t] || "•"; }
function iconForCaseType(t){ return CASE_TYPE_ICON[t] || ICONS.folder_open; }

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD = ["S","M","T","W","T","F","S"];

/* ================= STATE ================= */
let state = {
  user:null, googleAccessToken:null, googleConnected:false,
  cases:[], tasks:[], checklist:[],
  customCaseTypes:[], customProcedureTypes:[], alertDays:7, onboardDismissed:false,
  view:"calendar", cursorY:new Date().getFullYear(), cursorM:new Date().getMonth(),
  selectedDay: todayKey(), search:"", filterType:"All", filterStatus:"All", filterCourt:"All",
};
let unsubCases=null, unsubTasks=null, unsubChecklist=null, unsubSettings=null;

function todayKey(){ return dateKey(new Date()); }
function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return dateKey(d); }
function daysBetween(a,b){ return Math.round((parseKey(b)-parseKey(a))/86400000); }
function fmtLong(k){ const d=parseKey(k); return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function uniqueCourts(){
  const set = new Set();
  state.cases.forEach(c=>{ if(c.court && c.court.trim()) set.add(c.court.trim()); });
  return Array.from(set).sort();
}
function computeCaseTitle(c){
  if(c.titleSource==="subject" && c.subject) return c.subject;
  const wantRole = c.titleSource==="client" ? "Client" : "Opponent";
  const party = (c.parties||[]).find(p=>p.role===wantRole);
  if(party) return wantRole==="Opponent" ? `v. ${party.name}` : party.name;
  if(c.subject) return c.subject;
  if(c.parties && c.parties[0]) return c.parties[0].name;
  return "Untitled case";
}

/* ================= AUTH ================= */
let authMode = "signin";
document.getElementById("tab-signin").onclick = ()=>{ authMode="signin"; document.getElementById("tab-signin").classList.add("active"); document.getElementById("tab-signup").classList.remove("active"); document.getElementById("auth-submit").textContent="Sign in"; };
document.getElementById("tab-signup").onclick = ()=>{ authMode="signup"; document.getElementById("tab-signup").classList.add("active"); document.getElementById("tab-signin").classList.remove("active"); document.getElementById("auth-submit").textContent="Create account"; };

document.getElementById("auth-submit").onclick = async ()=>{
  const email = document.getElementById("auth-email").value.trim();
  const pw = document.getElementById("auth-password").value;
  const errEl = document.getElementById("auth-error");
  errEl.textContent="";
  if(!email || !pw){ errEl.textContent="Enter an email and password."; return; }
  try{
    if(authMode==="signup") await auth.createUserWithEmailAndPassword(email, pw);
    else await auth.signInWithEmailAndPassword(email, pw);
  }catch(e){ errEl.textContent = e.message; }
};

async function googleSignIn(){
  const errEl = document.getElementById("auth-error");
  if(errEl) errEl.textContent = "";
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.addScope("https://www.googleapis.com/auth/calendar.events");
  provider.setCustomParameters({ prompt: "consent" });
  try{
    // Try the popup method first — this works reliably on most desktop
    // browsers with default privacy settings, and doesn't depend on the
    // cross-domain storage handoff that redirect mode needs (which strict
    // tracking-prevention settings can silently block).
    const result = await auth.signInWithPopup(provider);
    const credential = firebase.auth.GoogleAuthProvider.credentialFromResult(result);
    if(credential && credential.accessToken){
      state.googleAccessToken = credential.accessToken;
      state.googleConnected = true;
    }
  }catch(e){
    const popupFailed = e && ["auth/popup-blocked","auth/cancelled-popup-request","auth/popup-closed-by-user","auth/operation-not-supported-in-this-environment"].includes(e.code);
    if(popupFailed){
      // Mobile browsers and installed home-screen apps often block popups —
      // fall back to a full-page redirect, which works better there.
      try{ await auth.signInWithRedirect(provider); }
      catch(e2){ if(errEl) errEl.textContent = e2.message; }
    } else {
      if(errEl) errEl.textContent = e.message;
    }
  }
}

// Catch the result after Google sends the user back to this page.
auth.getRedirectResult().then(result=>{
  if(result && result.user){

}).catch(e=>{

});

auth.onAuthStateChanged(user=>{
  if(user){
    state.user = user;
    state.googleConnected = user.providerData.some(p=>p.providerId==="google.com") && !!state.googleAccessToken;
    document.getElementById("auth-screen").classList.add("hidden");

  } else {

/* ================= FIRESTORE SYNC ================= */
function coll(name){ return db.collection("users").doc(state.user.uid).collection(name); }
function attachListeners(uidVal){
  unsubCases = db.collection("users").doc(uidVal).collection("cases").onSnapshot(snap=>{ state.cases = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); });
  unsubTasks = db.collection("users").doc(uidVal).collection("tasks").onSnapshot(snap=>{ state.tasks = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); });
  unsubChecklist = db.collection("users").doc(uidVal).collection("checklist").onSnapshot(snap=>{ state.checklist = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); });
  unsubSettings = db.collection("users").doc(uidVal).collection("meta").doc("settings").onSnapshot(snap=>{
    const d = snap.data() || {};
    state.alertDays = d.alertDays ?? 7;
    state.customCaseTypes = d.customCaseTypes || [];
    state.customProcedureTypes = d.customProcedureTypes || [];
    state.onboardDismissed = !!d.onboardDismissed;
    render();
  });
}
function saveSettings(){
  coll("meta").doc("settings").set({ alertDays: state.alertDays, customCaseTypes: state.customCaseTypes, customProcedureTypes: state.customProcedureTypes, onboardDismissed: state.onboardDismissed });
}
function stripId(t){ const {id, ...rest}=t; return rest; }

function saveCase(data){
  if(data.id){ const {id, ...rest} = data; return coll("cases").doc(id).set(rest); }
  const {id, ...rest} = data; return coll("cases").add({...rest, createdAt: Date.now()});
}
function deleteCaseDoc(id){
  coll("cases").doc(id).delete();
  state.tasks.filter(t=>t.caseId===id).forEach(t=>{ coll("tasks").doc(t.id).delete(); if(t.googleEventId) deleteFromGoogleCalendar(t.googleEventId); });
  state.checklist.filter(c=>c.caseId===id).forEach(c=> coll("checklist").doc(c.id).delete());
  // remove from other cases' linkedCaseIds
  state.cases.forEach(c=>{ if(c.linkedCaseIds && c.linkedCaseIds.includes(id)){ coll("cases").doc(c.id).set({...stripId(c), linkedCaseIds: c.linkedCaseIds.filter(x=>x!==id)}); } });
}
async function saveTask(data){
  let docId = data.id;
  const payload = stripId(data);
  if(docId){ await coll("tasks").doc(docId).set(payload); }
  else { const ref = await coll("tasks").add(payload); docId = ref.id; }
  // push to google calendar if connected
  if(state.googleConnected && state.googleAccessToken){
    const caseItem = state.cases.find(c=>c.id===payload.caseId);
    const result = await pushToGoogleCalendar({...payload, id:docId}, caseItem);
    if(result && result.needsReconnect){ state.googleConnected=false; render(); }
    else if(result && result.id && result.id !== payload.googleEventId){ coll("tasks").doc(docId).set({...payload, googleEventId: result.id}); }
  }
}
function deleteTaskDoc(id){
  const t = state.tasks.find(x=>x.id===id);
  coll("tasks").doc(id).delete();
  if(t && t.googleEventId) deleteFromGoogleCalendar(t.googleEventId);
}
function toggleTaskDone(id){
  const t = state.tasks.find(x=>x.id===id);
  coll("tasks").doc(id).set({...stripId(t), completed: !t.completed});
}
function ensureCustomCaseType(t){ if(t && !CASE_TYPES.includes(t) && !state.customCaseTypes.includes(t)){ state.customCaseTypes.push(t); saveSettings(); } }
function ensureCustomProcedureType(t){ if(t && !PROCEDURE_TYPES.includes(t) && !state.customProcedureTypes.includes(t)){ state.customProcedureTypes.push(t); saveSettings(); } }

function saveChecklistItem(data){
  if(data.id){ const {id, ...rest}=data; return coll("checklist").doc(id).set(rest); }
  const {id, ...rest}=data; return coll("checklist").add({...rest, createdAt: Date.now()});
}
function deleteChecklistItem(id){ coll("checklist").doc(id).delete(); }
function toggleChecklistDone(id){ const c = state.checklist.find(x=>x.id===id); coll("checklist").doc(id).set({...stripId(c), done: !c.done}); }

/* ================= GOOGLE CALENDAR ================= */
async function pushToGoogleCalendar(task, caseItem){
  if(!state.googleAccessToken) return null;
  const summary = (caseItem ? computeCaseTitle(caseItem) + " — " : "") + task.title;
  const body = { summary, description: task.notes||"", start:{date: task.date}, end:{date: addDays(task.date,1)} };
  try{
    let url = "https://www.googleapis.com/calendar/v3/calendars/primary/events";
    let method = "POST";
    if(task.googleEventId){ url += "/" + task.googleEventId; method = "PUT"; }
    const res = await fetch(url, { method, headers:{ "Authorization":"Bearer "+state.googleAccessToken, "Content-Type":"application/json" }, body: JSON.stringify(body) });
    if(res.status===401 || res.status===403){ return {needsReconnect:true}; }
    const data = await res.json();
    return { id: data.id };
  }catch(e){ console.error("calendar push failed", e); return null; }
}
async function deleteFromGoogleCalendar(eventId){
  if(!state.googleAccessToken || !eventId) return;
  try{ await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, { method:"DELETE", headers:{ "Authorization":"Bearer "+state.googleAccessToken } }); }catch(e){}
}

/* ================= RENDER ================= */
function render(){
  ["calendar","cases","checklist"].forEach(v=>{
    document.getElementById("tab-"+v).classList.toggle("active", state.view===v);
    document.getElementById("view-"+v).classList.toggle("hidden", state.view!==v);
  });

  const tk = todayKey();
  const upcoming = state.tasks.filter(t=>!t.completed).map(t=>({...t, delta: daysBetween(tk,t.date)})).sort((a,b)=>a.date.localeCompare(b.date));
  const urgent = upcoming.filter(t=>t.delta>=0 && t.delta<=state.alertDays).length;
  const overdue = upcoming.filter(t=>t.delta<0).length;

  const badges = document.getElementById("header-badges");
  badges.innerHTML = (overdue>0?`<span class="badge" style="border-color:#E5A39B;color:#E5A39B;">${overdue} overdue</span>`:"") +
                      (urgent>0?`<span class="badge" style="border-color:var(--brass);color:var(--brass);">${urgent} due soon</span>`:"");

  renderInstallBanner();
  renderReconnectBanner();
  if(state.view==="calendar") renderCalendar(upcoming);
  else if(state.view==="cases") renderCases();
  else renderChecklist();
}

function renderInstallBanner(){
  const wrap = document.getElementById("install-banner-wrap");
  if(state.onboardDismissed){ wrap.innerHTML=""; return; }
  wrap.innerHTML = `<div class="install-banner">
    <span>${ICONS.mobile_screen_button}</span>
    <div style="flex:1;"><strong>One-tap access:</strong> your browser should offer an "Install" or "Add to Home Screen" option (address bar icon, or the ⋮ / Share menu).</div>
    <button onclick="dismissBanner()" style="background:none;border:none;color:var(--muted);">${ICONS.xmark}</button>
  </div>`;
}
function dismissBanner(){ state.onboardDismissed = true; saveSettings(); render(); }
window.dismissBanner = dismissBanner;

function renderReconnectBanner(){
  const wrap = document.getElementById("reconnect-banner-wrap");
  const isGoogleUser = state.user && state.user.providerData.some(p=>p.providerId==="google.com");
  if(isGoogleUser && !state.googleConnected){
    wrap.innerHTML = `<div class="install-banner" style="border-left-color:var(--brick);margin-top:10px;">
      <span>${ICONS.calendar_days}</span>
      <div style="flex:1;">Google Calendar sync needs to be reconnected (this happens periodically for security). Your dates are still safe — this only affects calendar syncing.</div>
      <button class="btn-ghost" onclick="reconnectGoogle()">Reconnect</button>
    </div>`;
  } else { wrap.innerHTML = ""; }
}

/* ---- CALENDAR VIEW ---- */
function renderCalendar(upcoming){
  const y = state.cursorY, m = state.cursorM;
  const tk = todayKey();
  const tasksByDate = {};
  state.tasks.forEach(t=>{ (tasksByDate[t.date] = tasksByDate[t.date]||[]).push(t); });
  const casesById = {}; state.cases.forEach(c=>casesById[c.id]=c);

  const firstWd = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  let cells = "";
  for(let i=0;i<firstWd;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(y,m,d); const key = dateKey(dt);
    const items = tasksByDate[key] || [];
    const isToday = key===tk, isSel = key===state.selectedDay;
    const hasOverdue = items.some(t=>!t.completed && daysBetween(tk,key)<0);
    const dots = items.slice(0,3).map(t=>`<div class="dot" style="background:${t.completed?'#B9B29A':colorForProcedure(t.type)};"></div>`).join("");
    cells += `<button class="cal-day ${isToday?'today':''} ${isSel?'selected':''}" onclick="selectDay('${key}')">
      <span style="font-size:12.5px;font-weight:${isToday?700:500};color:${isToday?'var(--brass)':'var(--ink)'};">${d}</span>
      <div style="display:flex;gap:2px;">${dots}</div>
      ${hasOverdue?'<div class="overdue-mark"></div>':''}
    </button>`;
  }

  const dayItems = (tasksByDate[state.selectedDay]||[]).slice().sort((a,b)=>(a.completed?1:0)-(b.completed?1:0));
  const tk2 = todayKey();
  const criticalItems = state.tasks.filter(t=>t.critical && !t.completed).map(t=>({...t, delta:daysBetween(tk2,t.date)})).sort((a,b)=>a.date.localeCompare(b.date));

  document.getElementById("view-calendar").innerHTML = `
    ${criticalItems.length>0 ? `<div style="margin-bottom:14px;background:#FBEAE8;border:2px solid var(--brick);border-radius:10px;padding:12px 14px;">
      <div class="section-label" style="color:var(--brick);margin-bottom:8px;">${ICONS.triangle_exclamation} Critical deadlines</div>
      ${criticalItems.map(t=>taskRowHtml(t, casesById[t.caseId], true)).join("")}
    </div>` : ""}
    <div class="cal-card">
      <div class="cal-header">
        <span class="serif" style="font-size:17px;color:var(--navy-dark);">${MONTHS[m]} ${y}</span>
        <div style="display:flex;gap:6px;">
          <button class="icon-btn" style="width:auto;padding:0 10px;font-size:12px;font-weight:600;" onclick="gotoToday()">Today</button>
          <button class="icon-btn" onclick="gotoMonth(-1)">${ICONS.chevron_left}</button>
          <button class="icon-btn" onclick="gotoMonth(1)">${ICONS.chevron_right}</button>
        </div>
      </div>
      <div class="cal-grid" style="margin-bottom:4px;">${WD.map(w=>`<div class="cal-wd">${w}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div style="margin-bottom:18px;">
      <div class="section-label">${fmtLong(state.selectedDay)}${state.selectedDay===tk?' · Today':''}</div>
      ${dayItems.length===0 ? `<div style="color:var(--muted);font-size:13.5px;padding:10px 2px;">Nothing scheduled this day.</div>` :
        dayItems.map(t=>taskRowHtml(t, casesById[t.caseId], false)).join("")}
    </div>
    <div>
      <div class="section-label">Upcoming</div>
      ${upcoming.filter(t=>t.delta>=0).slice(0,8).map(t=>taskRowHtml(t, casesById[t.caseId], true)).join("")}
      ${upcoming.filter(t=>t.delta<0).length>0 ? `<div style="font-size:11.5px;color:#B23A32;font-weight:700;margin:6px 0;letter-spacing:.04em;text-transform:uppercase;">Overdue</div>` +
        upcoming.filter(t=>t.delta<0).map(t=>taskRowHtml(t, casesById[t.caseId], true)).join("") : ""}
      ${upcoming.length===0 ? `<div style="color:var(--muted);font-size:13.5px;">No upcoming dates. Tap + to add one.</div>` : ""}
    </div>
  `;
}
function taskRowHtml(t, caseItem, showDate){
  const isDeadline = t.kind==="deadline";
  const isCritical = !!t.critical;
  const overdue = t.delta<0 && !t.completed;
  const urgent = !overdue && showDate && t.delta<=state.alertDays && t.delta>=0;
  const icon = isCritical ? ICONS.triangle_exclamation : (isDeadline ? ICONS.hourglass_half : iconForProcedure(t.type));
  const color = isCritical ? "var(--brick)" : (isDeadline ? "var(--purple)" : colorForProcedure(t.type));
  const countdownLabel = t.delta===0 ? (isDeadline||isCritical?'Due today':'Today') : `${t.delta}d${(isDeadline||isCritical)?' left':''}`;
  let statusBadge = "";
  if(overdue){ statusBadge = `<span class="badge" style="border-color:#B23A32;color:#B23A32;">${isDeadline?'Missed deadline':'Overdue'}</span>`; }
  else if(!t.completed && typeof t.delta==="number"){
    if(isCritical) statusBadge = `<span class="badge" style="border-color:var(--brick);color:var(--brick);background:#FBEAE8;">CRITICAL · ${countdownLabel}</span>`;
    else if(isDeadline) statusBadge = `<span class="badge" style="border-color:var(--purple);color:var(--purple);">${countdownLabel}</span>`;
    else if(urgent) statusBadge = `<span class="badge" style="border-color:var(--brass);color:var(--brass);">${countdownLabel}</span>`;
  }
  return `<div class="task-row ${overdue?'overdue':''}" style="border-left:4px solid ${overdue?'#B23A32':color};${isCritical?'border-width:5px;':''}">
    <button class="task-check" onclick="toggleTaskDone('${t.id}')">${t.completed?ICONS.check:''}</button>
    <div style="flex:1;min-width:0;cursor:pointer;" onclick='openTaskModal(${JSON.stringify(t).replace(/'/g,"&apos;")})'>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <span class="task-title-icon" style="color:${color};">${icon}</span>
        <span class="task-title" style="${t.completed?'text-decoration:line-through;color:var(--muted);':''}">${esc(t.title)}</span>
        ${t.googleEventId?`<span title="Synced to Google Calendar" style="font-size:11px;">${ICONS.calendar_check}</span>`:""}
        ${statusBadge}
      </div>
      <div class="task-meta">${caseItem?computeCaseTitle(caseItem):"No case linked"}${caseItem&&caseItem.court?` · ${ICONS.location_dot} ${esc(caseItem.court)}`:""}${showDate?` · ${fmtLong(t.date)}`:""}</div>
      ${t.postponeReason?`<div class="task-meta" style="color:var(--brass);margin-top:2px;">↳ Postponed: ${esc(t.postponeReason)}</div>`:""}
    </div>
    <button onclick="deleteTaskDoc('${t.id}')" style="background:none;border:none;color:var(--muted);">${ICONS.trash}</button>
  </div>`;
}

/* ---- CASES VIEW ---- */
function renderCases(){
  const allCaseTypes = [...CASE_TYPES, ...state.customCaseTypes];
  const courts = uniqueCourts();
  const q = state.search.trim().toLowerCase();
  const hideClosed = state.hideClosed!==false && !q;
  const filtered = state.cases.filter(c=>{
    if(hideClosed && c.status==="Closed" && state.filterStatus!=="Closed") return false;
    if(state.filterType!=="All" && c.caseType!==state.filterType) return false;
    if(state.filterStatus!=="All" && c.status!==state.filterStatus) return false;
    if(state.filterCourt && state.filterCourt!=="All" && c.court!==state.filterCourt) return false;
    if(!q) return true;
    const title = computeCaseTitle(c).toLowerCase();
    const partyMatch = (c.parties||[]).some(p=>p.name.toLowerCase().includes(q));
    return title.includes(q) || (c.courtNumber||"").toLowerCase().includes(q) || (c.court||"").toLowerCase().includes(q) || (c.subject||"").toLowerCase().includes(q) || partyMatch;
  }).sort((a,b)=> (b.priority?1:0)-(a.priority?1:0) || (b.createdAt||0)-(a.createdAt||0));

  const closedCount = state.cases.filter(c=>c.status==="Closed").length;

  let courtBlock = "";
  if(state.filterCourt && state.filterCourt!=="All"){
    const tk = todayKey();
    const caseIdsHere = new Set(state.cases.filter(c=>c.court===state.filterCourt).map(c=>c.id));
    const casesById = {}; state.cases.forEach(c=>casesById[c.id]=c);
    const tasksHere = state.tasks.filter(t=>caseIdsHere.has(t.caseId) && !t.completed)
      .map(t=>({...t, delta: daysBetween(tk,t.date)})).sort((a,b)=>a.date.localeCompare(b.date));
    courtBlock = `<div style="margin-bottom:18px;">
      <div class="section-label">${ICONS.location_dot} At ${esc(state.filterCourt)} — every open procedure & deadline</div>
      ${tasksHere.length===0 ? `<div style="color:var(--muted);font-size:13.5px;">Nothing open at this court right now.</div>` :
        tasksHere.map(t=>taskRowHtml(t, casesById[t.caseId], true)).join("")}
    </div>`;
  }

  document.getElementById("view-cases").innerHTML = `

function updateKindLabels(){
  const isDeadline = window._tempKind==="deadline";
  const titleLabel = document.getElementById("f-title-label");
  const dateLabel = document.getElementById("f-date-label");
  if(titleLabel) titleLabel.textContent = isDeadline ? "What's due" : "Title";
  if(dateLabel) dateLabel.textContent = isDeadline ? "Deadline date" : "Date";
}
window.submitTask = (id)=>{
  const title = document.getElementById("f-title").value.trim();
  const date = document.getElementById("f-date").value;
  if(!title || !date) return;
  const caseSel = document.getElementById("f-caseId");
  const type = document.getElementById("f-type").value.trim() || PROCEDURE_TYPES[0];
  const existing = id ? state.tasks.find(x=>x.id===id) : null;
  const baseData = { caseId: caseSel? (caseSel.value||null) : null, type, kind: window._tempKind||"event", critical: window._tempKind==="deadline" && !!document.getElementById("f-critical")?.checked, notes: document.getElementById("f-notes").value.trim(), completed: existing?existing.completed:false, googleEventId: existing?existing.googleEventId:null };
  ensureCustomProcedureType(type);

  const repeatOn = document.getElementById("f-repeat-on");
  if(!existing && repeatOn && repeatOn.checked){
    const interval = Number(document.getElementById("f-repeat-freq").value);
    const count = Math.max(2, Math.min(20, Number(document.getElementById("f-repeat-count").value)||2));
    for(let i=0;i<count;i++){
      const occDate = addDays(date, i*interval);
      saveTask({ ...baseData, title: `${title} — Session ${i+1} of ${count}`, date: occDate });
    }
  } else {
    const data = { ...baseData, title, date };
    if(id) data.id = id;
    saveTask(data);
  }
  closeModal();
};

  input.placeholder = v==="prosecution" ? "e.g. Tripoli Public Prosecution" : "e.g. Tripoli Court of First Instance";
};
window.toggleCaseAdvanced = ()=>{
  const fields = document.getElementById("advanced-fields");
  const btn = document.getElementById("advanced-toggle-btn");
  const nowHidden = fields.classList.toggle("hidden");
  btn.textContent = nowHidden ? "${ICONS.chevron_right} Documents & linked cases (optional)" : "${ICONS.chevron_down} Documents & linked cases";
};

function renderPartyList(){
  document.getElementById("party-list").innerHTML = window._tempParties.map((p,i)=>`
    <div style="border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--surface);">
      <div class="party-row" style="margin-bottom:6px;">
        <select onchange="updatePartyField(${i},'role',this.value)">${PARTY_ROLES.map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${r}</option>`).join("")}</select>
        <input class="input" value="${esc(p.name)}" placeholder="Full name" oninput="updatePartyField(${i},'name',this.value)" />
        <button type="button" onclick="removePartyRow(${i})" style="background:none;border:none;color:var(--muted);flex-shrink:0;">${ICONS.xmark}</button>
      </div>
      <div style="display:flex;gap:6px;">
        <input class="input" style="font-size:12.5px;" value="${esc(p.phone||'')}" placeholder="Phone (optional)" oninput="updatePartyField(${i},'phone',this.value)" />
        <input class="input" style="font-size:12.5px;" value="${esc(p.email||'')}" placeholder="Email (optional)" oninput="updatePartyField(${i},'email',this.value)" />
      </div>
    </div>`).join("");
}
window.addPartyRow = ()=>{ window._tempParties.push({id:uid(), role:"Client", name:"", phone:"", email:""}); renderPartyList(); };
window.removePartyRow = (i)=>{ window._tempParties.splice(i,1); renderPartyList(); checkConflicts(); };
window.updatePartyField = (i,field,v)=>{ window._tempParties[i][field]=v; if(field==="name"||field==="role") checkConflicts(); };
function checkConflicts(){
  const el = document.getElementById("conflict-warning");
  if(!el) return;
  const selfId = window._editingCaseId;
  const warnings = [];
  window._tempParties.forEach(p=>{
    const name = (p.name||"").trim().toLowerCase();
    if(!name) return;
    state.cases.forEach(c=>{
      if(c.id===selfId) return;
      (c.parties||[]).forEach(op=>{
        const opName = (op.name||"").trim().toLowerCase();
        const crossesSides = (op.role==="Opponent" && p.role!=="Opponent") || (p.role==="Opponent" && op.role!=="Opponent");
        if(opName===name && crossesSides){
          warnings.push(`"${esc(p.name)}" appears as ${esc(op.role)} in ${esc(computeCaseTitle(c))} — potential conflict.`);
        }
      });
    });
  });
  el.innerHTML = warnings.length ? `<div style="margin-top:8px;background:#FBEAE8;border:1px solid #E5A39B;border-radius:6px;padding:8px 10px;font-size:12px;color:var(--brick);line-height:1.5;">${ICONS.triangle_exclamation} ${[...new Set(warnings)].join("<br/>")}</div>` : "";
}

function renderDocList(){
  document.getElementById("doc-list").innerHTML = window._tempDocs.map((d,i)=>`
    <div class="doc-link-row"><span>${ICONS.link}</span><a href="${esc(d.url)}" target="_blank" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(d.label)}</a>
    <button onclick="removeDocLink(${i})" style="background:none;border:none;color:var(--muted);">${ICONS.xmark}</button></div>
  `).join("");
}
window.addDocLink = ()=>{
  const url = document.getElementById("doc-url").value.trim();
  if(!url) return;
  const label = document.getElementById("doc-label").value.trim() || "Document";
  window._tempDocs.push({id: uid(), label, url});
  document.getElementById("doc-label").value=""; document.getElementById("doc-url").value="";
  renderDocList();
};
window.removeDocLink = (i)=>{ window._tempDocs.splice(i,1); renderDocList(); };

function renderLinkList(selfId){
  const el = document.getElementById("link-list");
  if(!el) return;
  const others = state.cases.filter(c=>c.id!==selfId);
  el.innerHTML = others.map(c=>`
    <label class="link-check-row">
      <input type="checkbox" ${window._tempLinked.includes(c.id)?'checked':''} onchange="toggleLinked('${c.id}', this.checked)" />
      <span>${esc(computeCaseTitle(c))}${c.courtNumber?` · ${esc(c.courtNumber)}`:""}</span>
    </label>`).join("");
}
window.toggleLinked = (id, checked)=>{
  if(checked){ if(!window._tempLinked.includes(id)) window._tempLinked.push(id); }
  else{ window._tempLinked = window._tempLinked.filter(x=>x!==id); }
};

window.submitCase = (id)=>{
  const caseType = document.getElementById("c-type").value.trim() || CASE_TYPES[0];
  ensureCustomCaseType(caseType);
  const parties = window._tempParties.filter(p=>p.name.trim()).map(p=>({...p, name:p.name.trim()}));
  const data = {
    titleSource: window._tempTitleSource, subject: document.getElementById("c-subject").value.trim(),
    parties, court: document.getElementById("c-courtname").value.trim(), courtNumber: document.getElementById("c-court").value.trim(),
    authorityType: window._tempAuthorityType || "court",
    chamber: document.getElementById("c-chamber") ? document.getElementById("c-chamber").value.trim() : "",
    prosecutorInCharge: document.getElementById("c-prosecutor") ? document.getElementById("c-prosecutor").value.trim() : "",
    caseType, status: document.getElementById("c-status").value, priority: !!document.getElementById("c-priority").checked,
    notes: document.getElementById("c-notes").value.trim(), documents: window._tempDocs,
    linkedCaseIds: window._tempLinked, noteLog: window._tempNoteLog || []
  };
  if(parties.length===0 && !data.subject){ alert("Add at least one party name or a subject so this case can be identified."); return; }
  if(id) data.id = id; else data.createdAt = Date.now();

  // sync reciprocal links: add this case to the linked cases' own linkedCaseIds too
  const finalId = id || uid();
  saveCase(data).then(()=>{
    const myId = id || finalId;
    window._tempLinked.forEach(otherId=>{
      const other = state.cases.find(x=>x.id===otherId);
      if(other && !(other.linkedCaseIds||[]).includes(myId)){
        coll("cases").doc(otherId).set({...stripId(other), linkedCaseIds:[...(other.linkedCaseIds||[]), myId]});
      }
    });
  });
  closeModal();
};

function openCaseDetailModal(c){
  const tk = todayKey();
  const tasks = state.tasks.filter(t=>t.caseId===c.id).map(t=>({...t, delta:daysBetween(tk,t.date)})).sort((a,b)=>a.date.localeCompare(b.date));
  const statusColor = c.status==="Closed" ? "var(--muted)" : c.status==="Active" ? "var(--sage)" : "var(--brass)";
  const linked = (c.linkedCaseIds||[]).map(id=>state.cases.find(x=>x.id===id)).filter(Boolean);
  document.getElementById("modal-root").innerHTML = `
  <div class="modal-bg" onclick="closeModal()">
    <div class="modal wide" onclick="event.stopPropagation()">
      <div class="modal-head"><h2 class="serif" style="font-size:20px;color:var(--navy-dark);margin:0;">Case File</h2><button class="icon-btn" onclick="closeModal()">${ICONS.xmark}</button></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
        <div><div class="serif" style="font-size:21px;color:var(--navy-dark);">${esc(computeCaseTitle(c))}</div>
        ${c.court?`<div style="font-size:13px;color:var(--slate);font-weight:600;margin-top:2px;">${ICONS.location_dot} ${esc(c.court)}${c.authorityType==="prosecution"?` <span class="badge" style="border-color:var(--slate);color:var(--slate);margin-left:4px;">Investigation</span>`:""}</div>`:""}
        ${c.authorityType==="court"&&c.chamber?`<div style="font-size:12.5px;color:var(--muted);margin-top:2px;">${esc(c.chamber)}</div>`:""}
        ${c.authorityType==="prosecution"&&c.prosecutorInCharge?`<div style="font-size:12.5px;color:var(--muted);margin-top:2px;">Prosecutor: ${esc(c.prosecutorInCharge)}</div>`:""}
        ${c.courtNumber?`<div class="mono" style="font-size:12.5px;color:var(--muted);margin-top:2px;">${esc(c.courtNumber)}</div>`:""}</div>
        <div style="display:flex;gap:6px;">
          <button class="icon-btn" title="Export full case history as PDF" onclick='printCaseHistory(${JSON.stringify(c).replace(/'/g,"&apos;")})'>${ICONS.file_pdf}</button>
          <button class="icon-btn" title="Duplicate this case" onclick='duplicateCase(${JSON.stringify(c).replace(/'/g,"&apos;")})'>${ICONS.clone}</button>
          <button class="icon-btn" onclick='closeModal();openCaseModal(${JSON.stringify(c).replace(/'/g,"&apos;")})'>${ICONS.pen}</button>
          <button class="icon-btn" style="color:#B23A32;" onclick="confirmDeleteCase('${c.id}')">${ICONS.trash}</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap;">
        <span class="badge" style="border-color:${colorForCaseType(c.caseType)};color:${colorForCaseType(c.caseType)};">${iconForCaseType(c.caseType)} ${esc(c.caseType)}</span>
        <span class="badge" style="border-color:${statusColor};color:${statusColor};">${c.status}</span>
      </div>

      ${(c.parties&&c.parties.length) ? `<div style="margin-bottom:16px;"><div class="section-label" style="font-size:11px;">Parties</div>
        ${c.parties.map(p=>`<div style="font-size:13.5px;margin-bottom:6px;">
          <div><strong>${esc(p.role)}:</strong> ${esc(p.name)}</div>
          ${(p.phone||p.email) ? `<div style="font-size:12px;color:var(--slate);display:flex;gap:12px;margin-top:2px;">
            ${p.phone?`<a href="tel:${esc(p.phone)}">${ICONS.phone} ${esc(p.phone)}</a>`:""}
            ${p.email?`<a href="mailto:${esc(p.email)}">${ICONS.envelope} ${esc(p.email)}</a>`:""}
          </div>` : ""}
        </div>`).join("")}</div>` : ""}

      ${c.notes?`<div style="font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:16px;line-height:1.5;">${esc(c.notes)}</div>`:""}

      <div style="margin-bottom:18px;">
        <div class="section-label">Case Log</div>
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <input class="input" id="log-entry-input" placeholder="Add a dated note (e.g. client called about settlement)…" />
          <button class="btn-ghost" onclick="addLogEntry('${c.id}')">Add</button>
        </div>
        ${(c.noteLog&&c.noteLog.length) ? `<div>${c.noteLog.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`
          <div style="font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div><span class="mono" style="color:var(--muted);font-size:11px;">${fmtLong(l.date)}</span> — <span id="log-text-${l.id}">${esc(l.text)}</span></div>
            <div style="display:flex;gap:4px;flex-shrink:0;">
              <button onclick="editLogEntry('${c.id}','${l.id}')" style="background:none;border:none;color:var(--muted);padding:2px;">${ICONS.pen}</button>
              <button onclick="deleteLogEntry('${c.id}','${l.id}')" style="background:none;border:none;color:var(--muted);padding:2px;">${ICONS.trash}</button>
            </div>
          </div>`).join("")}</div>` : `<div style="color:var(--muted);font-size:12.5px;">No log entries yet.</div>`}
      </div>

      ${c.documents&&c.documents.length? `<div style="margin-bottom:18px;"><div class="section-label" style="font-size:11px;">Documents</div>
        ${c.documents.map(d=>`<div style="margin-bottom:5px;"><a href="${esc(d.url)}" target="_blank">${ICONS.link} ${esc(d.label)}</a></div>`).join("")}</div>` : ""}

      ${linked.length? `<div style="margin-bottom:18px;"><div class="section-label" style="font-size:11px;">Linked cases</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">${linked.map(lc=>`<button class="group-badge" style="cursor:pointer;" onclick='closeModal();openCaseDetail("${lc.id}")'>${ICONS.link} ${esc(computeCaseTitle(lc))}</button>`).join("")}</div></div>` : ""}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div class="section-label" style="margin-bottom:0;">Dates & Procedures</div>
        <button style="background:none;border:none;color:var(--navy);font-weight:700;font-size:12.5px;" onclick='closeModal();openTaskModal({caseId:"${c.id}",title:"",date:"${state.selectedDay}",type:"${PROCEDURE_TYPES[0]}",notes:"",completed:false})'>+ Add</button>
      </div>
      ${tasks.length===0? `<div style="color:var(--muted);font-size:13px;">No dates yet for this case.</div>` :
        tasks.map(t=>taskRowHtml(t, null, true)).join("")}

      <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;">
        <div class="section-label" style="margin-bottom:0;">Checklist</div>
        <button style="background:none;border:none;color:var(--navy);font-weight:700;font-size:12.5px;" onclick='closeModal();openChecklistModal({caseId:"${c.id}",text:"",done:false})'>+ Add</button>
      </div>
      ${state.checklist.filter(x=>x.caseId===c.id).length===0 ? `<div style="color:var(--muted);font-size:13px;">No checklist items for this case.</div>` :
        state.checklist.filter(x=>x.caseId===c.id).map(it=>`<div class="checklist-row"><button class="task-check" onclick="toggleChecklistDone('${it.id}')" style="${it.done?'border-color:var(--sage);':''}">${it.done?ICONS.check:''}</button><div style="flex:1;font-size:13.5px;cursor:pointer;${it.done?'text-decoration:line-through;color:var(--muted);':''}" onclick='openChecklistModal(${JSON.stringify(it).replace(/'/g,"&apos;")})'>${esc(it.text)}</div><button onclick="deleteChecklistItem('${it.id}')" style="background:none;border:none;color:var(--muted);">${ICONS.trash}</button></div>`).join("")}

      <div id="delete-confirm-${c.id}"></div>
    </div>
  </div>`;
}
window.openCaseDetail = (id)=> openCaseDetailModal(state.cases.find(c=>c.id===id));
window.addLogEntry = (caseId)=>{
  const input = document.getElementById("log-entry-input");
  const text = input.value.trim();
  if(!text) return;
  const c = state.cases.find(x=>x.id===caseId);
  if(!c) return;
  const newLog = [...(c.noteLog||[]), { id: uid(), date: todayKey(), text }];
  coll("cases").doc(caseId).set({...stripId(c), noteLog: newLog}).then(()=>{
    openCaseDetailModal({...c, noteLog: newLog});
  });
};
window.editLogEntry = (caseId, logId)=>{
  const c = state.cases.find(x=>x.id===caseId);
  if(!c) return;
  const entry = (c.noteLog||[]).find(l=>l.id===logId);
  if(!entry) return;
  const newText = prompt("Edit log entry:", entry.text);
  if(newText===null || !newText.trim()) return;
  const newLog = (c.noteLog||[]).map(l=> l.id===logId ? {...l, text:newText.trim()} : l);
  coll("cases").doc(caseId).set({...stripId(c), noteLog:newLog}).then(()=>{
    openCaseDetailModal({...c, noteLog:newLog});
  });
};
window.deleteLogEntry = (caseId, logId)=>{
  const c = state.cases.find(x=>x.id===caseId);
  if(!c) return;
  const newLog = (c.noteLog||[]).filter(l=>l.id!==logId);
  coll("cases").doc(caseId).set({...stripId(c), noteLog:newLog}).then(()=>{
    openCaseDetailModal({...c, noteLog:newLog});
  });
};
window.duplicateCase = (c)=>{
  closeModal();
  const copy = { ...c, id:null, createdAt:null, courtNumber:"", linkedCaseIds:[c.id], documents:[] };
  openCaseModal(copy);
};
window.confirmDeleteCase = (id)=>{
  document.getElementById(`delete-confirm-${id}`).innerHTML = `
  <div style="margin-top:18px;background:#FBEAE8;border:1px solid #E5A39B;border-radius:8px;padding:12px;">
    <div style="font-size:13px;margin-bottom:10px;">${ICONS.triangle_exclamation} Delete this case, all its dates and checklist items? This can't be undone.</div>
    <div style="display:flex;gap:8px;">
      <button style="background:#B23A32;color:#fff;border:none;border-radius:6px;padding:7px 14px;font-weight:600;font-size:13px;" onclick="deleteCaseDoc('${id}');closeModal();">Delete</button>
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  </div>`;
};
window.deleteCaseDoc = deleteCaseDoc;

function openSettingsModal(){
  const isGoogleUser = state.user && state.user.providerData.some(p=>p.providerId==="google.com");
  document.getElementById("modal-root").innerHTML = `
  <div class="modal-bg" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><h2 class="serif" style="font-size:20px;color:var(--navy-dark);margin:0;">Settings</h2><button class="icon-btn" onclick="closeModal()">${ICONS.xmark}</button></div>
      <div class="field"><span class="field-label">Flag dates as "due soon" within</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <input class="input" id="s-alertdays" type="number" min="1" max="60" value="${state.alertDays}" style="width:80px;" />
          <span style="font-size:13.5px;color:var(--muted);">days</span>
        </div>
      </div>
      <button class="btn-primary" onclick="saveAlertDays()">Save</button>

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">
        <div class="field-label" style="margin-bottom:8px;">Google Calendar</div>
        ${isGoogleUser ?
          (state.googleConnected ? `<div style="font-size:13px;color:var(--sage);font-weight:600;">${ICONS.check} Connected — new dates sync automatically while you use the app.</div>`
          : `<div style="font-size:13px;color:var(--brick);margin-bottom:8px;">Not connected right now.</div><button class="btn-ghost" onclick="reconnectGoogle()">Connect Google Calendar</button>`)
          : `<div style="font-size:13px;color:var(--muted);">Sign out and sign back in with "Continue with Google" to enable calendar sync.</div>`}
      </div>

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">
        <div class="field-label" style="margin-bottom:8px;">Backup</div>
        <button class="btn-ghost" onclick="exportData()">${ICONS.download} Download a full backup (.json)</button>
        <div style="font-size:11.5px;color:var(--muted);margin-top:6px;">A plain copy of every case, date, and checklist item — worth doing occasionally as a safety net.</div>
      </div>

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">
        <div class="field-label" style="margin-bottom:8px;">Custom types you've added</div>
        ${(state.customCaseTypes.length===0 && state.customProcedureTypes.length===0) ? `<div style="font-size:12.5px;color:var(--muted);">None yet — custom types you type into a case or date form will appear here, removable if added by mistake.</div>` : `
        ${state.customCaseTypes.length ? `<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Case types</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
            ${state.customCaseTypes.map(t=>`<span class="badge" style="border-color:var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:5px;">${esc(t)} <button onclick="removeCustomType('case','${esc(t).replace(/'/g,"&apos;")}')" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0;">${ICONS.xmark}</button></span>`).join("")}
          </div>` : ""}
        ${state.customProcedureTypes.length ? `<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Procedure types</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;">
            ${state.customProcedureTypes.map(t=>`<span class="badge" style="border-color:var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:5px;">${esc(t)} <button onclick="removeCustomType('procedure','${esc(t).replace(/'/g,"&apos;")}')" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0;">${ICONS.xmark}</button></span>`).join("")}
          </div>` : ""}
        `}
        <div style="font-size:11px;color:var(--muted);margin-top:6px;">Removing a type only hides it from future suggestions — cases already using it are unaffected.</div>
      </div>

      <div style="font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px;">
        ${state.cases.length} case${state.cases.length===1?"":"s"} · ${state.tasks.length} date${state.tasks.length===1?"":"s"} · ${state.checklist.length} checklist item${state.checklist.length===1?"":"s"}.<br/><br/>
        Signed in as ${esc(state.user.email)}. Your data is private to this account and syncs automatically across every device you sign in on.
      </div>
    </div>
  </div>`;
}
window.saveAlertDays = ()=>{ state.alertDays = Math.max(1, Number(document.getElementById("s-alertdays").value)||1); saveSettings(); closeModal(); };
window.removeCustomType = (kind, value)=>{
  if(kind==="case"){ state.customCaseTypes = state.customCaseTypes.filter(t=>t!==value); }
  else { state.customProcedureTypes = state.customProcedureTypes.filter(t=>t!==value); }
  saveSettings();
  openSettingsModal();
};
window.exportData = ()=>{
  const payload = { exportedAt: new Date().toISOString(), cases: state.cases, tasks: state.tasks, checklist: state.checklist };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `docket-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

if("serviceWorker" in navigator){ window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
