<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docket - Legal Case Manager</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --navy: #1e293b;
      --navy-dark: #0f172a;
      --slate: #475569;
      --muted: #94a3b8;
      --line: #e2e8f0;
      --surface: #f8fafc;
      --bg: #ffffff;
      --ink: #0f172a;
      --sage: #16a34a;
      --brass: #d97706;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif: Georgia, Cambria, "Times New Roman", Times, serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: var(--font-sans);
      background-color: var(--surface);
      color: var(--ink);
    }

    .serif { font-family: var(--font-serif); }
    .mono { font-family: var(--font-mono); }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }

    /* UI Components */
    .input {
      width: 100%; padding: 8px 12px;
      border: 1px solid var(--line); border-radius: 6px;
      font-size: 14px; background: #fff; outline: none;
    }
    .input:focus { border-color: var(--navy-dark); }
    
    .btn-primary {
      background: var(--navy-dark); color: #fff;
      border: none; padding: 8px 16px; border-radius: 6px;
      font-weight: 600; cursor: pointer; font-size: 13.5px;
    }
    .btn-ghost {
      background: transparent; border: 1px solid var(--line);
      color: var(--navy-dark); padding: 8px 14px; border-radius: 6px;
      font-weight: 600; cursor: pointer; font-size: 13.5px;
    }
    .icon-btn {
      background: none; border: none; cursor: pointer;
      color: var(--slate); padding: 4px; display: inline-flex;
      align-items: center; justify-content: center; border-radius: 4px;
    }
    .icon-btn:hover { background: var(--line); color: var(--navy-dark); }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 12px; font-size: 11.5px;
      font-weight: 600; border: 1px solid var(--line);
    }
    .group-badge {
      background: #f1f5f9; border: 1px solid var(--line);
      border-radius: 6px; padding: 4px 8px; font-size: 12px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .section-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px;
    }

    /* Modals */
    .modal-bg {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 16px;
    }
    .modal {
      background: #fff; border-radius: 12px; width: 100%;
      max-width: 480px; max-height: 90vh; overflow-y: auto;
      padding: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .modal.wide { max-width: 680px; }
    .modal-head {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 16px;
    }

    /* Case Cards & Tasks */
    .case-card {
      background: #fff; border: 1px solid var(--line);
      border-radius: 8px; padding: 14px; margin-bottom: 10px;
      cursor: pointer; transition: border-color 0.15s ease;
    }
    .case-card:hover { border-color: var(--muted); }
    .task-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px;
    }
    .checklist-row {
      display: flex; align-items: center; gap: 8px; padding: 6px 0;
    }
    .task-check {
      width: 18px; height: 18px; border-radius: 4px;
      border: 1px solid var(--muted); background: none;
      cursor: pointer; display: inline-flex; align-items: center;
      justify-content: center; padding: 0;
    }
    .field { margin-bottom: 14px; }
    .field-label { font-size: 12px; font-weight: 600; color: var(--slate); margin-bottom: 4px; display: block; }
    .search-wrap { position: relative; margin-bottom: 12px; }
    .search-wrap .input { padding-left: 32px; }
  </style>
</head>
<body>
  <div class="container">
    <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--line);">
      <div>
        <h1 class="serif" style="margin:0;font-size:24px;color:var(--navy-dark);">Docket</h1>
        <div id="auth-status" style="font-size:12px;color:var(--muted);margin-top:2px;">Checking connection…</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost" onclick="openSettingsModal()">Settings</button>
        <button class="btn-primary" onclick="openCaseModal()">+ New Case</button>
      </div>
    </header>

    <div id="view-cases"></div>
  </div>

  <div id="modal-root"></div>

  <script>
    /* ---- FIREBASE INITIALIZATION ---- */
    // Replace with your Firebase configuration parameters
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();
    googleProvider.addScope('https://www.googleapis.com/auth/calendar.events');

    /* ---- GLOBAL STATE ---- */
    const state = {
      user: null,
      cases: [],
      tasks: [],
      checklist: [],
      alertDays: 7,
      googleConnected: false,
      googleToken: localStorage.getItem('g_token') || null,
      search: "",
      filterCourt: "All",
      filterType: "All",
      filterStatus: "All",
      hideClosed: true,
      customCaseTypes: [],
      customProcedureTypes: [],
      selectedDay: new Date().toISOString().split('T')[0]
    };

    const CASE_TYPES = ["Civil", "Commercial", "Criminal", "Administrative", "Labor"];
    const PROCEDURE_TYPES = ["Hearing", "Pleading", "Appellate Brief", "Investigation", "Client Meeting"];
    const STATUS_OPTIONS = ["Active", "Pending", "Closed"];

    const ICONS = {
      xmark: `✕`,
      location_dot: `📍`,
      file_pdf: `📄`,
      clone: `📋`,
      pen: `✏️`,
      trash: `🗑️`,
      phone: `📞`,
      envelope: `✉️`,
      link: `🔗`,
      check: `✓`,
      triangle_exclamation: `⚠️`,
      download: `⬇️`,
      magnifying_glass: `🔍`,
      scale_balanced: `⚖️`,
      calendar: `📅`
    };

    /* ---- HELPER FUNCTIONS ---- */
    const esc = str => String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const todayKey = () => new Date().toISOString().split('T')[0];
    const uid = () => Math.random().toString(36).substr(2, 9);
    const stripId = obj => { const copy = { ...obj }; delete copy.id; return copy; };
    const daysBetween = (d1, d2) => Math.round((new Date(d2) - new Date(d1)) / (1000 * 60 * 60 * 24));
    const fmtLong = dStr => dStr ? new Date(dStr).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    const computeCaseTitle = c => c.title || (c.parties && c.parties.length ? c.parties.map(p => p.name).join(' v. ') : 'Untitled Case');
    const uniqueCourts = () => [...new Set(state.cases.map(c => c.court).filter(Boolean))];
    const colorForCaseType = type => "#1e293b";
    const iconForCaseType = type => "📁";
    const coll = name => db.collection("users").doc(state.user.uid).collection(name);

    /* ---- AUTH & DATA LISTENERS ---- */
    firebase.auth().onAuthStateChanged(user => {
      if (user) {
        state.user = user;
        state.googleConnected = !!state.googleToken;
        document.getElementById("auth-status").innerText = `Signed in as ${user.email || 'Google User'}`;
        initDataListeners(user.uid);
      } else {
        state.user = null;
        state.cases = []; state.tasks = []; state.checklist = [];
        document.getElementById("auth-status").innerText = "Not signed in";
        openAuthModal();
      }
      render();
    });

    function initDataListeners(uid) {
      coll("cases").onSnapshot(snap => {
        state.cases = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        render();
      });
      coll("tasks").onSnapshot(snap => {
        state.tasks = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        render();
      });
      coll("checklist").onSnapshot(snap => {
        state.checklist = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        render();
      });
    }

    /* ---- AUTHENTICATION MODAL & ACTIONS ---- */
    function openAuthModal() {
      document.getElementById("modal-root").innerHTML = `
      <div class="modal-bg">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-head"><h2 class="serif" style="margin:0;font-size:20px;">Account Access</h2></div>
          <div class="field">
            <span class="field-label">Email</span>
            <input class="input" id="auth-email" type="email" placeholder="attorney@firm.com" />
          </div>
          <div class="field">
            <span class="field-label">Password</span>
            <input class="input" id="auth-password" type="password" placeholder="••••••••" />
          </div>
          <div style="display:flex;gap:8px;margin-bottom:16px;">
            <button class="btn-primary" style="flex:1;" onclick="handleEmailSignIn()">Sign In</button>
            <button class="btn-ghost" style="flex:1;" onclick="handleEmailSignUp()">Register</button>
          </div>
          <div style="border-top:1px solid var(--line);padding-top:16px;text-align:center;">
            <button class="btn-ghost" style="width:100%;" onclick="signInWithGoogle()">Sign in with Google</button>
          </div>
        </div>
      </div>`;
    }

    window.handleEmailSignIn = () => {
      const e = document.getElementById("auth-email").value;
      const p = document.getElementById("auth-password").value;
      firebase.auth().signInWithEmailAndPassword(e, p).then(closeModal).catch(err => alert(err.message));
    };

    window.handleEmailSignUp = () => {
      const e = document.getElementById("auth-email").value;
      const p = document.getElementById("auth-password").value;
      firebase.auth().createUserWithEmailAndPassword(e, p).then(closeModal).catch(err => alert(err.message));
    };

    window.signInWithGoogle = async () => {
      try {
        const result = await firebase.auth().signInWithPopup(googleProvider);
        if (result.credential?.accessToken) {
          state.googleToken = result.credential.accessToken;
          state.googleConnected = true;
          localStorage.setItem('g_token', result.credential.accessToken);
        }
        closeModal();
      } catch (err) {
        alert("Google Sign-In failed: " + err.message);
      }
    };

    window.connectGoogleCalendar = async () => {
      try {
        const user = firebase.auth().currentUser;
        if (!user) return alert("Sign in first.");
        
        const result = await user.linkWithPopup(googleProvider).catch(async err => {
          if (err.code === 'auth/provider-already-linked' || err.code === 'auth/credential-already-in-use') {
            return await user.reauthenticateWithPopup(googleProvider);
          }
          throw err;
        });

        const token = result.credential?.accessToken;
        if (token) {
          state.googleToken = token;
          state.googleConnected = true;
          localStorage.setItem('g_token', token);
          saveSettings();
          openSettingsModal();
          alert("Google Calendar connected!");
        }
      } catch (err) {
        alert("Calendar Connection Failed: " + err.message);
      }
    };

    window.syncTaskToGoogleCalendar = async (taskId) => {
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      const caseObj = state.cases.find(c => c.id === task.caseId);
      const token = state.googleToken || localStorage.getItem('g_token');
      
      if (!token) return alert("Please connect Google Calendar in Settings first.");

      const event = {
        summary: `[Docket] ${task.type || 'Procedure'}: ${caseObj ? computeCaseTitle(caseObj) : task.title}`,
        description: task.notes || '',
        start: { date: task.date },
        end: { date: task.date }
      };

      try {
        const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(event)
        });
        if (res.status === 401) {
          state.googleConnected = false;
          localStorage.removeItem('g_token');
          alert("Session expired. Please reconnect Google Calendar in Settings.");
          return;
        }
        if (!res.ok) throw new Error(await res.text());
        alert("Event successfully added to Google Calendar!");
      } catch (err) {
        alert("Failed to sync to Google Calendar: " + err.message);
      }
    };

    /* ---- CASE & TASK MODALS ---- */
    function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

    function openCaseDetailModal(c) {
      const tk = todayKey();
      const tasks = state.tasks.filter(t => t.caseId === c.id).map(t => ({ ...t, delta: daysBetween(tk, t.date) })).sort((a,b) => a.date.localeCompare(b.date));
      const statusColor = c.status === "Closed" ? "var(--muted)" : c.status === "Active" ? "var(--sage)" : "var(--brass)";
      const linked = (c.linkedCaseIds || []).map(id => state.cases.find(x => x.id === id)).filter(Boolean);

      document.getElementById("modal-root").innerHTML = `
      <div class="modal-bg" onclick="closeModal()">
        <div class="modal wide" onclick="event.stopPropagation()">
          <div class="modal-head">
            <h2 class="serif" style="font-size:20px;color:var(--navy-dark);margin:0;">Case File</h2>
            <button class="icon-btn" onclick="closeModal()">${ICONS.xmark}</button>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
            <div>
              <div class="serif" style="font-size:21px;color:var(--navy-dark);">${esc(computeCaseTitle(c))}</div>
              ${c.court ? `<div style="font-size:13px;color:var(--slate);font-weight:600;margin-top:2px;">${ICONS.location_dot} ${esc(c.court)}</div>` : ""}
              ${c.courtNumber ? `<div class="mono" style="font-size:12.5px;color:var(--muted);margin-top:2px;">${esc(c.courtNumber)}</div>` : ""}
            </div>
            <div style="display:flex;gap:6px;">
              <button class="icon-btn" title="Duplicate case" onclick='duplicateCase(${JSON.stringify(c).replace(/'/g,"&apos;")})'>${ICONS.clone}</button>
              <button class="icon-btn" onclick='closeModal();openCaseModal(${JSON.stringify(c).replace(/'/g,"&apos;")})'>${ICONS.pen}</button>
              <button class="icon-btn" style="color:#B23A32;" onclick="confirmDeleteCase('${c.id}')">${ICONS.trash}</button>
            </div>
          </div>
          <div style="display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap;">
            <span class="badge" style="border-color:${colorForCaseType(c.caseType)};color:${colorForCaseType(c.caseType)};">${iconForCaseType(c.caseType)} ${esc(c.caseType)}</span>
            <span class="badge" style="border-color:${statusColor};color:${statusColor};">${c.status}</span>
          </div>

          ${c.notes ? `<div style="font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:16px;line-height:1.5;">${esc(c.notes)}</div>` : ""}

          <div style="margin-bottom:18px;">
            <div class="section-label">Case Log</div>
            <div style="display:flex;gap:6px;margin-bottom:8px;">
              <input class="input" id="log-entry-input" placeholder="Add a dated note…" />
              <button class="btn-ghost" onclick="addLogEntry('${c.id}')">Add</button>
            </div>
            ${(c.noteLog && c.noteLog.length) ? `<div>${c.noteLog.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(l => `
              <div style="font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;">
                <div><span class="mono" style="color:var(--muted);font-size:11px;">${fmtLong(l.date)}</span> — ${esc(l.text)}</div>
                <button onclick="deleteLogEntry('${c.id}','${l.id}')" style="background:none;border:none;color:var(--muted);cursor:pointer;">${ICONS.trash}</button>
              </div>`).join("")}</div>` : `<div style="color:var(--muted);font-size:12.5px;">No log entries yet.</div>`}
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <div class="section-label" style="margin-bottom:0;">Dates & Procedures</div>
            <button style="background:none;border:none;color:var(--navy);font-weight:700;font-size:12.5px;cursor:pointer;" onclick='closeModal();openTaskModal({caseId:"${c.id}",title:"",date:"${state.selectedDay}",type:"${PROCEDURE_TYPES[0]}",notes:"",completed:false})'>+ Add</button>
          </div>
          ${tasks.length === 0 ? `<div style="color:var(--muted);font-size:13px;">No dates scheduled for this case.</div>` :
            tasks.map(t => taskRowHtml(t, null, true)).join("")}

          <div id="delete-confirm-${c.id}"></div>
        </div>
      </div>`;
    }

    function taskRowHtml(t, caseObj, showCase) {
      return `
      <div class="task-row">
        <button class="task-check" onclick="toggleTaskDone('${t.id}')">${t.completed ? ICONS.check : ''}</button>
        <div style="flex:1;${t.completed ? 'text-decoration:line-through;color:var(--muted);' : ''}">
          <strong>${esc(t.type || 'Procedure')}</strong> - ${esc(t.title || (caseObj ? computeCaseTitle(caseObj) : 'Task'))}
          <div class="mono" style="font-size:11px;color:var(--muted);">${fmtLong(t.date)}</div>
        </div>
        <button class="icon-btn" title="Sync to Google Calendar" onclick="syncTaskToGoogleCalendar('${t.id}')">${ICONS.calendar}</button>
        <button class="icon-btn" onclick="deleteTaskDoc('${t.id}')">${ICONS.trash}</button>
      </div>`;
    }

    function caseCardHtml(c) {
      return `
      <div class="case-card" onclick="openCaseDetailModal(state.cases.find(x=>x.id==='${c.id}'))">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div class="serif" style="font-size:16px;font-weight:700;color:var(--navy-dark);">${esc(computeCaseTitle(c))}</div>
            ${c.court ? `<div style="font-size:12.5px;color:var(--slate);">${ICONS.location_dot} ${esc(c.court)}</div>` : ""}
          </div>
          <span class="badge">${c.status}</span>
        </div>
      </div>`;
    }

    window.openCaseDetail = id => openCaseDetailModal(state.cases.find(c => c.id === id));
    window.addLogEntry = caseId => {
      const input = document.getElementById("log-entry-input");
      const text = input.value.trim();
      if (!text) return;
      const c = state.cases.find(x => x.id === caseId);
      if (!c) return;
      const newLog = [...(c.noteLog || []), { id: uid(), date: todayKey(), text }];
      coll("cases").doc(caseId).set({ ...stripId(c), noteLog: newLog }).then(() => {
        openCaseDetailModal({ ...c, noteLog: newLog });
      });
    };

    window.deleteLogEntry = (caseId, logId) => {
      const c = state.cases.find(x => x.id === caseId);
      if (!c) return;
      const newLog = (c.noteLog || []).filter(l => l.id !== logId);
      coll("cases").doc(caseId).set({ ...stripId(c), noteLog: newLog }).then(() => {
        openCaseDetailModal({ ...c, noteLog: newLog });
      });
    };

    window.duplicateCase = c => {
      closeModal();
      const copy = { ...c, id: null, createdAt: Date.now(), courtNumber: "", linkedCaseIds: [c.id] };
      openCaseModal(copy);
    };

    window.confirmDeleteCase = id => {
      document.getElementById(`delete-confirm-${id}`).innerHTML = `
      <div style="margin-top:18px;background:#FBEAE8;border:1px solid #E5A39B;border-radius:8px;padding:12px;">
        <div style="font-size:13px;margin-bottom:10px;">Delete this case file and records permanently?</div>
        <div style="display:flex;gap:8px;">
          <button style="background:#B23A32;color:#fff;border:none;border-radius:6px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;" onclick="deleteCaseDoc('${id}');closeModal();">Delete</button>
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
        </div>
      </div>`;
    };

    window.deleteCaseDoc = id => coll("cases").doc(id).delete();
    window.toggleTaskDone = id => {
      const t = state.tasks.find(x => x.id === id);
      if (t) coll("tasks").doc(id).update({ completed: !t.completed });
    };
    window.deleteTaskDoc = id => coll("tasks").doc(id).delete();

    function openCaseModal(c = {}) {
      document.getElementById("modal-root").innerHTML = `
      <div class="modal-bg" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-head"><h2 class="serif" style="margin:0;font-size:18px;">${c.id ? 'Edit Case' : 'New Case File'}</h2></div>
          <div class="field"><span class="field-label">Case Title / Client Name</span><input class="input" id="c-title" value="${esc(c.title || '')}" /></div>
          <div class="field"><span class="field-label">Court / Authority</span><input class="input" id="c-court" value="${esc(c.court || '')}" /></div>
          <div class="field"><span class="field-label">File / Index Number</span><input class="input" id="c-number" value="${esc(c.courtNumber || '')}" /></div>
          <div class="field"><span class="field-label">Type</span>
            <select class="input" id="c-type">${CASE_TYPES.map(t => `<option value="${t}" ${c.caseType === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
          </div>
          <div class="field"><span class="field-label">Status</span>
            <select class="input" id="c-status">${STATUS_OPTIONS.map(s => `<option value="${s}" ${c.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
          </div>
          <button class="btn-primary" style="width:100%;margin-top:10px;" onclick="saveCase('${c.id || ''}')">Save Case</button>
        </div>
      </div>`;
    }

    window.saveCase = id => {
      const payload = {
        title: document.getElementById("c-title").value.trim(),
        court: document.getElementById("c-court").value.trim(),
        courtNumber: document.getElementById("c-number").value.trim(),
        caseType: document.getElementById("c-type").value,
        status: document.getElementById("c-status").value,
        createdAt: Date.now()
      };
      if (id) coll("cases").doc(id).update(payload);
      else coll("cases").add(payload);
      closeModal();
    };

    function openTaskModal(t = {}) {
      document.getElementById("modal-root").innerHTML = `
      <div class="modal-bg" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-head"><h2 class="serif" style="margin:0;font-size:18px;">Schedule Date / Task</h2></div>
          <div class="field"><span class="field-label">Procedure / Event Type</span><input class="input" id="t-type" value="${esc(t.type || '')}" placeholder="Hearing, Filing, etc." /></div>
          <div class="field"><span class="field-label">Date</span><input class="input" type="date" id="t-date" value="${t.date || state.selectedDay}" /></div>
          <div class="field"><span class="field-label">Notes</span><input class="input" id="t-notes" value="${esc(t.notes || '')}" /></div>
          <button class="btn-primary" style="width:100%;" onclick="saveTask('${t.caseId}', '${t.id || ''}')">Save</button>
        </div>
      </div>`;
    }

    window.saveTask = (caseId, id) => {
      const payload = {
        caseId,
        type: document.getElementById("t-type").value.trim(),
        date: document.getElementById("t-date").value,
        notes: document.getElementById("t-notes").value.trim(),
        completed: false
      };
      if (id) coll("tasks").doc(id).update(payload);
      else coll("tasks").add(payload);
      closeModal();
    };

    /* ---- SETTINGS & BACKUP ---- */
    function openSettingsModal() {
      document.getElementById("modal-root").innerHTML = `
      <div class="modal-bg" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-head">
            <h2 class="serif" style="font-size:20px;color:var(--navy-dark);margin:0;">Settings</h2>
            <button class="icon-btn" onclick="closeModal()">${ICONS.xmark}</button>
          </div>
          <div class="field"><span class="field-label">Flag dates as "due soon" within</span>
            <div style="display:flex;align-items:center;gap:8px;">
              <input class="input" id="s-alertdays" type="number" min="1" max="60" value="${state.alertDays}" style="width:80px;" />
              <span style="font-size:13.5px;color:var(--muted);">days</span>
            </div>
          </div>
          <button class="btn-primary" onclick="saveAlertDays()">Save</button>

          <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">
            <div class="field-label" style="margin-bottom:8px;">Google Calendar</div>
            ${state.googleConnected
              ? `<div style="font-size:13px;color:var(--sage);font-weight:600;">${ICONS.check} Connected — dates sync on demand.</div>`
              : `<div style="font-size:13px;color:var(--muted);margin-bottom:8px;">Connect your account to sync dates directly into Google Calendar.</div>
                 <button class="btn-ghost" onclick="connectGoogleCalendar()">Connect Google Calendar</button>`}
          </div>

          <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">
            <div class="field-label" style="margin-bottom:8px;">Account</div>
            <button class="btn-ghost" onclick="firebase.auth().signOut();closeModal();">Sign Out</button>
          </div>
        </div>
      </div>`;
    }

    window.saveAlertDays = () => {
      state.alertDays = Math.max(1, Number(document.getElementById("s-alertdays").value) || 1);
      closeModal();
    };

    /* ---- MAIN CASES VIEW RENDER ---- */
    function renderCases() {
      const q = state.search.trim().toLowerCase();
      const hideClosed = state.hideClosed !== false && !q;

      const filtered = state.cases.filter(c => {
        if (hideClosed && c.status === "Closed" && state.filterStatus !== "Closed") return false;
        if (state.filterType !== "All" && c.caseType !== state.filterType) return false;
        if (state.filterStatus !== "All" && c.status !== state.filterStatus) return false;
        if (state.filterCourt && state.filterCourt !== "All" && c.court !== state.filterCourt) return false;
        if (!q) return true;

        const title = computeCaseTitle(c).toLowerCase();
        return title.includes(q) || (c.courtNumber || "").toLowerCase().includes(q) || (c.court || "").toLowerCase().includes(q);
      }).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      const courts = uniqueCourts();

      document.getElementById("view-cases").innerHTML = `
        <div class="search-wrap">
          <span style="position:absolute;left:11px;top:11px;color:var(--muted);">${ICONS.magnifying_glass}</span>
          <input class="input" id="search-input" placeholder="Search title, court, or file number…" value="${esc(state.search)}" />
        </div>
        <div style="display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;">
          <select class="input" id="filter-court" style="width:auto;">
            <option value="All">All courts</option>
            ${courts.map(c => `<option value="${esc(c)}" ${state.filterCourt === c ? 'selected' : ''}>${esc(c)}</option>`).join("")}
          </select>
          <select class="input" id="filter-status" style="width:auto;">
            <option value="All">All statuses</option>
            ${STATUS_OPTIONS.map(s => `<option value="${s}" ${state.filterStatus === s ? 'selected' : ''}>${s}</option>`).join("")}
          </select>
        </div>
        ${filtered.length === 0 ? `<div style="text-align:center;padding:40px 10px;color:var(--muted);">${ICONS.scale_balanced}<br/>No legal matters found.</div>` :
          filtered.map(c => caseCardHtml(c)).join("")}
      `;

      const searchEl = document.getElementById("search-input");
      if (searchEl) {
        searchEl.oninput = e => {
          state.search = e.target.value;
          renderCases();
        };
      }
      const courtEl = document.getElementById("filter-court");
      if (courtEl) courtEl.onchange = e => { state.filterCourt = e.target.value; renderCases(); };
      const statusEl = document.getElementById("filter-status");
      if (statusEl) statusEl.onchange = e => { state.filterStatus = e.target.value; renderCases(); };
    }

    function render() {
      if (state.user) {
        renderCases();
      } else {
        document.getElementById("view-cases").innerHTML = "";
      }
    }
  </script>
</body>
</html>
