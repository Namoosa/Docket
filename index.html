        ${c.documents.map(d=>`<div style="margin-bottom:5px;"><a href="${esc(d.url)}" target="_blank">${ICONS.link} ${esc(d.label)}</a></div>`).join("")}</div>` : ""}

      ${linked.length? `<div style="margin-bottom:18px;"><div class="section-label" style="font-size:11px;">Linked cases</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">${linked.map(lc=>`<button class="group-badge" style="cursor:pointer;" onclick='closeModal();openCaseDetail("${lc.id}")'>${ICONS.link} ${esc(computeCaseTitle(lc))}</button>`).join("")}</div></div>` : ""}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div class="section-label" style="margin-bottom:0;">Dates & Procedures</div>
        <button style="background:none;border:none;color:var(--navy);font-weight:700;font-size:12.5px;" onclick='closeModal();openTaskModal({caseId:"${c.id}",title:"",date:"${state.selectedDay}",type:"${PROCEDURE_TYPES[0]}",notes:"",completed:false})'>+ Add</button>
      </div>
      ${tasks.length===0? `<div style="color:var(--muted);font-size:13px;">No dates yet for this case.</div>` :
        tasks.map(t=>taskRowHtml(t, null, true)).join("")}

      <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;">
        <div class="section-label" style="margin-bottom:0;">Checklist</div>
        <button style="background:none;border:none;color:var(--navy);font-weight:700;font-size:12.5px;" onclick='closeModal();openChecklistModal({caseId:"${c.id}",text:"",done:false})'>+ Add</button>
      </div>
      ${state.checklist.filter(x=>x.caseId===c.id).length===0 ? `<div style="color:var(--muted);font-size:13px;">No checklist items for this case.</div>` :
        state.checklist.filter(x=>x.caseId===c.id).map(it=>`<div class="checklist-row"><button class="task-check" onclick="toggleChecklistDone('${it.id}')" style="${it.done?'border-color:var(--sage);':''}">${it.done?ICONS.check:''}</button><div style="flex:1;font-size:13.5px;cursor:pointer;${it.done?'text-decoration:line-through;color:var(--muted);':''}" onclick='openChecklistModal(${JSON.stringify(it).replace(/'/g,"&apos;")})'>${esc(it.text)}</div><button onclick="deleteChecklistItem('${it.id}')" style="background:none;border:none;color:var(--muted);">${ICONS.trash}</button></div>`).join("")}

      <div id="delete-confirm-${c.id}"></div>
    </div>
  </div>`;
}
window.openCaseDetail = (id)=> openCaseDetailModal(state.cases.find(c=>c.id===id));
window.addLogEntry = (caseId)=>{
  const input = document.getElementById("log-entry-input");
  const text = input.value.trim();
  if(!text) return;
  const c = state.cases.find(x=>x.id===caseId);
  if(!c) return;
  const newLog = [...(c.noteLog||[]), { id: uid(), date: todayKey(), text }];
  coll("cases").doc(caseId).set({...stripId(c), noteLog: newLog}).then(()=>{
    openCaseDetailModal({...c, noteLog: newLog});
  });
};
window.editLogEntry = (caseId, logId)=>{
  const c = state.cases.find(x=>x.id===caseId);
  if(!c) return;
  const entry = (c.noteLog||[]).find(l=>l.id===logId);
  if(!entry) return;
  const newText = prompt("Edit log entry:", entry.text);
  if(newText===null || !newText.trim()) return;
  const newLog = (c.noteLog||[]).map(l=> l.id===logId ? {...l, text:newText.trim()} : l);
  coll("cases").doc(caseId).set({...stripId(c), noteLog:newLog}).then(()=>{
    openCaseDetailModal({...c, noteLog:newLog});
  });
};
window.deleteLogEntry = (caseId, logId)=>{
  const c = state.cases.find(x=>x.id===caseId);
  if(!c) return;
  const newLog = (c.noteLog||[]).filter(l=>l.id!==logId);
  coll("cases").doc(caseId).set({...stripId(c), noteLog:newLog}).then(()=>{
    openCaseDetailModal({...c, noteLog:newLog});
  });
};
window.logPartyContact = (caseId, partyName, kind)=>{
  const c = state.cases.find(x=>x.id===caseId);
  if(!c) return;
  const text = kind==="call" ? `Called ${partyName}` : `Emailed ${partyName}`;
  const newLog = [...(c.noteLog||[]), { id: uid(), date: todayKey(), text }];
  coll("cases").doc(caseId).set({...stripId(c), noteLog: newLog}).then(()=>{
    showToast("Logged to Case Log");
    openCaseDetailModal({...c, noteLog: newLog});
  });
};
window.duplicateCase = (c)=>{
  closeModal();
  const copy = { ...c, id:null, createdAt:null, courtNumber:"", linkedCaseIds:[c.id], documents:[] };
  openCaseModal(copy);
};
window.confirmDeleteCase = (id)=>{
  document.getElementById(`delete-confirm-${id}`).innerHTML = `
  <div style="margin-top:18px;background:#FBEAE8;border:1px solid #E5A39B;border-radius:8px;padding:12px;">
    <div style="font-size:13px;margin-bottom:10px;">${ICONS.triangle_exclamation} Delete this case, all its dates and checklist items? This can't be undone.</div>
    <div style="display:flex;gap:8px;">
      <button style="background:#B23A32;color:#fff;border:none;border-radius:6px;padding:7px 14px;font-weight:600;font-size:13px;" onclick="deleteCaseDoc('${id}');closeModal();">Delete</button>
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  </div>`;
};
window.deleteCaseDoc = deleteCaseDoc;

function openSettingsModal(){
  const allCaseTypes = [...CASE_TYPES, ...state.customCaseTypes];
  if(!window._tempTemplateType || !allCaseTypes.includes(window._tempTemplateType)) window._tempTemplateType = allCaseTypes[0];
  document.getElementById("modal-root").innerHTML = `
  <div class="modal-bg" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><h2 class="serif" style="font-size:20px;color:var(--navy-dark);margin:0;">Settings</h2><button class="icon-btn" onclick="closeModal()">${ICONS.xmark}</button></div>
      <button class="btn-ghost" style="width:100%;margin-bottom:16px;" onclick="closeModal();openQuickReference(false)">${ICONS.info} Quick reference</button>
      <div class="field"><span class="field-label">Flag dates as "due soon" within</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <input class="input" id="s-alertdays" type="number" min="1" max="60" value="${state.alertDays}" style="width:80px;" />
          <span style="font-size:13.5px;color:var(--muted);">days</span>
        </div>
      </div>
      <button class="btn-primary" onclick="saveAlertDays()">Save</button>

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">
        <div class="field-label" style="margin-bottom:8px;">Google Calendar</div>
        ${state.googleConnected
          ? (()=>{
              const unsynced = state.tasks.filter(t=>!t.completed && !t.googleEventId).length;
              return `<div style="font-size:13px;color:var(--sage);font-weight:600;">${ICONS.check} Connected — new dates sync automatically, with reminders (1 day + 1 hour before; 3 days too for Critical) handled by Google Calendar itself.</div>
              ${unsynced>0 ? `<button class="btn-ghost" style="margin-top:10px;" onclick="syncAllUnsynced()">${ICONS.rotate} Sync ${unsynced} unsynced date${unsynced===1?'':'s'} now</button>
              <div style="font-size:11px;color:var(--muted);margin-top:5px;">These were likely added while disconnected, so they never made it to Google Calendar. This catches them up.</div>` : ''}`;
            })()
          : `<div style="font-size:13px;color:var(--muted);margin-bottom:8px;">Not connected. Dates added while disconnected won't sync automatically — you can still add any of them to Google Calendar manually with one tap (look for the calendar icon next to any date), or reconnect and use "Sync unsynced dates" below.</div>
             <button class="btn-ghost" onclick="connectGoogleCalendar()">Connect Google Calendar</button>`}
      </div>

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">
        <div class="field-label" style="margin-bottom:8px;">Backup</div>
        <button class="btn-ghost" onclick="exportData()">${ICONS.download} Download a full backup (.json)</button>
        <div style="font-size:11.5px;color:var(--muted);margin-top:6px;">A plain copy of every case, date, and checklist item — worth doing occasionally as a safety net.</div>
      </div>

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">
        <div class="field-label" style="margin-bottom:8px;">Custom case types you've added</div>
        ${state.customCaseTypes.length===0 ? `<div style="font-size:12.5px;color:var(--muted);">None yet — custom case types you type into the case form will appear here, removable if added by mistake. (Procedure type is fixed to Hearing/Procedure.)</div>` : `
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
            ${state.customCaseTypes.map(t=>`<span class="badge" style="border-color:var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:5px;">${esc(t)} <button onclick="removeCustomType('case','${esc(t).replace(/'/g,"&apos;")}')" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0;">${ICONS.xmark}</button></span>`).join("")}
        </div>
        `}
        <div style="font-size:11px;color:var(--muted);margin-top:6px;">Removing a type only hides it from future suggestions — cases already using it are unaffected.</div>
      </div>

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">
        <div class="field-label" style="margin-bottom:8px;">Starting checklist by case type</div>
        <div style="font-size:11.5px;color:var(--muted);margin-bottom:8px;">Every new case of a type below starts with these checklist items already added — one per line.</div>
        <select class="input" id="tmpl-type-select" onchange="onTemplateTypeChange()">
          ${allCaseTypes.map(t=>`<option value="${esc(t)}" ${window._tempTemplateType===t?'selected':''}>${esc(t)}</option>`).join("")}
        </select>
        <textarea class="input" id="tmpl-items" rows="4" placeholder="e.g.&#10;Review case file&#10;Confirm client contact" style="margin-top:6px;resize:vertical;">${esc((state.checklistTemplates[window._tempTemplateType]||[]).join("\n"))}</textarea>
        <button class="btn-ghost" style="margin-top:6px;" onclick="saveChecklistTemplate()">Save template for this type</button>
      </div>

      <div style="font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px;">
        ${state.cases.length} case${state.cases.length===1?"":"s"} · ${state.tasks.length} date${state.tasks.length===1?"":"s"} · ${state.checklist.length} checklist item${state.checklist.length===1?"":"s"}.<br/><br/>
        Signed in as ${esc(state.user.email)}. Your data is private to this account and syncs automatically across every device you sign in on.
      </div>
    </div>
  </div>`;
}
window.saveAlertDays = ()=>{ state.alertDays = Math.max(1, Number(document.getElementById("s-alertdays").value)||1); saveSettings(); closeModal(); };
window.openQuickReference = (isFirstTime)=>{
  const legendTypes = [...PROCEDURE_TYPES];
  document.getElementById("modal-root").innerHTML = `
  <div class="modal-bg" onclick="closeModal()">
    <div class="modal wide" onclick="event.stopPropagation()">
      <div class="modal-head"><h2 class="serif" style="font-size:20px;color:var(--navy-dark);margin:0;">${isFirstTime?'Welcome to Docket':'Quick Reference'}</h2><button class="icon-btn" onclick="closeModal()">${ICONS.xmark}</button></div>

      <div style="margin-bottom:16px;">
        <div class="section-label">Calendar icons</div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;">
          ${legendTypes.map(t=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;"><span style="color:${colorForProcedure(t)};">${iconForProcedure(t)}</span> ${esc(t)}</span>`).join("")}
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <div class="section-label">Flags</div>
        <div style="font-size:13px;line-height:1.7;">
          <div><span class="badge" style="border-color:var(--critical);color:var(--critical);">CRITICAL</span> — a can't-miss date. Pinned to the top of Calendar no matter how far away.</div>
          <div style="margin-top:6px;"><span class="badge" style="border-color:var(--heads-up);color:var(--heads-up);">Heads-up</span> — a gentle nudge. Shows automatically as any date approaches (based on your Settings), or force it earlier with the FYI flag.</div>
          <div style="margin-top:6px;"><span class="badge" style="border-color:var(--overdue);color:var(--overdue);">Overdue</span> — passed and not yet marked done.</div>
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <div class="section-label">Cases</div>
        <div style="font-size:13px;line-height:1.7;color:var(--ink);">
          Link related cases to each other from the case form. Counsel and Criminal case types get their own simplified fields. Filter by court to see everything open at a specific courthouse.
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <div class="section-label">Checklist</div>
        <div style="font-size:13px;line-height:1.7;color:var(--ink);">
          Link a checklist item to a specific date, or to "Next court hearing" so it automatically follows whichever hearing is soonest — even through postponements.
        </div>
      </div>

      <div style="margin-bottom:16px;background:#FBEAE8;border:1px solid #E5A39B;border-radius:8px;padding:10px 12px;">
        <div class="section-label" style="color:var(--brick);">${ICONS.triangle_exclamation} Google Calendar — important</div>
        <div style="font-size:13px;line-height:1.7;color:var(--ink);">
          Anything you add while <strong>not</strong> connected won't sync to Google Calendar automatically — Docket has no way to reach it until you reconnect. The connection can quietly lapse (usually within about an hour), so it's worth checking the Calendar tab occasionally for the "Reconnect" banner.<br/><br/>
          Already added something while disconnected? Reconnect, then either open that date and tap Save (even with no changes) to sync just that one, or use <strong>Settings → Sync unsynced dates</strong> to catch up everything at once.
        </div>
      </div>

      <div style="margin-bottom:8px;">
        <div class="section-label">Calendar navigation</div>
        <div style="font-size:13px;line-height:1.7;color:var(--ink);">
          Swipe left/right to change months, or tap the month name to jump straight to any month.
        </div>
      </div>

      ${isFirstTime ? `<button class="btn-primary" style="width:100%;margin-top:10px;" onclick="closeModal()">Get started</button>` : ""}
    </div>
  </div>`;
};
window.removeCustomType = (kind, value)=>{
  if(kind==="case"){ state.customCaseTypes = state.customCaseTypes.filter(t=>t!==value); }
  else { state.customProcedureTypes = state.customProcedureTypes.filter(t=>t!==value); }
  saveSettings();
  openSettingsModal();
};
window.onTemplateTypeChange = ()=>{
  window._tempTemplateType = document.getElementById("tmpl-type-select").value;
  openSettingsModal();
};
window.saveChecklistTemplate = ()=>{
  const type = window._tempTemplateType;
  const lines = document.getElementById("tmpl-items").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(lines.length){ state.checklistTemplates = {...state.checklistTemplates, [type]: lines}; }
  else { const {[type]:_, ...rest} = state.checklistTemplates; state.checklistTemplates = rest; }
  saveSettings();
  showToast(`Template saved for ${type}`);
  openSettingsModal();
};
window.exportData = ()=>{
  const payload = { exportedAt: new Date().toISOString(), cases: state.cases, tasks: state.tasks, checklist: state.checklist };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `docket-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

if("serviceWorker" in navigator){ window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
