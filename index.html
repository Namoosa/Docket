<style>
  :root{
    --ink:#20242C; --paper:#ECE7DA; --panel:#FBF9F3; --navy:#22344A; --navy-dark:#182234;
    --brass:#8F6526; --brick:#9A3B33; --sage:#556B4F; --slate:#3D5871; --line:#D8D0BB; --muted:#7B7566; --surface:#F6F1E4;
    --purple:#6B5B8C; --clay:#8A6E4B; --info:#3E6B8A;
    --overdue:#B23A32; --critical:#6B2439; --heads-up:#3E6B8A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:90px;}
  html[lang="ar"] body{font-family:'IBM Plex Sans Arabic',sans-serif;}
  html[lang="ar"] .serif{font-family:'Amiri',serif;}
  html[lang="ar"] .mono{font-family:'IBM Plex Sans Arabic',monospace;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--navy) !important;}
  .serif{font-family:'Source Serif 4',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:var(--slate);}
  .hidden{display:none !important;}
  .input{width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-size:15px; color:var(--ink);}
  .btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:8px;border:none;background:var(--navy);color:var(--panel);font-weight:600;font-size:14px;}
  .btn-google{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:#3c4043;font-weight:600;font-size:14px;}
  .btn-ghost{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--navy);font-weight:600;font-size:13px;}
  .icon-btn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;color:var(--navy);}
  .field-label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  #auth-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .auth-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px 24px; width:100%; max-width:380px;}
  .auth-tabs{display:flex; gap:6px; margin-bottom:18px;}
  .auth-tab{flex:1; text-align:center; padding:9px 0; border-radius:7px; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--surface); color:var(--muted);}
  .auth-tab.active{background:var(--navy); color:var(--panel); border-color:var(--navy);}
  #auth-error{color:#B23A32; font-size:12.5px; margin-top:8px; min-height:16px;}
  .or-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px;}
  .or-divider::before,.or-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  header{background:var(--navy-dark); color:var(--panel); padding:16px 16px 12px;}
  .header-inner{max-width:800px;margin:0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
  .brand{display:flex;align-items:center;gap:8px;font-size:19px;margin-inline-end:auto;}
  #header-badges{display:flex;gap:6px;order:2;}
  .header-actions{display:flex;gap:8px;align-items:center;order:3;}
  @media (max-width:640px){
    #header-badges{order:4;flex-basis:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none;}
    #header-badges::-webkit-scrollbar{display:none;}
    #header-badges .badge{flex-shrink:0;white-space:nowrap;}
    .header-actions{order:2;}
  }
  .badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1.3px solid; font-weight:600; white-space:nowrap;}
  main{max-width:800px;margin:0 auto;padding:16px 16px 0;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tab-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:13px;}
  .tab-btn.active{background:var(--navy);color:var(--panel);border-color:var(--navy);}
  .cal-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;margin-bottom:14px;}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-wd{text-align:center;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;}
  .cal-day{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;position:relative;}
  .cal-day.today{border:1.5px solid var(--brass);}
  .cal-day.selected{border:2px solid var(--navy); background:#DFE3E8;}
  .cal-day.has-critical{box-shadow:inset 0 0 0 2px var(--critical);}
  .dot{width:5px;height:5px;border-radius:3px;}
  .overdue-mark{position:absolute;top:2px;inset-inline-end:3px;width:6px;height:6px;border-radius:3px;background:#B23A32;}
  .critical-mark{position:absolute;top:2px;inset-inline-start:3px;width:6px;height:6px;border-radius:3px;background:var(--critical);}
  .cal-icon svg{width:12.5px !important;height:12.5px !important;vertical-align:middle !important;}
  .section-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;}
  .task-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;}
  .task-row.overdue{border-color:#D9A9A3;}
  .task-check{background:none;border:1.5px solid var(--line);border-radius:5px;width:23px;height:23px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .task-title{font-size:13.5px;font-weight:600;}
  .task-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .case-card{width:100%;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px;}
  .search-wrap{position:relative;margin-bottom:10px;}
  .search-wrap input{padding-inline-start:32px;}
  .fab{position:fixed;inset-inline-end:20px;bottom:24px;width:56px;height:56px;border-radius:28px;background:var(--brass);color:var(--navy-dark);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);font-size:26px;z-index:40;}
  .modal-bg{position:fixed;inset:0;background:rgba(24,20,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
  .modal{background:var(--paper);width:100%;max-width:460px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 20px 28px;}
  @media(min-width:640px){ .modal{border-radius:16px; margin-bottom:5vh;} }
  .modal.wide{max-width:640px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .doc-link-row{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:5px;}
  .install-banner{background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--brass);border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;font-size:13px;line-height:1.5;}
  .party-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .party-row select{flex:0 0 34%;}
  .link-check-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .link-check-row:last-child{border-bottom:none;}
  .radio-row{display:flex;gap:8px;flex-wrap:wrap;}
  .radio-pill{flex:1;min-width:110px;text-align:center;padding:8px 6px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted);}
  .radio-pill.active{background:var(--navy);color:var(--panel);border-color:var(--navy);}
  .group-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--purple);border:1px solid var(--purple);border-radius:3px;padding:2px 6px;font-weight:600;}
  .checklist-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;}
  /* Icon sizing — inline SVGs, self-contained, no external font dependency */
  .icon-btn svg{width:18px;height:18px;}
  .tab-btn svg{margin-inline-end:3px;}
  .fab svg{width:22px;height:22px;}
  .brand svg{width:20px;height:20px;}
  .badge svg{width:12px;height:12px;vertical-align:-2px !important;}
  #print-area{display:none;}
  .app-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy-dark);color:var(--panel);padding:11px 18px;border-radius:8px;font-size:13px;max-width:88vw;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;transition:opacity .25s, transform .25s;z-index:200;}
  .app-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block !important;position:absolute;top:0;left:0;width:100%;padding:0;color:#000;font-family:'Source Serif 4',serif;}
    #print-area .letterhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2px solid #1B211B;padding-bottom:12px;margin-bottom:20px;}
    #print-area .letterhead-name{font-family:'Source Serif 4',serif;font-size:19px;font-weight:600;color:#1B211B;}
    #print-area .letterhead-meta{font-family:'Inter',sans-serif;font-size:11px;color:#555;margin-top:3px;line-height:1.5;}
    #print-area .letterhead-date{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#666;text-align:end;white-space:nowrap;}
    #print-area h1{font-family:'Source Serif 4',serif;font-size:20px;margin-bottom:4px;}
    #print-area .p-sub{font-family:'Inter',sans-serif;color:#555;font-size:12.5px;margin-bottom:18px;}
    #print-area .p-section{margin-bottom:20px;page-break-inside:avoid;}
    #print-area .p-section-title{font-family:'Inter',sans-serif;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#555;font-weight:600;border-bottom:1px solid #ccc;padding-bottom:4px;margin-bottom:8px;}
    #print-area .p-item{font-family:'Inter',sans-serif;padding:6px 0;border-bottom:1px solid #eee;font-size:13px;page-break-inside:avoid;}
    #print-area .p-item .p-meta{color:#666;font-size:11.5px;margin-top:2px;}
    #print-area .print-footer{margin-top:28px;padding-top:10px;border-top:1px solid #ccc;font-family:'Inter',sans-serif;font-size:10px;color:#888;}
  }
  @page{ margin: 0.7in; }
</style>
</head>

  qr_flag_critical:{en:"a can't-miss date. Pinned to the top of Calendar no matter how far away — and marks the whole case card as critical too, so it stands out in the Cases list.",ar:"موعد لا يجوز تفويته. يبقى مثبتًا أعلى التقويم مهما بعد — ويسم بطاقة القضية كاملة كذلك، فتبرز في قائمة القضايا."},
  qr_flag_headsup:{en:"a gentle nudge. Shows automatically as any date approaches (based on your Settings), or force it earlier with the FYI flag.",ar:"تنبيه لطيف. يظهر تلقائيًا كلما اقترب أي موعد (حسب إعداداتك)، أو فعّله مبكرًا بوسم للعلم."},
  qr_flag_overdue:{en:"passed and not yet marked done.",ar:"مضى ولم يُوسم كمكتمل بعد."},
  qr_cases_section:{en:"Cases",ar:"القضايا"},
  qr_cases_body:{en:"Link related cases to each other from the case form. Counsel and Criminal case types get their own simplified fields — Counsel cases show a distinct badge next to the name. Each card shows the next hearing date and how long it's been since anything happened on the case. Filter by court to see everything open at a specific courthouse. Adding a case with a name close to an existing one prompts a soft duplicate check, in case it's the same matter.",ar:"اربط القضايا ذات الصلة ببعضها من نموذج القضية. لقضايا الاستشارة والجنائية حقول مبسطة خاصة بها — تظهر قضايا الاستشارة بوسم مميز بجانب الاسم. تعرض كل بطاقة تاريخ الجلسة القادمة ومدة عدم وجود أي نشاط في القضية. صفِّ حسب المحكمة لرؤية كل ما هو مفتوح في محكمة معينة. إضافة قضية باسم قريب من قضية موجودة يستدعي تنبيهًا لطيفًا للتحقق من كونها نفس القضية."},
  qr_status_section:{en:"Case status",ar:"حالة القضية"},
  qr_status_body:{en:"Statuses follow the intake pipeline: Pending Partner Review → Pending Power of Attorney → Pending Documents → Active → On Hold → Closed. A case only counts as \"stale\" (no upcoming dates) once it's Active — the earlier stages aren't expected to have a date yet.",ar:"تتبع الحالات مسار الاستلام: مراجعة الأستاذ ← توكيل الموكل ← تقديم مستندات ← قيد العمل ← معلقة ← مغلقة. لا تُحتسب القضية \"بلا مواعيد قادمة\" إلا إذا كانت قيد العمل — فالمراحل السابقة لا يُتوقع أن يكون لها موعد بعد."},
  qr_hearings_section:{en:"Postponing a hearing",ar:"تأجيل الجلسة"},
  qr_hearings_body:{en:'Open a Hearing that\'s already on the docket and tap "Continue — schedule the next session" to log a postponement. A "Prepare memorandum" checklist item is checked by default — linked to whichever hearing is next, so it doesn\'t need re-linking if postponed again — but uncheck it if this particular postponement doesn\'t need one. If a Hearing passes and nobody logs what happened, a "Get the next hearing date" reminder appears on the Checklist by itself.',ar:'افتح جلسة موجودة بالفعل في الدفتر واضغط "متابعة — تحديد الجلسة القادمة" لتسجيل التأجيل. مهمة "إعداد مذكرة" مفعّلة افتراضيًا — مرتبطة بأقرب جلسة قادمة، فلا تحتاج لإعادة الربط إذا تأجلت مجددًا — لكن يمكن إلغاء تفعيلها إن لم يكن هذا التأجيل بالذات بحاجة إلى مذكرة. إذا مرت جلسة دون تسجيل ما حدث فيها، يظهر تذكير "الحصول على موعد الجلسة القادمة" في قائمة المهام من تلقاء نفسه.'},
  qr_ruling_section:{en:"No more hearings",ar:"لا مزيد من الجلسات"},
  qr_ruling_body:{en:'When a hearing is the final one — the ruling was issued — open it and tap "Ruling issued — no further session" instead of Continue. This marks it done, logs it to the Case Log, and closes the case automatically.',ar:'عندما تكون الجلسة هي الأخيرة — بعد صدور الحكم — افتحها واضغط "صدر الحكم — لا جلسة قادمة" بدلاً من المتابعة. يؤدي هذا إلى وسمها كمكتملة، وتسجيلها في سجل القضية، وإغلاق القضية تلقائيًا.'},
  qr_checklist_section:{en:"Checklist",ar:"قائمة المهام"},
  qr_checklist_body:{en:'Link a checklist item to "Next hearing" so it automatically follows whichever hearing is soonest — even through postponements — or pick a specific date instead.',ar:'اربط عنصر القائمة بـ "الجلسة القادمة" ليتبع تلقائيًا أقرب جلسة — حتى مع التأجيلات — أو اختر تاريخًا محددًا بدلاً من ذلك.'},
  qr_today_section:{en:"Today & Tomorrow in court",ar:"اليوم وغدًا في المحكمة"},
  qr_today_body:{en:"The Calendar tab opens with today's hearings and other court procedures front and center (anything due today that isn't a paperwork-only deadline), plus every other open task and checklist item for any case at the same court — useful if you're already headed there. A Tomorrow card appears the same way starting at 2pm, to help you walk in prepared.",ar:"يفتح تبويب التقويم بجلسات اليوم وإجراءات المحكمة الأخرى في المقدمة (كل ما يستحق اليوم وليس مجرد موعد نهائي ورقي)، بالإضافة إلى كل مهمة وعنصر قائمة مفتوح آخر لأي قضية في نفس المحكمة — مفيد إن كنت متجهًا إليها أصلاً. تظهر بطاقة الغد بنفس الطريقة ابتداءً من الساعة 2 ظهرًا، لتدخل جاهزًا."},
  qr_deadline_calc_section:{en:"Statutory deadline calculator",ar:"حاسبة المواعيد القانونية"},
  qr_deadline_calc_body:{en:"Settings → Tools → Statutory deadline calculator. Enter a start date and a number of days and it counts the way Libyan procedural law does — start date excluded, and a final day landing on the weekend pushes to the next working day. Save your own frequently-used periods as presets.",ar:"الإعدادات ← الأدوات ← حاسبة المواعيد القانونية. أدخل تاريخ البداية وعدد الأيام، وتحسب الموعد وفق طريقة القانون الليبي — باستثناء تاريخ البداية، وإذا وقع اليوم الأخير في عطلة نهاية الأسبوع يُمدد إلى يوم العمل التالي. احفظ المدد التي تستخدمها كثيرًا كقوالب جاهزة."},

  qr_gcal_title:{en:"Google Calendar — important",ar:"تقويم غوغل — مهم"},
  qr_gcal_body:{en:'Anything you add while <strong>not</strong> connected won\'t sync to Google Calendar automatically — Docket has no way to reach it until you reconnect. The connection can quietly lapse (usually within about an hour), so it\'s worth checking the Calendar tab occasionally for the "Reconnect" banner.<br/><br/>Already added something while disconnected? Reconnect, then either open that date and tap Save (even with no changes) to sync just that one, or use <strong>Settings → Sync unsynced dates</strong> to catch up everything at once.',ar:'أي شيء تضيفه أثناء <strong>عدم</strong> الاتصال لن يتزامن تلقائيًا مع تقويم غوغل — لا توجد وسيلة للوصول إليه حتى تعيد الاتصال. قد ينقطع الاتصال بهدوء (عادة خلال ساعة تقريبًا)، لذا يستحق التحقق من تبويب التقويم أحيانًا لشريط "إعادة الاتصال".<br/><br/>أضفت شيئًا أثناء الانقطاع؟ أعد الاتصال، ثم افتح ذلك الموعد واضغط حفظ (حتى بلا تغييرات) لمزامنته وحده، أو استخدم <strong>الإعدادات ← مزامنة المواعيد غير المتزامنة</strong> لتحديث كل شيء دفعة واحدة.'},

function tr(key, vars){
  const entry = TRANSLATIONS[key];
  let str = entry ? (entry[state.lang] || entry.en || key) : key;
  if(vars){ Object.keys(vars).forEach(k=>{ str = str.replace(`{${k}}`, vars[k]); }); }
  return str;
}
function applyLanguageDir(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang==="ar" ? "rtl" : "ltr";
}
window.toggleLanguage = ()=>{
  state.lang = state.lang==="ar" ? "en" : "ar";
  applyLanguageDir();
  saveSettings();
  render();
};

/* ================= STATE ================= */
let state = {
  lang:"en",
  user:null, googleAccessToken:null, googleConnected:false, calendarEverConnected:false, hasSeenQuickRef:false,
  cases:[], tasks:[], checklist:[],
  customCaseTypes:[], customProcedureTypes:[], alertDays:7, onboardDismissed:false, checklistTemplates:{}, hearingPrepDefaults:[], deadlinePresets:[], letterhead:{name:"",subtitle:"",contact:""},
  view:"calendar", cursorY:new Date().getFullYear(), cursorM:new Date().getMonth(),
  selectedDay: todayKey(), search:"", filterType:"All", filterStatus:"All", filterCourt:"All",
};
let unsubCases=null, unsubTasks=null, unsubChecklist=null, unsubSettings=null;

function todayKey(){ return dateKey(new Date()); }
function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return dateKey(d); }
// Implements Libya's Code of Civil & Commercial Procedure, Art. 16 & 19 (per the
// Miqat Ledger research): the triggering day itself (service/notification) is never
// counted — the count starts the next day and runs to the close of the Nth day.
// A holiday landing on the LAST day pushes the deadline to the next working day.
// The Libyan work week is Sunday-Thursday, so both Friday and Saturday are
// non-working — the Ledger's cited ruling only pushed a Friday to a Saturday,
// which reads like a single-day-weekend era; today's two-day weekend means a
// deadline landing on either day pushes through to the next Sunday. Distance
// days (Art. 17) are added on top before counting, same as the ordinary period.
function calcStatutoryDeadline(startKey, days, distanceDays){
  const total = Number(days||0) + Number(distanceDays||0);
  let d = parseKey(addDays(startKey, total));
  let pushedForHoliday = false;
  while(d.getDay()===5 || d.getDay()===6){ // Friday or Saturday
    d.setDate(d.getDate()+1);
    pushedForHoliday = true;
  }
  return { date: dateKey(d), pushedForHoliday, totalDays: total };
}
function googleCalendarAddLink(task, caseItem){
  const title = (caseItem ? computeCaseTitle(caseItem) + " — " : "") + task.title;
  const start = task.date.replace(/-/g,"");
  const end = addDays(task.date,1).replace(/-/g,"");
  const params = new URLSearchParams({
    action: "TEMPLATE",
    text: title,
    dates: `${start}/${end}`,
    details: task.notes || ""
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}
function daysBetween(a,b){ return Math.round((parseKey(b)-parseKey(a))/86400000); }
function fmtLong(k){ const d=parseKey(k); return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// Wraps embedded dynamic text (case/court/party names, dates) in a bidi isolate.
// Without this, Arabic case data sitting inline with Latin UI chrome text (or vice
// versa) has no boundary for the browser's bidi algorithm, so the whole line's
// visual order gets scrambled — including digits silently rendering as Arabic-Indic
// glyphs even though the underlying character is a plain Western "0". <bdi> gives
// each piece its own resolved direction without affecting anything around it.
function bdi(s){ return `<bdi>${esc(s)}</bdi>`; }

function uniqueCourts(){
  const set = new Set();
  state.cases.forEach(c=>{ if(c.court && c.court.trim()) set.add(c.court.trim()); });
  return Array.from(set).sort();
}
function computeCaseTitle(c){
  if(c.titleSource==="subject" && c.subject) return c.subject;
  const wantRole = c.titleSource==="client" ? "Client" : "Opponent";
  const party = (c.parties||[]).find(p=>p.role===wantRole);
  if(party) return wantRole==="Opponent" ? `v. ${party.name}` : party.name;
  if(c.subject) return c.subject;
  if(c.parties && c.parties[0]) return c.parties[0].name;
  return "Untitled case";
}

async function googleSignIn(){
  const errEl = document.getElementById("auth-error");
  if(errEl) errEl.textContent = "";
  const provider = new firebase.auth.GoogleAuthProvider();
  // Login only — no calendar scope bundled in here. Calendar connection is
  // a fully separate step (see connectGoogleCalendar below) using Google's
  // own token-only library, independent of this login flow.
  function reportError(msg){
    if(errEl) errEl.textContent = msg;
    showToast(msg);
  }
  try{
    // Popup, not redirect: popup has reliably completed login throughout
    // testing; redirect has repeatedly failed to return a result. Since
    // login no longer needs the calendar scope, it doesn't depend on
    // capturing an access token the way the old bundled flow did — so the
    // Chrome COOP issue that broke calendar-token capture doesn't affect
    // plain login the same way.
    await auth.signInWithPopup(provider);
  }catch(e){
    const popupFailed = e && ["auth/popup-blocked","auth/cancelled-popup-request","auth/popup-closed-by-user","auth/operation-not-supported-in-this-environment"].includes(e.code);
    if(popupFailed){
      try{ await auth.signInWithRedirect(provider); }
      catch(e2){ reportError(e2.message); }
    } else {
      reportError(e.message);
    }
  }
}

auth.onAuthStateChanged(user=>{
  const loadingScreen = document.getElementById("loading-screen");
  if(loadingScreen) loadingScreen.style.display = "none";
  if(user){
    state.user = user;
    // Only compute this fresh if we don't already know we're connected —
    // this listener can re-fire after a successful token grab (e.g. when
    // Firestore's own listeners re-attach), and blindly recomputing here
    // using a possibly-stale read of googleAccessToken can silently
    // overwrite a real, just-completed connection back to "disconnected."
    if(!state.googleConnected){
      const sessionToken = loadTokenFromSession();
      if(sessionToken){
        state.googleAccessToken = sessionToken;
        state.googleConnected = true;
      } else {
        state.googleConnected = user.providerData.some(p=>p.providerId==="google.com") && !!state.googleAccessToken;
      }
    }
    document.getElementById("auth-screen").classList.add("hidden");
    document.getElementById("app-shell").classList.remove("hidden");
    attachListeners(user.uid);
  } else {
    state.user = null;
    state.googleAccessToken = null;
    state.googleConnected = false;
    clearTokenFromSession();
    document.getElementById("auth-screen").classList.remove("hidden");
    document.getElementById("app-shell").classList.add("hidden");
    if(unsubCases) unsubCases(); if(unsubTasks) unsubTasks(); if(unsubChecklist) unsubChecklist(); if(unsubSettings) unsubSettings();
  }
});

function attachListeners(uidVal){
  unsubCases = db.collection("users").doc(uidVal).collection("cases").onSnapshot(snap=>{ state.cases = snap.docs.map(d=>({id:d.id, ...d.data()})); migrateLegacyCaseStatuses(); render(); });
  unsubTasks = db.collection("users").doc(uidVal).collection("tasks").onSnapshot(snap=>{ state.tasks = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); });
  unsubChecklist = db.collection("users").doc(uidVal).collection("checklist").onSnapshot(snap=>{ state.checklist = snap.docs.map(d=>({id:d.id, ...d.data()})); dedupeOverdueHearingReminders(); render(); });
  unsubSettings = db.collection("users").doc(uidVal).collection("meta").doc("settings").onSnapshot(snap=>{
    const d = snap.data() || {};
    state.alertDays = d.alertDays ?? 7;
    state.customCaseTypes = d.customCaseTypes || [];
    state.customProcedureTypes = d.customProcedureTypes || [];
    state.checklistTemplates = d.checklistTemplates || {};
    state.hearingPrepDefaults = d.hearingPrepDefaults || [];
    state.deadlinePresets = d.deadlinePresets || DEFAULT_DEADLINE_PRESETS.slice();
    state.letterhead = d.letterhead || {name:"",subtitle:"",contact:""};
    state.lang = d.lang || "en";
    applyLanguageDir();
    state.onboardDismissed = !!d.onboardDismissed;
    state.calendarEverConnected = !!d.calendarEverConnected;
    const wasUnset = !state.hasSeenQuickRef && !d.hasSeenQuickRef;
    state.hasSeenQuickRef = !!d.hasSeenQuickRef;
    render();
    if(wasUnset && !document.getElementById("modal-root").innerHTML){
      state.hasSeenQuickRef = true; saveSettings();
      openQuickReference(true);
    }
  });
}
function saveSettings(){
  coll("meta").doc("settings").set({ alertDays: state.alertDays, customCaseTypes: state.customCaseTypes, customProcedureTypes: state.customProcedureTypes, onboardDismissed: state.onboardDismissed, calendarEverConnected: state.calendarEverConnected, hasSeenQuickRef: state.hasSeenQuickRef, checklistTemplates: state.checklistTemplates, hearingPrepDefaults: state.hearingPrepDefaults, deadlinePresets: state.deadlinePresets, letterhead: state.letterhead, lang: state.lang });
}
function stripId(t){ const {id, ...rest}=t; return rest; }

function saveCase(data){
  if(data.id){ const {id, ...rest} = data; return coll("cases").doc(id).set(rest); }
  const {id, ...rest} = data; return coll("cases").add({...rest, createdAt: Date.now()});
}
// The generic "Pending" status was retired in favor of three specific workflow
// stages. Any case still holding the old value gets moved to the earliest of the
// three (Pending Partner Review) — a one-time, self-limiting migration: once a
// case's status changes, it no longer matches "Pending" and this stops touching it.
function migrateLegacyCaseStatuses(){
  state.cases.filter(c=>c.status==="Pending").forEach(c=>{
    coll("cases").doc(c.id).set({...stripId(c), status:"Pending Partner Review"});
  });
}
// checkOverdueHearings used to dedupe per hearing-task rather than per case, so a
// case with several stale un-logged hearings could accumulate one reminder each.
// One-time, self-limiting cleanup: for any case with more than one open "get the
// next hearing date" reminder, keep the earliest and delete the rest. Stops
// touching a case as soon as it's down to one (or zero).
function dedupeOverdueHearingReminders(){
  const seenCaseIds = new Set();
  state.checklist
    .filter(x=>x.text && x.text.indexOf("Get the next hearing date")===0 && !x.done)
    .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))
    .forEach(x=>{
      if(seenCaseIds.has(x.caseId)){ coll("checklist").doc(x.id).delete(); }
      else seenCaseIds.add(x.caseId);
    });
}
function deleteCaseDoc(id){
  coll("cases").doc(id).delete();
  state.tasks.filter(t=>t.caseId===id).forEach(t=>{ coll("tasks").doc(t.id).delete(); if(t.googleEventId) deleteFromGoogleCalendar(t.googleEventId); });
  state.checklist.filter(c=>c.caseId===id).forEach(c=> coll("checklist").doc(c.id).delete());
  // remove from other cases' linkedCaseIds
  state.cases.forEach(c=>{ if(c.linkedCaseIds && c.linkedCaseIds.includes(id)){ coll("cases").doc(c.id).set({...stripId(c), linkedCaseIds: c.linkedCaseIds.filter(x=>x!==id)}); } });
}
async function saveTask(data){
  let docId = data.id;
  const payload = stripId(data);
  if(docId){ await coll("tasks").doc(docId).set(payload); }
  else { const ref = await coll("tasks").add(payload); docId = ref.id; }
  // push to google calendar if connected
  if(state.googleConnected && state.googleAccessToken){
    const caseItem = state.cases.find(c=>c.id===payload.caseId);
    const result = await pushToGoogleCalendar({...payload, id:docId}, caseItem);
    if(result && result.needsReconnect){ state.googleConnected=false; clearTokenFromSession(); render(); }
    else if(result && result.error){ showToast(result.message); }
    else if(result && result.id){
      coll("tasks").doc(docId).set({...payload, googleEventId: result.id, googleEventLink: result.link || null});
    }
  }
  return docId;
}
function deleteTaskDoc(id){
  const t = state.tasks.find(x=>x.id===id);
  coll("tasks").doc(id).delete();
  if(t && t.googleEventId) deleteFromGoogleCalendar(t.googleEventId);
}

/* ================= GOOGLE CALENDAR ================= */
async function pushToGoogleCalendar(task, caseItem){
  if(!state.googleAccessToken) return null;
  const summary = (caseItem ? computeCaseTitle(caseItem) + " — " : "") + task.title;
  // Reminders come from Google Calendar's own app — which already has real
  // background/lock-screen push permission on your phone — rather than
  // anything Docket could build itself without a server. Critical dates get
  // an extra, earlier reminder on top of the normal pair.
  const overrides = task.flag==="critical"
    ? [{method:"popup", minutes: 3*24*60}, {method:"popup", minutes: 24*60}, {method:"popup", minutes: 60}]
    : [{method:"popup", minutes: 24*60}, {method:"popup", minutes: 60}];
  const body = { summary, description: task.notes||"", start:{date: task.date}, end:{date: addDays(task.date,1)}, reminders: { useDefault:false, overrides } };
  try{
    let url = "https://www.googleapis.com/calendar/v3/calendars/primary/events";
    let method = "POST";
    if(task.googleEventId){ url += "/" + task.googleEventId; method = "PUT"; }
    const res = await fetch(url, { method, headers:{ "Authorization":"Bearer "+state.googleAccessToken, "Content-Type":"application/json" }, body: JSON.stringify(body) });
    if(res.status===401 || res.status===403){ return {needsReconnect:true}; }
    if(!res.ok){
      let detail = "";
      try{ const errBody = await res.json(); detail = errBody?.error?.message || ""; }catch(e){}
      return { error:true, message: `Google Calendar declined the sync (${res.status})${detail?": "+detail:""}.` };
    }
    const data = await res.json();
    return { id: data.id, link: data.htmlLink || null };
  }catch(e){
    console.error("calendar push failed", e);
    return { error:true, message: "Couldn't reach Google Calendar — check your connection and try again." };
  }
}
async function deleteFromGoogleCalendar(eventId){
  if(!state.googleAccessToken || !eventId) return;
  try{ await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, { method:"DELETE", headers:{ "Authorization":"Bearer "+state.googleAccessToken } }); }catch(e){}
}
// Token persists across a page refresh via sessionStorage — but unlike
// localStorage, it's automatically wiped the moment this tab or browser
// closes, so it doesn't linger indefinitely. Still requires reconnecting
// once the token actually expires (~1hr) or in a brand new tab/session.
function saveTokenToSession(accessToken, expiresInSeconds){
  try{
    const expiresAt = Date.now() + (Number(expiresInSeconds || 3300) * 1000);
    sessionStorage.setItem("docket_g_token", accessToken);
    sessionStorage.setItem("docket_g_token_expiry", String(expiresAt));
  }catch(e){ /* sessionStorage unavailable — connection just won't survive a refresh */ }
}
function loadTokenFromSession(){
  try{
    const token = sessionStorage.getItem("docket_g_token");
    const expiry = Number(sessionStorage.getItem("docket_g_token_expiry") || 0);
    if(token && expiry && Date.now() < expiry) return token;
    if(token){ sessionStorage.removeItem("docket_g_token"); sessionStorage.removeItem("docket_g_token_expiry"); }
  }catch(e){}
  return null;
}
function clearTokenFromSession(){
  try{ sessionStorage.removeItem("docket_g_token"); sessionStorage.removeItem("docket_g_token_expiry"); }catch(e){}
}

let gisTokenClient = null;
function getGisTokenClient(){
  if(gisTokenClient) return gisTokenClient;
  if(!window.google || !window.google.accounts || !window.google.accounts.oauth2){
    showToast(tr('gcal_lib_loading'));
    return null;
  }
  gisTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: window.GOOGLE_OAUTH_CLIENT_ID,
    scope: "https://www.googleapis.com/auth/calendar.events",
    callback: (tokenResponse)=>{
      if(tokenResponse && tokenResponse.access_token){
        state.googleAccessToken = tokenResponse.access_token;
        state.googleConnected = true;
        state.calendarEverConnected = true;
        saveTokenToSession(tokenResponse.access_token, tokenResponse.expires_in);
        saveSettings();
        showToast(tr('gcal_connected_toast'));
        render();
        if(state.tasks.filter(t=>!t.completed && !t.googleEventId).length > 0){
          syncAllUnsynced(true);
        }
      } else {
        showToast(tr('gcal_no_access'));
      }
    },
    error_callback: (err)=>{
      if(err && err.type==="popup_closed") return; // user just changed their mind, no need to alarm them
      showToast(tr('gcal_connect_failed',{err: err && err.type ? err.type : tr('unknown_error_word')}));
    }
  });
  return gisTokenClient;
}
// Connecting Google Calendar is now fully independent of how you signed
// into Docket (email/password or Google) — this uses Google's own
// token-only library (Google Identity Services), not Firebase's
// popup/redirect sign-in, which sidesteps both problems we hit with those:
// Chrome's popup-isolation policy, and getRedirectResult() unreliability.
window.connectGoogleCalendar = ()=>{
  const client = getGisTokenClient();
  if(client) client.requestAccessToken();
};
window.syncAllUnsynced = async (silent)=>{
  if(!state.googleConnected || !state.googleAccessToken){ if(!silent) showToast(tr('connect_gcal_first_toast')); return; }
  const unsynced = state.tasks.filter(t=>!t.completed && !t.googleEventId);
  if(unsynced.length===0){ if(!silent) showToast(tr('nothing_to_sync_toast')); return; }
  if(!silent) showToast(tr('syncing_toast',{n:unsynced.length, suffix:unsynced.length===1?'':'s'}));
  let successCount = 0;
  for(const t of unsynced){
    const caseItem = state.cases.find(c=>c.id===t.caseId);
    const result = await pushToGoogleCalendar(t, caseItem);
    if(result && result.needsReconnect){ state.googleConnected=false; clearTokenFromSession(); showToast(tr('reconnect_needed_toast')); render(); return; }
    if(result && result.id){
      await coll("tasks").doc(t.id).set({...stripId(t), googleEventId: result.id, googleEventLink: result.link || null});
      successCount++;
    }
  }
  showToast(silent ? tr('caught_up_toast',{n:successCount, suffix:successCount===1?'':'s'}) : tr('synced_toast',{n:successCount, total:unsynced.length, suffix:unsynced.length===1?'':'s'}));
  if(!silent) closeModal();
};
window.reconnectGoogle = window.connectGoogleCalendar;
function showToast(message){
  const el = document.createElement("div");
  el.className = "app-toast";
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add("show"); }, 10);
  setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>el.remove(), 400); }, 5000);
}

/* ================= RENDER ================= */
// A Hearing that passed uncompleted and was never run through Continue Session
// means the lawyer never got a new date logged — surface that as a checklist
// item automatically rather than letting it sit silently in "Overdue". Dedupes
// per CASE (not per individual hearing task) — if a case has piled up several
// stale, un-logged hearings, that's still just one thing to go sort out, not
// one reminder per hearing. Guarded two ways: an in-memory set for same-session
// re-renders (Firestore round-trips aren't instant), and a check against
// state.checklist for anything that survives a reload.
window._autoOverdueHandled = window._autoOverdueHandled || new Set();
function checkOverdueHearings(overdueItems){
  const byCaseId = {};
  overdueItems.filter(t=>t.type==="Hearing" && t.caseId).forEach(t=>{
    (byCaseId[t.caseId] = byCaseId[t.caseId] || []).push(t);
  });
  Object.keys(byCaseId).forEach(caseId=>{
    if(window._autoOverdueHandled.has(caseId)) return;
    const already = state.checklist.some(x=>x.caseId===caseId && x.text.indexOf("Get the next hearing date")===0 && !x.done);
    window._autoOverdueHandled.add(caseId);
    if(already) return;
    const t = byCaseId[caseId][0];
    const caseItem = state.cases.find(c=>c.id===caseId);
    const label = caseItem ? computeCaseTitle(caseItem) : "";
    saveChecklistItem({ caseId, text:`Get the next hearing date — ${label}`, done:false, taskId:t.id, followNextHearing:false, dueDate:null });
  });
}
function syncStaticChrome(){
  document.getElementById("tab-calendar-label").textContent = tr("tab_calendar");
  document.getElementById("tab-cases-label").textContent = tr("tab_cases");
  document.getElementById("tab-checklist-label").textContent = tr("tab_checklist");

}
function render(){
  syncStaticChrome();
  ["calendar","cases","checklist"].forEach(v=>{
    document.getElementById("tab-"+v).classList.toggle("active", state.view===v);
    document.getElementById("view-"+v).classList.toggle("hidden", state.view!==v);
  });

  const tk = todayKey();
  const upcoming = state.tasks.filter(t=>!t.completed).map(t=>({...t, delta: daysBetween(tk,t.date)})).sort((a,b)=>a.date.localeCompare(b.date));
  const headsUpItems = upcoming.filter(t=> t.delta>=0 && (t.delta<=state.alertDays || (t.flag==="fyi" && t.delta<=7)) && t.flag!=="critical");
  const overdueItems = upcoming.filter(t=>t.delta<0);
  state._headsUpItems = headsUpItems;
  state._overdueItems = overdueItems;
  checkOverdueHearings(overdueItems);
  const staleCases = state.cases.filter(c=> c.status==="Active" && !state.tasks.some(t=>t.caseId===c.id && !t.completed));
  state._staleCases = staleCases;

  const badges = document.getElementById("header-badges");
  badges.innerHTML = (overdueItems.length>0?`<button class="badge" onclick="toggleBadgeMenu('overdue')" style="border-color:#E5A39B;color:#E5A39B;background:none;cursor:pointer;">${overdueItems.length} overdue</button>`:"") +
                      (headsUpItems.length>0?`<button class="badge" onclick="toggleBadgeMenu('headsup')" style="border-color:var(--brass);color:var(--brass);background:none;cursor:pointer;">${headsUpItems.length} due soon</button>`:"") +
                      (staleCases.length>0?`<button class="badge" onclick="toggleBadgeMenu('stale')" style="border-color:var(--slate);color:var(--slate);background:none;cursor:pointer;">${staleCases.length} no upcoming dates</button>`:"");
  renderBadgeMenu();

  renderInstallBanner();
  renderReconnectBanner();
  if(state.view==="calendar") renderCalendar(upcoming);
  else if(state.view==="cases") renderCases();
  else renderChecklist();
}

// already reads via caseCardHtml) — the ordinary taskRowHtml puts the task title

function badgeMenuRowHtml(t, caseItem){

    ? `<span class="badge" style="border-color:var(--overdue);color:var(--overdue);">${tr('overdue_badge')}</span>`
    : `<span class="badge" style="border-color:var(--heads-up);color:var(--heads-up);">${delta===0?tr('today_word'):delta+tr('day_abbrev')} · ${tr('headsup_badge')}</span>`;

}

/* ---- CALENDAR VIEW ---- */
// For each court represented among a set of hearings, find every OTHER open task
// tied to any case at that same court — not just items literally due that day.
// If you're already headed to a courthouse today, worth seeing everything else
// open there while you're at it.
function sameCourtOpenItems(hearingsList, casesById){
  const courts = new Set();
  const shownIds = new Set(hearingsList.map(t=>t.id));
  hearingsList.forEach(t=>{ const c = casesById[t.caseId]; if(c && c.court) courts.add(c.court); });
  const byCourt = {};
  courts.forEach(court=>{
    const tasks = state.tasks.filter(t=>{
      if(shownIds.has(t.id) || t.completed) return false;
      const c = casesById[t.caseId];
      return c && c.court===court;
    }).map(t=>({...t, delta:daysBetween(todayKey(),t.date)})).sort((a,b)=>a.date.localeCompare(b.date));
    const checklist = state.checklist.filter(x=>{
      if(x.done) return false;
      const c = casesById[x.caseId];
      return c && c.court===court;
    });
    if(tasks.length || checklist.length) byCourt[court] = { tasks, checklist };
  });
  return byCourt;
}
function sameCourtBlockHtml(byCourt, casesById){
  const tasksById = {}; state.tasks.forEach(t=>tasksById[t.id]=t);
  return Object.keys(byCourt).map(court=>`
    <div style="margin:8px 0 4px;">

    ${byCourt[court].checklist.map(it=>checklistItemRowHtml(it, casesById, tasksById)).join("")}
  `).join("");
}

function taskRowHtml(t, caseItem, showDate){
  const isDeadline = t.kind==="deadline";
  const isCritical = t.flag==="critical";
  const isFyi = t.flag==="fyi";
  const overdue = t.delta<0 && !t.completed;
  // Heads-up: automatic (within your alertDays window) OR manually forced via the FYI flag,
  // whichever gives more notice. Critical and Overdue are the only two colors that override
  // the icon itself — everything else keeps its normal category color, with urgency shown
  // only via the badge text, so "what it is" and "how urgent" never get confused for each other.
  const autoHeadsUp = !overdue && showDate && t.delta<=state.alertDays && t.delta>=0;
  const fyiHeadsUp = isFyi && !overdue && typeof t.delta==="number" && t.delta<=7 && t.delta>=0;
  const headsUp = !isCritical && (autoHeadsUp || fyiHeadsUp);
  const baseIcon = iconForProcedure(t.type);
  const baseColor = colorForProcedure(t.type);
  const icon = baseIcon;
  const color = overdue ? "var(--overdue)" : (isCritical ? "var(--critical)" : baseColor);
  const countdownLabel = t.delta===0 ? tr('today_word') : `${t.delta}${tr('day_abbrev')}`;
  let statusBadge = "";
  if(overdue){ statusBadge = `<span class="badge" style="border-color:var(--overdue);color:var(--overdue);">${isDeadline?tr('missed_deadline'):tr('overdue_badge')}</span>`; }
  else if(!t.completed && typeof t.delta==="number"){

          `<a href="${esc(googleCalendarAddLink(t, caseItem))}" target="_blank" onclick="event.stopPropagation()" title="${esc(tr('add_gcal_title'))}" style="color:var(--muted);display:inline-flex;">${ICONS.calendar_days}</a>`}
        ${statusBadge}
      </div>
      <div class="task-meta">${caseItem?bdi(computeCaseTitle(caseItem)):tr('no_case_linked')}${caseItem&&caseItem.court?` · ${ICONS.location_dot} ${bdi(caseItem.court)}`:""}${showDate?` · ${bdi(fmtLong(t.date))}`:""}</div>

      ${prepHtml}

    <button onclick="deleteTaskDoc('${t.id}')" style="background:none;border:none;color:var(--muted);">${ICONS.trash}</button>

}

function attachSwipeHandler(){
  const el = document.getElementById("cal-swipe-area");
  if(!el) return;
  let startX=0, startY=0, tracking=false;
  el.ontouchstart = (e)=>{ startX=e.touches[0].clientX; startY=e.touches[0].clientY; tracking=true; };
  el.ontouchend = (e)=>{
    if(!tracking) return; tracking=false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5){ gotoMonth(dx<0?1:-1); }
  };
}

function renderCases(){
  const allCaseTypes = [...CASE_TYPES, ...state.customCaseTypes];
  const courts = uniqueCourts();
  const q = state.search.trim().toLowerCase();
  const hideClosed = state.hideClosed!==false && !q;
  const filtered = state.cases.filter(c=>{
    if(hideClosed && c.status==="Closed" && state.filterStatus!=="Closed") return false;
    if(state.filterType!=="All" && c.caseType!==state.filterType) return false;
    if(state.filterStatus!=="All" && c.status!==state.filterStatus) return false;
    if(state.filterCourt && state.filterCourt!=="All" && c.court!==state.filterCourt) return false;
    if(!q) return true;
    const title = computeCaseTitle(c).toLowerCase();
    const partyMatch = (c.parties||[]).some(p=>p.name.toLowerCase().includes(q));
    return title.includes(q) || (c.courtNumber||"").toLowerCase().includes(q) || (c.court||"").toLowerCase().includes(q) || (c.subject||"").toLowerCase().includes(q) || (c.partialNumber||"").toLowerCase().includes(q) || (c.generalNumber||"").toLowerCase().includes(q) || partyMatch;
  }).sort((a,b)=> (b.priority?1:0)-(a.priority?1:0) || (b.createdAt||0)-(a.createdAt||0));

  const closedCount = state.cases.filter(c=>c.status==="Closed").length;

  let courtBlock = "";
  if(state.filterCourt && state.filterCourt!=="All"){
    const tk = todayKey();
    const caseIdsHere = new Set(state.cases.filter(c=>c.court===state.filterCourt).map(c=>c.id));
    const casesById = {}; state.cases.forEach(c=>casesById[c.id]=c);
    const tasksHere = state.tasks.filter(t=>caseIdsHere.has(t.caseId) && !t.completed)
      .map(t=>({...t, delta: daysBetween(tk,t.date)})).sort((a,b)=>a.date.localeCompare(b.date));
    courtBlock = `<div style="margin-bottom:18px;">
      <div class="section-label">${ICONS.location_dot} ${tr('at_court_open_items',{court:esc(state.filterCourt)})}</div>
      ${tasksHere.length===0 ? `<div style="color:var(--muted);font-size:13.5px;">${tr('nothing_open_at_court')}</div>` :
        tasksHere.map(t=>taskRowHtml(t, casesById[t.caseId], true)).join("")}
    </div>`;
  }

  document.getElementById("view-cases").innerHTML = `
    <div class="search-wrap">
      <span style="position:absolute;inset-inline-start:11px;top:11px;color:var(--muted);">${ICONS.magnifying_glass}</span>

    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;">
      <select class="input" id="filter-court" style="width:auto;font-size:12.5px;padding:7px 9px;">

        ${courts.map(c=>`<option value="${esc(c)}" ${state.filterCourt===c?'selected':''}>${esc(c)}</option>`).join("")}
      </select>
      <select class="input" id="filter-type" style="width:auto;font-size:12.5px;padding:7px 9px;">
        <option value="All">${tr('all_case_types_filter')}</option>
        ${allCaseTypes.map(ty=>`<option value="${esc(ty)}" ${state.filterType===ty?'selected':''}>${esc(caseTypeLabel(ty))}</option>`).join("")}
      </select>
      <select class="input" id="filter-status" style="width:auto;font-size:12.5px;padding:7px 9px;">
        <option value="All">${tr('all_statuses_filter')}</option>
        ${STATUS_OPTIONS.map(s=>`<option value="${s}" ${state.filterStatus===s?'selected':''}>${esc(statusLabel(s))}</option>`).join("")}
      </select>
    </div>
    ${closedCount>0 ? `<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:12px;">
      <input type="checkbox" id="toggle-closed" ${state.hideClosed===false?'':'checked'} /> ${tr('hide_closed_cases',{n:closedCount})}
    </label>` : ""}
    ${courtBlock}
    ${filtered.length===0 ? `<div style="text-align:center;padding:40px 10px;color:var(--muted);">${ICONS.scale_balanced}<br/><div style="font-size:14px;margin-top:8px;">${tr('no_matters_yet')}</div></div>` :
      `<div>${filtered.map(c=>caseCardHtml(c)).join("")}</div>`}
  `;
  document.getElementById("search-input").oninput = e=>{ const pos=e.target.selectionStart; state.search=e.target.value; renderCases(); const el=document.getElementById("search-input"); el.focus(); el.setSelectionRange(pos,pos); };
  document.getElementById("filter-court").onchange = e=>{ state.filterCourt=e.target.value; render(); };
  document.getElementById("filter-type").onchange = e=>{ state.filterType=e.target.value; render(); };
  document.getElementById("filter-status").onchange = e=>{ state.filterStatus=e.target.value; render(); };
  const tc = document.getElementById("toggle-closed");
  if(tc) tc.onchange = e=>{ state.hideClosed = e.target.checked; render(); };

function daysSinceActivity(c){
  const dates = [c.createdAt ? new Date(c.createdAt).toISOString().slice(0,10) : null];
  (c.noteLog||[]).forEach(l => dates.push(l.date));
  state.tasks.filter(t=>t.caseId===c.id).forEach(t => { if(t.createdAt) dates.push(new Date(t.createdAt).toISOString().slice(0,10)); });
  state.checklist.filter(x=>x.caseId===c.id).forEach(it => { if(it.createdAt) dates.push(new Date(it.createdAt).toISOString().slice(0,10)); });
  const valid = dates.filter(Boolean);
  if(valid.length===0) return null;
  const mostRecent = valid.sort().reverse()[0];
  return daysBetween(mostRecent, todayKey());
}
function caseCardHtml(c){
  const color = colorForCaseType(c.caseType);
  const statusColor = c.status==="Closed" ? "var(--muted)" : c.status==="Active" ? "var(--sage)" : "var(--brass)";
  const groupSize = (c.linkedCaseIds||[]).filter(lid=>state.cases.some(x=>x.id===lid)).length;

  const locationPiece = c.court
    ? `${ICONS.location_dot} ${bdi(c.court)}${c.authorityType==="court"&&c.chamber?` (${bdi(c.chamber)})`:""}${c.authorityType==="prosecution"&&c.prosecutorInCharge?` (${bdi(c.prosecutorInCharge)})`:""}`
    : (c.caseType==="Counsel"&&c.dateReceived) ? `${ICONS.calendar_days} ${tr('received_word')} ${bdi(fmtLong(c.dateReceived))}`
    : (c.caseType==="Criminal"&&(c.partialNumber||c.generalNumber)) ? `${c.partialNumber?bdi(c.partialNumber):""}${c.partialNumber&&c.generalNumber?" · ":""}${c.generalNumber?tr('gen_abbrev')+" "+bdi(c.generalNumber):""}`
    : c.courtNumber ? bdi(c.courtNumber) : "";

  const activityDays = c.status!=="Closed" ? daysSinceActivity(c) : null;
  const nextHearing = nextHearingForCase(c.id);
  const hasCriticalOpen = state.tasks.some(t=>t.caseId===c.id && !t.completed && t.flag==="critical");

  const metaPieces = [
    `<span class="case-type-icon" style="color:${color};">${iconForCaseType(c.caseType)}</span> ${esc(caseTypeLabel(c.caseType))}`,
    locationPiece,
    nextHearing ? `${ICONS.gavel} ${tr('next_hearing_label',{date:bdi(fmtLong(nextHearing.date))})}` : "",
    (c.documents&&c.documents.length) ? `${ICONS.link} ${c.documents.length}` : "",
    groupSize>0 ? `${ICONS.link} ${tr('linked_count',{n:groupSize})}` : "",
    activityDays!==null ? tr('days_since_activity',{n:activityDays}) : ""
  ].filter(Boolean);

  const cardStyle = hasCriticalOpen
    ? 'border-color:var(--critical);border-width:1.5px;background:#FBEAE8;'
    : c.priority ? 'border-color:var(--brass);border-width:1.5px;' : '';

  return `<button class="case-card" style="${cardStyle}" onclick="openCaseDetail('${c.id}')">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
      <div class="serif" style="font-size:16px;color:var(--navy-dark);min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        ${c.priority?ICONS.star:''}${hasCriticalOpen?`<span style="color:var(--critical);">${ICONS.triangle_exclamation}</span>`:''}
        <span>${bdi(computeCaseTitle(c))}</span>
        ${c.caseType==="Counsel"?`<span class="badge" style="border-color:${color};color:${color};font-weight:600;">${tr('counsel_badge')}</span>`:''}
      </div>
      <span class="badge" style="border-color:${statusColor};color:${statusColor};flex-shrink:0;">${esc(statusLabel(c.status))}</span>
    </div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;align-items:center;flex-wrap:wrap;gap:3px;">
      ${metaPieces.map((p,i)=>i===0?p:` · ${p}`).join("")}
    </div>
  </button>`;
}

function checklistItemRowHtml(it, casesById, tasksById){
  const tk = todayKey();
  const c = casesById[it.caseId];
  const linkedTask = it.taskId ? tasksById[it.taskId] : null;
  const followedHearing = (it.followNextHearing && it.caseId) ? nextHearingForCase(it.caseId) : null;
  const effectiveTask = linkedTask || followedHearing;
  const effectiveDate = it.dueDate || (linkedTask ? linkedTask.date : null) || (followedHearing ? followedHearing.date : null);
  const hasOwnDeadline = !!it.dueDate;
  const deltaDays = effectiveDate ? daysBetween(tk, effectiveDate) : null;
  const isOverdue = effectiveDate && deltaDays<0 && !it.done;
  const rowColor = isOverdue ? "var(--overdue)" : effectiveTask ? (effectiveTask.flag==="critical" ? "var(--critical)" : colorForProcedure(effectiveTask.type)) : (hasOwnDeadline ? "var(--heads-up)" : (c ? colorForCaseType(c.caseType) : "var(--line)"));
  const rowIcon = hasOwnDeadline ? ICONS.hourglass_half : (effectiveTask ? iconForProcedure(effectiveTask.type) : (c ? iconForCaseType(c.caseType) : ""));
  const deadlineBadge = effectiveDate && !it.done
    ? (isOverdue ? `<span class="badge" style="border-color:var(--overdue);color:var(--overdue);">${tr('overdue_badge')}</span>` : `<span class="badge" style="border-color:var(--heads-up);color:var(--heads-up);">${deltaDays===0?tr('today_word'):deltaDays+tr('day_abbrev')}</span>`)
    : "";
  const metaLine = hasOwnDeadline
    ? `${tr('due_prefix',{date:bdi(fmtLong(it.dueDate))})}${c?` · ${bdi(computeCaseTitle(c))}`:""}`
    : linkedTask
    ? `${tr('before_task_prefix',{title:bdi(linkedTask.title)})} · ${bdi(fmtLong(linkedTask.date))}${c?` · ${bdi(computeCaseTitle(c))}`:""}`
    : followedHearing
    ? `${tr('before_next_hearing')} · ${bdi(fmtLong(followedHearing.date))}${c?` · ${bdi(computeCaseTitle(c))}`:""}`
    : it.followNextHearing
    ? `${tr('before_next_hearing')} ${tr('none_scheduled_yet')}${c?` · ${bdi(computeCaseTitle(c))}`:""}`
    : (c ? bdi(computeCaseTitle(c)) : "");
  return `<div class="checklist-row" style="border-inline-start:4px solid ${it.done?'var(--line)':rowColor};">
    <button class="task-check" onclick="toggleChecklistDone('${it.id}')" style="${it.done?'border-color:var(--sage);':''}">${it.done?ICONS.check:''}</button>
    <div style="flex:1;min-width:0;cursor:pointer;" onclick='openChecklistModal(${JSON.stringify(it).replace(/'/g,"&apos;")})'>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        ${rowIcon&&!it.done?`<span style="color:${rowColor};flex-shrink:0;">${rowIcon}</span>`:""}
        <span style="font-size:13.5px;font-weight:600;${it.done?'text-decoration:line-through;color:var(--muted);':''}">${bdi(it.text)}</span>
        ${deadlineBadge}
      </div>
      ${metaLine?`<div class="task-meta">${(linkedTask||it.followNextHearing)?`${ICONS.calendar_days} `:""}${metaLine}</div>`:""}
    </div>
    <button onclick="deleteChecklistItem('${it.id}')" style="background:none;border:none;color:var(--muted);">${ICONS.trash}</button>
  </div>`;
}

function nextHearingForCase(caseId){
  const tk = todayKey();
  return state.tasks.filter(t=>t.caseId===caseId && !t.completed && t.type==="Hearing")
    .sort((a,b)=>a.date.localeCompare(b.date))[0] || null;
}
window.submitChecklist = (id)=>{
  const text = document.getElementById("chk-text").value.trim();
  if(!text) return;
  const existing = id ? state.checklist.find(x=>x.id===id) : null;
  const caseId = document.getElementById("chk-case").value || null;
  // "Next hearing" only means anything with a case attached; the Date/no-date
  // choice below covers both no-case items and case items with no live hearing.
  const mode = caseId ? window._tempLinkMode : "date";
  const followNextHearing = mode === "hearing";
  const wantsDate = mode === "date" && window._tempDateSubMode === "pick";
  const dueDateInput = document.getElementById("chk-due-date");
  const data = {
    text, caseId,
    // taskId is now system-managed only (auto hearing-prep defaults, auto
    // "get the next hearing date" reminders) — this modal no longer exposes a
    // way to link to one specific existing date, so just preserve whatever
    // was already there rather than letting an incidental edit clear it.
    taskId: existing ? (existing.taskId || null) : null,
    followNextHearing,
    dueDate: (wantsDate && dueDateInput && dueDateInput.value) ? dueDateInput.value : null,
    done: existing ? existing.done : false
  };
  if(id) data.id = id;
  saveChecklistItem(data);
  closeModal();
};

window.submitTask = (id)=>{
  const title = document.getElementById("f-title").value.trim();
  const date = document.getElementById("f-date").value;
  if(!title || !date) return;
  const caseSel = document.getElementById("f-caseId");
  const type = window._tempProcType || PROCEDURE_TYPES[0];
  const kind = window._tempKind||"event";
  const existing = id ? state.tasks.find(x=>x.id===id) : null;
  const baseData = { caseId: caseSel? (caseSel.value||null) : null, type, kind, flag: window._tempFlag||"none", notes: document.getElementById("f-notes").value.trim(), completed: existing?existing.completed:false, googleEventId: existing?existing.googleEventId:null, createdAt: existing?(existing.createdAt||Date.now()):Date.now() };
  // Procedure type is now fixed to Hearing/Procedure — no custom-type registration needed.

  const repeatOn = document.getElementById("f-repeat-on");
  if(!existing && repeatOn && repeatOn.checked){
    const interval = Number(document.getElementById("f-repeat-freq").value);
    const count = Math.max(2, Math.min(20, Number(document.getElementById("f-repeat-count").value)||2));
    for(let i=0;i<count;i++){
      const occDate = addDays(date, i*interval);
      saveTask({ ...baseData, title: `${title} — Session ${i+1} of ${count}`, date: occDate });
    }
  } else {
    const data = { ...baseData, title, date };
    if(id) data.id = id;
    const savePromise = saveTask(data);
    if(!existing && type==="Hearing" && kind==="event" && state.hearingPrepDefaults.length>0){
      savePromise.then(newTaskId=>{
        state.hearingPrepDefaults.forEach(text=>{
          saveChecklistItem({ text, caseId: data.caseId, taskId: newTaskId, followNextHearing:false, dueDate:null, done:false });
        });
      });
    }
  }
  closeModal();
};

window.submitContinue = (origId)=>{
  const newDate = document.getElementById("cont-date").value;
  if(!newDate) return;
  const reason = document.getElementById("cont-reason").value.trim();
  const orig = state.tasks.find(x=>x.id===origId);
  if(!orig) return;
  const followUps = (window._tempFollowUps||[]).slice();
  const isHearing = orig.type==="Hearing" && !!orig.caseId;
  // Capture the checkbox state now, synchronously — closeModal() wipes the DOM
  // before the async .then() below resolves, same lesson as the case-hearing-date
  // fields: read anything from the form before the save, never after.
  const memoEl = document.getElementById("cont-auto-memo");
  const wantsMemo = isHearing && (!memoEl || memoEl.checked);
  saveTask({ caseId:orig.caseId, title:orig.title, date:newDate, type:orig.type, kind:orig.kind||"event", flag:orig.flag||"none", notes:orig.notes, completed:false, googleEventId:null }).then((newTaskId)=>{
    // A hearing postponement can get a "Prepare memorandum" checklist item, linked
    // via followNextHearing so its deadline always tracks whichever hearing is next
    // — including through further postponements. Skip creating a second one if an
    // unfinished memorandum item for this case is already open, and skip entirely
    // if the checkbox was unchecked for this particular postponement.
    if(wantsMemo){
      const alreadyOpen = state.checklist.some(x=>x.caseId===orig.caseId && x.followNextHearing && x.text==="Prepare memorandum" && !x.done);
      if(!alreadyOpen){
        saveChecklistItem({ caseId: orig.caseId, text:"Prepare memorandum", done:false, taskId:"", followNextHearing:true, dueDate:null });
      }
    }
    if(!followUps.length) return;
    const useFollowHearing = isHearing;
    followUps.forEach(text=>{
      saveChecklistItem({ caseId: orig.caseId||"", text, done:false, taskId: useFollowHearing?"":(newTaskId||""), followNextHearing: useFollowHearing, dueDate:null });
    });
  });
  // If this hearing had already gone overdue un-logged and picked up its automatic
  // "Get the next hearing date" checklist item, logging it here via Continue Session
  // resolves that reminder — it's served its purpose.
  const staleReminders = state.checklist.filter(x=>x.caseId===orig.caseId && x.text.indexOf("Get the next hearing date")===0 && !x.done);
  staleReminders.forEach(x=> coll("checklist").doc(x.id).set({...stripId(x), done:true}));
  if(document.getElementById("cont-markdone").checked){
    coll("tasks").doc(origId).set({...stripId(orig), completed:true, postponeReason: reason || orig.postponeReason || null});
  } else if(reason){
    coll("tasks").doc(origId).set({...stripId(orig), postponeReason: reason});
  }
  closeModal();
};

window.confirmRulingIssued = (t)=>{
  coll("tasks").doc(t.id).set({...stripId(t), completed:true});
  const c = state.cases.find(x=>x.id===t.caseId);
  if(c){
    const newLog = [...(c.noteLog||[]), { id: uid(), date: todayKey(), text: tr('ruling_issued_log_text',{title:t.title}) }];
    coll("cases").doc(c.id).set({...stripId(c), status:"Closed", noteLog:newLog});
  }
  // The case is closing — any outstanding "get the next hearing date" reminders
  // for it are moot now, whether tied to this specific hearing or another stale
  // one for the same case.
  state.checklist.filter(x=>x.caseId===t.caseId && x.text.indexOf("Get the next hearing date")===0 && !x.done)
    .forEach(x=> coll("checklist").doc(x.id).set({...stripId(x), done:true}));
  showToast(tr('case_closed_toast'));
  closeModal();
};

function checkDuplicateCase(){
  const el = document.getElementById("duplicate-warning");
  if(!el) return;
  if(window._editingCaseId){ el.innerHTML=""; return; }
  const candidates = [];
  const subjectEl = document.getElementById("c-subject");
  if(subjectEl && subjectEl.value.trim()) candidates.push(subjectEl.value.trim());
  const counselEl = document.getElementById("c-counsel-client");
  if(counselEl && counselEl.value.trim()) candidates.push(counselEl.value.trim());
  (window._tempParties||[]).filter(p=>p.role==="Client" && p.name && p.name.trim()).forEach(p=> candidates.push(p.name.trim()));

  const matches = [];
  candidates.forEach(cand=>{
    const cLower = cand.toLowerCase();
    if(cLower.length<3) return;
    state.cases.forEach(c=>{
      if(window._tempLinked.includes(c.id)) return;
      if(matches.some(m=>m.id===c.id)) return;
      const tLower = computeCaseTitle(c).toLowerCase();
      if(tLower.includes(cLower) || cLower.includes(tLower)) matches.push(c);
    });
  });
  el.innerHTML = matches.length ? matches.map(c=>`
    <div style="margin-top:8px;background:var(--surface);border:1px solid var(--slate);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--slate);line-height:1.5;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
      <span>${ICONS.info} ${tr('similar_case_warning',{title:bdi(computeCaseTitle(c))})}</span>
      <button type="button" class="btn-ghost" style="font-size:11px;padding:4px 8px;flex-shrink:0;" onclick="linkDuplicateCase('${c.id}')">${tr('link_instead_btn')}</button>
    </div>`).join("") : "";
}
window.linkDuplicateCase = (id)=>{
  if(!window._tempLinked.includes(id)) window._tempLinked.push(id);
  renderLinkList(window._editingCaseId);
  checkDuplicateCase();
  showToast(tr('linked_duplicate_toast'));
};
function checkConflicts(){
  const el = document.getElementById("conflict-warning");
  if(!el) return;
  const selfId = window._editingCaseId;
  const warnings = [];
  window._tempParties.forEach(p=>{
    const name = (p.name||"").trim().toLowerCase();
    if(!name) return;
    state.cases.forEach(c=>{
      if(c.id===selfId) return;
      (c.parties||[]).forEach(op=>{
        const opName = (op.name||"").trim().toLowerCase();
        const crossesSides = (op.role==="Opponent" && p.role!=="Opponent") || (p.role==="Opponent" && op.role!=="Opponent");
        if(opName===name && crossesSides){
          warnings.push(tr('conflict_warning',{name:bdi(p.name), role:esc(partyRoleLabel(op.role)), caseTitle:bdi(computeCaseTitle(c))}));
        }
      });
    });
  });
  el.innerHTML = warnings.length ? `<div style="margin-top:8px;background:#FBEAE8;border:1px solid #E5A39B;border-radius:6px;padding:8px 10px;font-size:12px;color:var(--brick);line-height:1.5;">${ICONS.triangle_exclamation} ${[...new Set(warnings)].join("<br/>")}</div>` : "";
}

window.submitCase = (id)=>{
  const caseType = getCaseTypeValue() || CASE_TYPES[0];
  ensureCustomCaseType(caseType);
  const isCounsel = caseType === "Counsel";
  const isCriminal = caseType === "Criminal";

  let data;
  if(!caseType){ alert(tr('choose_case_type_alert')); return; }
  if(isCounsel){
    const clientName = document.getElementById("c-counsel-client").value.trim();
    const subject = document.getElementById("c-counsel-subject").value.trim();
    if(!clientName){ alert("Add the client's name so this matter can be identified."); return; }
    data = {
      titleSource: "client",
      subject,
      parties: [{ id: uid(), role: "Client", name: clientName, phone:"", email:"" }],
      court: "", courtNumber: document.getElementById("c-court").value.trim(),
      authorityType: null, chamber: "", prosecutorInCharge: "",
      dateReceived: document.getElementById("c-date-received").value || todayKey(),
      caseType, status: document.getElementById("c-status").value, priority: !!document.getElementById("c-priority").checked,
      notes: document.getElementById("c-notes").value.trim(), documents: window._tempDocs,
      linkedCaseIds: window._tempLinked, noteLog: window._tempNoteLog || []
    };
  } else {
    const parties = window._tempParties.filter(p=>p.name.trim()).map(p=>({...p, name:p.name.trim()}));
    data = {
      titleSource: window._tempTitleSource, subject: document.getElementById("c-subject").value.trim(),
      parties, court: document.getElementById("c-courtname").value.trim(),
      courtNumber: isCriminal ? "" : document.getElementById("c-court").value.trim(),
      partialNumber: isCriminal ? document.getElementById("c-partial-number").value.trim() : "",
      generalNumber: isCriminal ? document.getElementById("c-general-number").value.trim() : "",
      authorityType: window._tempAuthorityType || "court",
      chamber: document.getElementById("c-chamber") ? document.getElementById("c-chamber").value.trim() : "",
      prosecutorInCharge: document.getElementById("c-prosecutor") ? document.getElementById("c-prosecutor").value.trim() : "",
      caseType, status: document.getElementById("c-status").value, priority: !!document.getElementById("c-priority").checked,
      notes: document.getElementById("c-notes").value.trim(), documents: window._tempDocs,
      linkedCaseIds: window._tempLinked, noteLog: window._tempNoteLog || []
    };
    if(data.parties.length===0 && !data.subject){ alert("Add at least one party name or a subject so this case can be identified."); return; }
  }
  const isNewCase = !id;
  if(id) data.id = id; else data.createdAt = Date.now();

  // Capture the optional "add a hearing date now" fields BEFORE closeModal() wipes
  // the DOM — this whole block runs inside saveCase().then(), which resolves after
  // the modal is already closed, so any document.getElementById() in there would
  // return null. Read the values now, use the captured copies later.
  const hearingOnEl = document.getElementById("c-add-hearing-on");
  const hearingData = (isNewCase && hearingOnEl && hearingOnEl.checked) ? {
    title: document.getElementById("c-hearing-title").value.trim(),
    date: document.getElementById("c-hearing-date").value,
    type: window._tempCaseHearingType || PROCEDURE_TYPES[0]
  } : null;

  // sync reciprocal links: add this case to the linked cases' own linkedCaseIds too
  const finalId = id || uid();
  saveCase(data).then((ref)=>{
    const myId = id || finalId;
    window._tempLinked.forEach(otherId=>{
      const other = state.cases.find(x=>x.id===otherId);
      if(other && !(other.linkedCaseIds||[]).includes(myId)){
        coll("cases").doc(otherId).set({...stripId(other), linkedCaseIds:[...(other.linkedCaseIds||[]), myId]});
      }
    });
    if(isNewCase){
      const newCaseId = ref && ref.id ? ref.id : myId;
      const template = state.checklistTemplates[caseType] || [];
      template.forEach(text=>{
        saveChecklistItem({ caseId: newCaseId, text, done:false, taskId:"", followNextHearing:false, dueDate:null });
      });
      if(hearingData && hearingData.date){
        saveTask({ caseId: newCaseId, title: hearingData.title || hearingData.type, date: hearingData.date, type: hearingData.type, kind:"event", flag:"none", notes:"", completed:false, googleEventId:null, createdAt: Date.now() });
      }
    }
  });
  closeModal();
};

window.addLogEntry = (caseId)=>{
  const input = document.getElementById("log-entry-input");
  const text = input.value.trim();
  if(!text) return;
  const c = state.cases.find(x=>x.id===caseId);
  if(!c) return;
  const newLog = [...(c.noteLog||[]), { id: uid(), date: todayKey(), text }];
  coll("cases").doc(caseId).set({...stripId(c), noteLog: newLog}).then(()=>{
    openCaseDetailModal({...c, noteLog: newLog});
  });
};
window.editLogEntry = (caseId, logId)=>{
  const c = state.cases.find(x=>x.id===caseId);
  if(!c) return;
  const entry = (c.noteLog||[]).find(l=>l.id===logId);
  if(!entry) return;
  const newText = prompt(tr('edit_log_entry_prompt'), entry.text);
  if(newText===null || !newText.trim()) return;
  const newLog = (c.noteLog||[]).map(l=> l.id===logId ? {...l, text:newText.trim()} : l);
  coll("cases").doc(caseId).set({...stripId(c), noteLog:newLog}).then(()=>{
    openCaseDetailModal({...c, noteLog:newLog});
  });
};
window.deleteLogEntry = (caseId, logId)=>{
  const c = state.cases.find(x=>x.id===caseId);
  if(!c) return;
  const newLog = (c.noteLog||[]).filter(l=>l.id!==logId);
  coll("cases").doc(caseId).set({...stripId(c), noteLog:newLog}).then(()=>{
    openCaseDetailModal({...c, noteLog:newLog});
  });
};
window.logPartyContact = (caseId, partyName, kind)=>{
  const c = state.cases.find(x=>x.id===caseId);
  if(!c) return;
  const text = kind==="call" ? tr('called_log_text',{name:partyName}) : tr('emailed_log_text',{name:partyName});
  const newLog = [...(c.noteLog||[]), { id: uid(), date: todayKey(), text }];
  coll("cases").doc(caseId).set({...stripId(c), noteLog: newLog}).then(()=>{
    showToast(tr('logged_to_case_log_toast'));
    openCaseDetailModal({...c, noteLog: newLog});
  });
};

      <div class="modal-head"><h2 class="serif" style="font-size:20px;color:var(--navy-dark);margin:0;">${ICONS.hourglass_half} Statutory Deadline Calculator</h2><button class="icon-btn" onclick="closeModal()">${ICONS.xmark}</button></div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5;">Counts the way Libya's Code of Civil &amp; Commercial Procedure does (Art. 16 &amp; 19): the start date itself isn't counted, and if the final day lands on the weekend (Friday or Saturday) it extends to the next working day. General reference, not legal advice — confirm any live deadline before relying on it.</div>

      <div class="field"><span class="field-label">Start date — notification / service / triggering event</span><input class="input" id="dc-start" type="date" value="${todayKey()}" onchange="clearDeadlineResult()" /></div>

      <div class="field"><span class="field-label">Deadline type</span>
        <select class="input" id="dc-preset" onchange="applyDeadlinePreset()">
          <option value="">Custom — type the number of days</option>
          ${state.deadlinePresets.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join("")}
        </select>
      </div>
      <div class="field"><span class="field-label">Number of days</span><input class="input" id="dc-days" type="number" min="1" value="${state.deadlinePresets[0]?state.deadlinePresets[0].days:30}" onchange="clearDeadlineResult()" /></div>
      <div class="field"><span class="field-label">Distance to court, km — optional</span><input class="input" id="dc-km" type="number" min="0" placeholder="Adds 1 day per 25km, capped at 8" onchange="clearDeadlineResult()" /></div>

      ${state.cases.length>0 ? `<div class="field"><span class="field-label">Link to a case — optional</span>
        <select class="input" id="dc-case">
          <option value="">No case</option>
          ${state.cases.map(c=>`<option value="${c.id}">${esc(computeCaseTitle(c))}</option>`).join("")}
        </select>
      </div>` : ""}

      <button type="button" class="btn-primary" style="width:100%;" onclick="computeDeadline()">Calculate</button>
      <div id="dc-result" style="margin-top:14px;"></div>

      <div style="border-top:1px solid var(--line);margin-top:18px;padding-top:14px;">
        <div class="section-label">Your saved deadline types</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
          ${state.deadlinePresets.length===0 ? `<div style="font-size:12px;color:var(--muted);">None saved.</div>` :
            state.deadlinePresets.map((p,i)=>`<span class="badge" style="border-color:var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:5px;">${esc(p.name)} (${p.days}d) <button onclick="removeDeadlinePreset(${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0;">${ICONS.xmark}</button></span>`).join("")}
        </div>
        <div style="display:flex;gap:6px;">
          <input class="input" id="dc-new-name" placeholder="Name it, e.g. Opposition" style="flex:1;" />
          <input class="input" id="dc-new-days" type="number" min="1" placeholder="Days" style="width:78px;" />
          <button class="btn-ghost" onclick="addDeadlinePreset()">Add</button>
        </div>
      </div>
    </div>
  </div>`;
};
window.clearDeadlineResult = ()=>{ const el = document.getElementById("dc-result"); if(el) el.innerHTML = ""; window._tempDeadlineResult = null; };
window.applyDeadlinePreset = ()=>{
  const sel = document.getElementById("dc-preset");
  if(sel.value==="") return;
  const p = state.deadlinePresets[Number(sel.value)];
  if(p) document.getElementById("dc-days").value = p.days;
  clearDeadlineResult();
};
window.addDeadlinePreset = ()=>{
  const name = document.getElementById("dc-new-name").value.trim();
  const days = Number(document.getElementById("dc-new-days").value);
  if(!name || !days) return;
  state.deadlinePresets = [...state.deadlinePresets, {name, days}];
  saveSettings();
  openDeadlineCalcModal();
};
window.removeDeadlinePreset = (i)=>{
  state.deadlinePresets = state.deadlinePresets.filter((_,idx)=>idx!==i);
  saveSettings();
  openDeadlineCalcModal();
};
window.computeDeadline = ()=>{
  const start = document.getElementById("dc-start").value;
  const days = Number(document.getElementById("dc-days").value)||0;
  const km = Number(document.getElementById("dc-km").value)||0;
  const resultEl = document.getElementById("dc-result");
  if(!start || days<=0){ resultEl.innerHTML = `<div style="color:var(--brick);font-size:13px;">Enter a start date and a number of days.</div>`; return; }
  const distanceDays = km>0 ? Math.min(8, Math.ceil(km/25)) : 0;
  const calc = calcStatutoryDeadline(start, days, distanceDays);
  window._tempDeadlineResult = calc;
  const caseSel = document.getElementById("dc-case");
  resultEl.innerHTML = `
    <div style="background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:4px;">Last day to act</div>
      <div class="serif" style="font-size:19px;color:var(--navy-dark);">${fmtLong(calc.date)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;">
        ${days} day${days===1?'':'s'}${distanceDays?` + ${distanceDays} distance day${distanceDays===1?'':'s'}`:''} from ${fmtLong(start)} — start date excluded from the count.
        ${calc.pushedForHoliday ? `<br/>Falls on the weekend — extended to the next working day (Sunday) per Article 19.` : ''}
      </div>
    </div>
    ${(caseSel && caseSel.value) ? `<button type="button" class="btn-ghost" style="width:100%;margin-top:10px;" onclick="saveDeadlineAsTask()">${ICONS.calendar_days} Save as a deadline for this case</button>` : ""}
  `;
};
window.saveDeadlineAsTask = ()=>{
  if(!window._tempDeadlineResult) return;
  const caseSel = document.getElementById("dc-case");
  const caseId = caseSel ? caseSel.value : "";
  if(!caseId) return;
  const presetSel = document.getElementById("dc-preset");
  const presetName = (presetSel && presetSel.value!=="") ? state.deadlinePresets[Number(presetSel.value)].name : "Statutory deadline";
  saveTask({ caseId, title: presetName, date: window._tempDeadlineResult.date, type:"Procedure", kind:"deadline", flag:"none", notes:"", completed:false, googleEventId:null, createdAt: Date.now() });
  showToast("Deadline saved to the case.");
  closeModal();
};

window.exportData = ()=>{
  const payload = { exportedAt: new Date().toISOString(), cases: state.cases, tasks: state.tasks, checklist: state.checklist };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `docket-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

if("serviceWorker" in navigator){ window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
